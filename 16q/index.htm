rplane pilot, who must accrue a certain number of flight hours, piloting a real airplane as well as a simulator, so that he learns how to handle every possible situation, mastering not only the technical aspects of how to fly his craft, but also to control his own emotions. By flying a sufficient number of hours, he makes sure that when things go south the experiences accrued to that point will keep his emotions from getting the better of him.</p><p>To his advantage, an Ace has experienced many different situations, repeatedly, and time and time again he has solved the problems these situations have thrown at him.</p><p>The same applies to a surgeon, who becomes an expert only with time, to the marketer who must deal with his client’s most outlandish requests, to the attorney who must make his bold case before a judge who will decide the fate of his client.</p><p>You can score a 9 once your training is truly “inspired” and you can fully put your mind to identifying imminent mistakes and are repeatedly performing the same activity, the same gesture, perfecting it and eliminating the mistakes made in previous attempts. A score of 9 is only for those who don’t “suffer” a single one of the trials imposed by their training, regardless of the type of training involved.</p>",
      "<p>Well, here we’re in full self-assessment mode. Simply because there’s nobody better than ourselves to truly measure our level of satisfaction upon completing a training, practice or workout session. That sense of fulfilment we experience when we have truly made the most of our time and feel like we have made a valuable contribution to our personal development; when we are certain of having enhanced our potential.</p><p>Here is a secret link between technical know-how and motivation.</p><p>A “cultural” aspect of training comes into play: one that is linked to our biases concerning deep practice.</p><p>Let’s not forget that the word sacrifice comes from Sacrum facere, meaning sacred duty. This is extremely important, and both our mindset and approach should be inspired by this meaning. In other words: deep practice has certain inherent traits that are akin to something sacred, almost ritualistic. Training is in fact a ritual and as such it must be an intentional, special moment. Every minute, hour and moment we devote to ourselves and to “learning to learn” is a journey into ourselves and towards our limits. In this, we are akin to Ulysses. Our sense of satisfaction will be commensurate not only to the enhanced technical mastery that we will experience after training, but even to more qualitative terms, such as understanding training is a ritual and that we can feel fulfilled by consciously devoting time to our journey towards becoming an Ace.</p><p>Therefore, to score a 9 in this self-assessment you must feel certain, beyond all doubt, that the ritual of training is key. You will assign yourself a 9 only if you never think of training in unpleasant terms, and only when your sense of fulfilment propels you towards a conscious and superior level of mastery.</p><blockquote><p>The initial stages of learning a skill invariably involve tedium. Yet rather than avoiding this inevitable tedium, you must accept and embrace it. The pain and boredom we experience in the initial stage of learning a skill toughens our minds. [...] The pain is a kind of challenge your mind presents - will you learn how to focus and move past the boredom, or like a child will you succumb to the need for immediate pleasure and distraction?</p><p>Robert Greene – Mastery</p></blockquote><p>That is the key point. You will give yourself a 9 when suffering is a challenge that rewards you with satisfaction upon completing the activity.</p><p>We must remember that successful people often had the opportunity as children to feel like they were particularly good at something; be it an activity, a subject at school, a game, a sport or a musical instrument; and were praised by others and made to feel unique and special for it. So, you can aim for a 9 if you are truly in this emotional framework; when you are fully conscious that every training and self-improvement process must go through the stages of frustration and boredom; and that you must never give up. And your satisfaction must stem from your ability to never give up. You must thrive in the knowledge that your inner strength never surrenders, never lets the pain of training get in the way. That is a 9. Remember that frustration is key and an important sign: it means you are outside of your comfort zone; you are readjusting to a new environment; you are measuring the limits of a larger enclosure. Your satisfaction should also stem from this, and no, it is not a contradiction.</p>",
      "<p>If we stop and think about potential solutions to problems which have been afflicting us for quite some time, we might glimpse a little light at the end of the tunnel, in the form of a simple and straightforward answer.</p><p>When I was young, I was often fixated on issues that seemed unsolvable.</p><p>In time, I learned to simplify, streamline and strip down the elements of questions that concerned me directly. Because complex solutions and simple solutions are handled by different parts of our brain. The former are achieved by using our brain’s capacity to analyze the available data and to obtain further data through research, but, especially, by overcoming our ingrained reluctance to engage what Kahneman calls System 2: the part of our brain that requires more energy and that takes up a lot of our resources.</p><p>Simple solutions are based on associating ideas, images, feelings and experiences.</p><p>Research has shown that most people tend to make decisions almost exclusively in System 1, which is based on association rather than analysis.</p><p>That doesn’t mean that this system doesn’t work, but the same studies have also revealed the many contradictions and irrational conclusions it often leads to.</p><p>But why do I mention these aspects when we’re talking about measuring our Target?</p><p>Well, simply because they are key to our outcome regardless of the activity we are trying to perform.</p><p>But first, I need to clarify that a target you can’t measure is not really a target. And a target you can’t measure is a target you can’t achieve because, for our purposes, it doesn’t exist.</p><p>So, our Target needs a clear indicator, which will vary depending on the type of Target.</p><p>Our indicator can be time and a quantitative or qualitative aspect. You could define it as a specific hierarchical position you want to achieve within the corporate ladder, or a specific market share, or acquiring a unique skill, or a figure you want to reach. Obviously, it must be realistic in relation to the timeframe you have defined for it.</p><p>Which is why you must always draw a timeline between your current position and your target, and you need to make sure that that timeline is realistic and achievable.</p><p>But to have a credible, inspiring and achievable target for self-development you need to trigger System 2, the one which requires coherent analysis. You need to leave System 1 aside, as it is based on intuition and simple associations.</p><p>The more data you have available and analyze in defining your target, the closer you will be to a 9. It’s very similar to taking a photograph in manual mode.</p><p>System 1 is precisely as invasive as the autofocus on a digital camera, and will continue engaging until you turn it off, even though most of the time it helps us save time and energy. For example, when you must pick an item on a menu, or when you’re trying to decide whether you need to stand up to grab something, or if the result of 25 x 25 is closer to 625 or 1000.</p><p>And this is where things get tricky: deactivating System 1. You must be as cold and calculating as possible when you are defining your target. Every measurement must be free from preconditioning or emotions.</p><p>Don’t worry, your emotions will come into play in another self-assessment.</p><p>You might have to take several days to gather data, but this should not discourage you. There’s no need to hurry because, as in our example, if we don’t take our time focusing our picture, the photo will come out blurry and every other effort will have been in vain.</p><p>We need to be careful, as this area for improvement is constantly at risk of being oversimplified. We think we know what we want, but more often than I would like to admit I’ve had to listen to people describing confusing and contradictory targets.</p><p>There is a golden rule that we should always apply: few words, but clear. Conceptualizations are useless. What we need is a clear and summarized definition in as few words as possible.</p><p>“Risk manager for four different companies by...”, “3 million in revenue within…. ”, “Master of… by… at the latest”</p><p>This apparent simplicity conceals a careful study of all the operational aspects, steps to follow, regulatory and logistic restrictions and much more, which we must all take into account to lend credibility to our Target’s measurability.</p><p>To score a 9 in this area for improvement, you must fine-tune your ability to analyze the target. You must come to know your Target in-depth, and study it at length in order to get it into better focus. Once again, your Target is like a photograph: the more you look at it, the more you are studying it and zooming in to look at its individual pixels. Being able to analyze the picture free from any emotional preconditioning and the intuitive associations of System 1 will mean you have mastered the manual focus and you have a clearer picture in frame. Precise measurability is a picture in perfect focus.</p>",
      "<p>In my book, when I go over the topic of the Target, I mention the experience described in the famous bestseller “Zen in the Art of Archery” by Eugen Herrigel. In this book, the Zen master archer is faced with the occidental skepticism of a German philosopher who, after many years spent trying to perfect archery and failing, is finding it hard to believe in Zen’s philosophy. The master shows him what it’s like to go beyond the limits of what’s rational: bandaged and in the dark, the master shoots an arrow right into the center of the target, placed many meters away. When we internalize our Target, there is no distance between us and it, and therefore there is no way of failing.</p><p>This is the clearest description of how you can reach your target with no way of failing. I have read this great book many many times, at different stages of my life. It made me realize that most of my important victories were achieved because within my I didn’t accept any possibility of failing. I had become one with the target, I was the scope that eliminated all distance between the target and myself.</p><p>I remember when I started college: the first year the crowded classrooms and the fear of the exams kept me from learning much. This made me feel insecure and I thought I wouldn’t be able to finish my studies. One day, I accidentally stumbled upon the hall where the graduation sessions were being held. I decided to hang on and observe what was going on. I was so enraptured by the absolute solemnity of the whole thing that I ended up picturing myself standing there in just a couple of years. As I was leaving the room I looked back at the smile in the eyes of the new graduates. I left that room with a new trait that I would never forget. I left the building feeling as if I had already graduated. I was the only one to know this, but it was an absolute certainty. I graduated that day and not the day I presented my thesis! I just had to walk down the timeline to get there. My bowstring was taut, and the arrow was set, I had no reason to doubt or wonder if I would ever graduate. I had already graduated inside of me; the arrow would simply follow its inevitable path. Hitting the center of the target was unavoidable because there was no longer any distance between it and me.</p><p>In fact, I started scoring top marks in every exam until I got my degree a few years later.</p><p>The Zen master’s explanation of this “law of the Target” leaves no room for interpretation:</p><blockquote><p>“Do you know why you cannot wait for the shot and why you get out of breath before it has come? The right shot at the right moment does not come because you do not let go of yourself. You do not wait for fulfillment, but brace yourself for failure. So long as that is so, you have no choice but to call forth some thing yourself that ought to happen independently of you, and so long as you call it forth your hand will not open in the right way (…) The more obstinately you try to learn how to shoot the arrow for the sake of hitting the goal, the less you will succeed in the one and the further the other will recede. What stands in your way is that you have a much too willful will. You think that what you do not do yourself does not happen. [...]”</p><p>Eugen Herrigel – Zen in the Art of Archery</p></blockquote><p>All this links back to the concept of unconscious competence. In unconscious competence our actions are not polluted by self-doubt, perfection is entrusted to the hands of our unconscious.</p><p>In fact, the Master’s rebuttal to skepticism:</p><blockquote><p>“By letting go of yourself, leaving yourself and everything yours behind you so decisively that nothing more is left of you but a purposeless tension.”</p></blockquote><p>Therefore, you will score a 9 when your Will to reach the Target goes beyond rational.</p><p>I’d dare say the Target should almost work in the background. A background frame of reference as powerful as a never-ending echo. If you experience doubt you will be stimulating the rational or emotional dimension, which means you are not yet at 9 in this area of improvement.</p><p>Undoubtedly, this is perhaps one of the Method’s most difficult components, although without question I can say that once you have fully mastered these basic concepts, they will become a powerful support in your path to excellence. You can envision this area of improvement as a sort of gold vein that you mine in order to get to its immense riches. On the other hand, if your Target has not been truly internalized, you are leaving the door open to second-guessing yourself. The wider that gap is, the more likely you are to fail or miss your target.</p><p>This means that this self-assessment is a very important part of the A4T Method.</p><p>The road to score a 9 can be long and filled with obstacles. Those who practice meditation may find it beneficial, as it helps achieve inner silence and suspend judgment.</p>",
      "<p>Compared to the previous self-assessment, the task here seems immediately easier. As I mentioned, we move from the absence of judgment and second-guessing to a strong and unequivocal emotional dimension. Something that can distract us from the “Here and Now” and inspire in us that desire to achieve a specific target.</p><p>But the question at hand becomes more complex when our intuition identifies what’s been under the surface all along: our own dark side of the moon. The target of our innermost will is an experience focused on being rather than having.</p><p>Once again Fromm has some interesting things to say about our behavior.</p><p>Having reached this point in the overall examination of the Method, we must point out that, if you come from a “to have” perspective, in order to aim for a 9 in this area (but even in most of the others), you will need to switch to a new mindset; one more detached from things and the ownership of things, including knowledge.</p><p>Let’s not forget that only those who turn the path to self-development into a way of life truly achieve the keys to success and will never risk losing them. They can’t, because it’s simply impossible: because in the being mode they become the experience, whereas:</p><blockquote><p>“in the having mode [students] have but one aim: to hold onto what they \"learned,\" either by entrusting it firmly to their memories or by carefully guarding their notes. [...] The process of learning has an entirely different quality for students in the being mode of relatedness to the world. [...] They do not simply acquire knowledge that they can take home and memorize. Each student has been affected and has changed: each is different after the lecture than he or she was before it.”</p><p>Erich Fromm – To Have or To Be?</p></blockquote><p>So, the point is to be truly transformed by the Target. The inner strength at the core of this self-assessment is inspired by the knowledge of having started a process of self-development and of assessing ourselves.</p><p>So, based on Fromm’s words: “Optimum knowledge in the being mode is to know more deeply, while in the having mode it is to have more knowledge.” we can say that people often think they are on the path to self-development, while in reality they are merely accumulating data and information which they believe constitutes the Target, or are necessary for its achievement.</p><p>While I was reading an interview, I found this joke: “You know how you can tell a winner from a loser? It’s simple, the loser says, ‘it can be done, but it’s difficult’, while the winner says, ‘it’s difficult, but it can be done...”.</p><p>Obviously, the loser is not living for the experience, is just focusing on the goal and thus ends up seeing the glass half empty. The winner, on the other hand, is focused on the experience, he overcomes any obstacle with ease because his feelings have already conquered it. He projects himself into action, creating the right emotional framework. He sees the glass half full.</p><p>Here it’s important to remember that we are not focusing on our feelings to generate our Target, on the contrary. We focus on our feelings to confirm that our Target is worthy of its name.</p><p>To score a 9 in this area you’ll first have to train your ability to interpret the feelings that the activity induces in you. You’re looking for an enhanced emotional state that can make you feel completely indifferent to potential hardships.</p><p>You will score a 9 when your Target truly inspires you and moves you to take action. Nobody better than you can assess this.</p>",
      "<p>In this last area for improvement, we deal with some very interesting concepts.</p><p>The first is the ability to perceive every target, regardless of how big or satisfying it is, as only a partial result.</p><p>If leaving our comfort zone is a must, we need to picture our progress like the staircase of a tall skyscraper, where the landings are our larger Targets and each step is a smaller goal or target.</p><p>The concept seems easy and even logical but really grasping it requires shifting our paradigm so that it becomes our default way of thinking.</p><p>A great soccer trainer used to say: “I don’t keep trophies or medals at home. I’m always looking at what’s next, and what I’ve done in the past is worthless in the future”.</p><p>Remember that success is never final.</p><p>We need to get it into our heads that “the best is yet to come” as long as we keep the fire of our passion for excellence alive. We must really love to compete, in the Latin sense of the word: “cum petere” meaning “to head in a very precise direction”.</p><p>There are some extremely powerful tricks and shortcuts that can help. Perhaps suggesting that you spend time with other people who possess the skills you want to train may seem trite, yet in-depth studies carried by Nobel prize winners have extensively revealed that unconscious-imitational learning processes are extremely powerful. In sports, for example, it’s common knowledge that training or competing with higher level athletes leads to remarkable psycho-motor adaptive progress: the speed at which certain technical maneuvers are performed, proprioception abilities and the capacity to interpret tactical situations all drastically improve.</p><p>The same thing applies to purely intellectual activities. Talking to very eloquent people will eventually increase our vocabulary and improve our oratory skills.</p><p>Let’s not forget that research has shown that groups, regardless of the purpose for which they were created, have a certain inherent logic or an implicit set of rules that define the relations among members of said groups, influencing even the acceptance or rejection of new members.</p><p>Meaning there is a sort of predefined way of thinking, a sort of background philosophy that tends to replicate itself and reassert itself in time, even when, eventually, the subjects who founded the group are all replaced by new members. Which is why participating in groups where success is seen as a constant journey is an excellent foundation to score a 9 in this area for improvement. You need to spend time with people who are “fulfilled, yet forever hungry” for more targets.</p><p>So, identify environments with a good self-development culture and participate in them; it will help you improve faster.</p><p>You must also take a look at the people you hang out with and the groups to which you “belong”, either by choice or because you are forced to or because they are convenient to you.</p><p>There is also one more key to unlocking every one of your Targets on the road to personal excellence.</p><p>The second element required to score a 9 and which you need to assess is your perseverance.</p><p>Numerous studies have shown the importance of having true grit; especially when comparing sheer tenacity to intellectual talents.</p><p>We train ourselves to be perseverant in life from a very young age. It’s a true philosophy and way of life. Parents focused on teaching children that they must finish what they start (be it a course in music, sports, a book) have an extremely positive impact… It’s like planting the seeds for a great life.</p><p>Research has shown that the higher our calling (meaning the more closely it is linked to our moral compass) the more grit and tenacity we will have.</p><p>Those who are aiming for something Big and long term will obviously perceive obstacles and hardships as trivial matters.</p><p>Perseverance means making sure that each target is in service of the next and that all together are in service of the Target that is most closely linked with our moral compass, which we can say is our higher calling.</p><p>Let’s not forget that sometimes small adjustments can also unleash a concealed tenacity within us: a power which was always available to us but that we had never had the chance to experience.</p><p>Even simply posing yourself the question: “where do you see yourself in the long term?” can help unleash dormant perseverance. “Who will I be in ten years’ time?”</p><p>Oftentimes we hear old folks speak of the stubbornness of youth. This is because young people have their whole lives ahead of them and it inspires them to dream. And it’s precisely that “dream”, that higher Target, which defines our strength and perseverance. So, it’s not really age that defines tenacity, but rather our capacity to dream of goals that are aligned with our true nature, allowing us to project ourselves to the top of the skyscraper, step by step.</p><p>You will score a 9 when successes and targets achieved don’t satiate your hunger. You will have earned a 9 when you look at the achievement of each Target as adding grain to your granary, instead of as a set of jewels on display.</p>"
    ],
    "indicators": {
      "talent": "<p>Talent assesses your level of involvement: the amount of passion experienced while carrying out an activity and its proximity to your true inner nature. Remember: everyone has talent, but not everyone knows how to develop it! You must work at it. This area will help you discover it, measure it and more importantly: nurture it.</p>",
      "technique": "<p>Technique is the gage of your technical background: the more comprehensive it is, the less “noise” will exist between you and excellent performance. Only a level of technique that rises above average can minimize the mental engagement required to perfectly execute your activity. In as much as possible, you must strive to be in a state of \"flow\".</p>",
      "training": "<p>Training measures your ability to train and/or develop yourself methodically, in a focused and efficient manner. A low Training score is synonymous with a superficial approach and insufficient focus. Learn to be vigilant and to identify mistakes. Successful training requires focus and rigorous persistence, it needs to be treated as if it were a matter of life or death.</p>",
      "target": "<p>Target quantifies your ability to develop and focus your objectives. Your Target gives purpose to what you do. It defines whether you have traced a path to your goal with enough clarity. You are only truly aligned with this T if you have fully identified with your Target. Even though it sometimes may seem imperceptible, a good Target transforms you and changes you for the better.</p>",
      "assets": "<p>The first indicator we will look at encompasses the scores of Talent and Technique. Our Assets are our resource toolkit. They are our quiver, which will hold as many arrows as the results obtained in our self-assessments.</p><p>If you score low on this indicator it means you need to work on your hardware. In other words, on the “tools” you have available to tackle your journey, to face the competition and feel confident about the foundations for your future success. In fact, it’s hard to aspire to excellence with a faulty toolkit.</p><p>To face the competition without being properly equipped is like standing defenseless before your adversaries.</p><p>Here, we refer to the key synergies between skills and intellectual capacity.</p><p>A low score on this indicator means you must take a good look at the foundations of your project.</p><p>Why so?</p><p>Let’s take a minute and focus on the METHOD so that we may further familiarize ourselves with it.</p><p>Now obviously a low Assets score means that one of the two related Ts, or even both, have mediocre (or worse) scores.</p><p>If it’s Technique, then you need to investigate other areas of improvement even beyond Assets. If you have scored Amateur or Athlete 1 in this T it might be some time before you see it rise to an Ace level.</p><p>How long? Well, that depends on many different factors, such as how quick a learner you are, how much commitment you dedicate to it, and how long it takes you to adjust to the right mindset. In any event, one thing remains true: it takes time. Remember that the Target must be measurable and achievable in a realistic timeframe involving several steps. Therefore, if your Technique level is very low, you might have to perform another Target self-assessment to make sure it’s truly credible and that it can create the appropriate synergies.</p>",
      "impact": "<p>This indicator is determined by the Technique and Training self-assessment areas. We could call it the tip of the iceberg. It’s what others perceive as far as our technique and training are concerned. Obviously, we’re interested in having an impact on our reality.</p><p>We train, study, learn and execute in order to speed up our own very personal path to self-development, with the goal of changing things for the better.</p><p>Impact allows you to measure how the hours spent training relate to your improvements in technical skills. And this mix has an immediate impact on the perception of reality that you are building.</p><p>Picture you had to give a technical presentation on a highly complex topic before an audience of 80 people. In the days prior to it you have many doubts concerning the emotions that such a large audience and such a complex issue will induce in you.</p><p>You then start thinking about the last time you had to speak in public. It didn’t go too well. The memory alone makes your palms start sweating. Even though speaking in public is key to your line of work, because it helps boost your professional image and can be good publicity for you, Acetracker shows you the sad truth. You might have a low Impact score because despite being an excellent and outstanding professional you are unable to display this skill in public. And this in turn undermines your potential to profit on your professional skills.</p><p>You decide to work on it. You train for hours and hours with full commitment and in line with the strategies of the A4T Method. You expand the Training area and increase the score of your Impact, which still remains below the Ace level, because your Technique is still coming up short.</p><p>After many Training sessions and deep practice, you become more eloquent and speak more fluently and confidently. The fear of not being able to answer difficult questions about the complex topic disappears, because you have mastered it and handle it from the realm of unconscious competence. Answers “flow” out of you and you find exactly the right words to describe the technical content. You have reached a higher technical level! You just have to continue working on what’s left of your anxiety, which stems from not being used to speaking before a large audience.</p><p>Meanwhile, you re-assess yourself and realize that your Impact has increased and is closer to the Ace threshold. The score is related precisely to what “you can do” in the real world, it’s a measurement of the real impact you have on your reality.</p>",
      "discipline": "<p>The Discipline indicator provides several insights that allow you to look at its result from a few different perspectives.</p><blockquote><p>“There is perhaps no psychological skill more fundamental than resisting impulse. It is the root of all emotional self-control”</p><p>Daniel Goleman – Emotional Intelligence</p></blockquote><p>Goleman also points to a study on four-year-olds that was done in the sixties at a kindergarten attended by the children of teachers, employees and professionals. The children were subjects to the candy test: they were left alone in a classroom and they had the option of eating one candy immediately or receive a prize of two if they didn't eat the candy and waited for their teacher to return. The kids reacted in very interesting ways that highlight the power that impulses can have on us and our ability to resist them.</p><p>Some of them tried not to look at the candy while others tried to distract themselves by doing something else. Others yet, gave up immediately and didn’t think twice about eating the candy as soon as the teacher left the room.</p><p>Fourteen years later those same kids were subjects to another study: those who had waited for the two candies had a higher capacity to overcome obstacles and frustration, and acted with greater emotional intelligence, managing stress and displaying confidence and high self-esteem. What’s more important is that they retained the ability to not give in to instant gratification if they could wait for something more important instead.</p><p>Those who had given in to temptation tended to be more anxious, restless, shy, frustrated, stubborn, conflictive and to have lower self-esteem, and continued to be unable to postpone gratification.</p><p>Why do I mention this experiment? Simply because the Discipline indicator measures our overall ability to control our impulse for instant gratification. To learn how to delay pleasure in order to achieve something that is important to us is the true essence of Discipline.</p><p>The two Ts at the root of this value are Training and Target. More than in any other indicator these two Ts are linked very close together and are interdependent.</p><p>Successful people of any age and in any field experience pleasure and a sense of fulfilment when they can “prove themselves” worthy by being perseverant and tenacious in their Training and are finally able to overcome the obstacles that lay in their path to success.</p><p>The children who gave up easily and ate the candy immediately tended to come off as more stubborn. This is an important point, because being perseverant doesn’t mean being stubborn, because for our purposes someone who is perseverant is resolute and objective at the same time. This objectiveness comes in relation to their focus on the Target. Being able to delay gratification may require more mental flexibility and less strict and sterile compliance with simply following a set of self-imposed rules. Every individual can develop a level of balance and maturity as they increase their self-awareness on their personal development journey. An intense Training regime can trigger the start of a virtuous cycle full of enthusiasm, tenacity and motivation that will define a healthy culture of hard work.</p><p>Goleman also reminds us that the ability to delay gratification is not linked to IQ. Which is why we often see successful, highly determined people who are not outstandingly intelligent or intuitive?</p><p>So, in summary, a low Discipline score is clear red flag. You need to figure out whether it’s a problem stemming from your work ethics or if your Target is not intimately important to you and does not respond to a “higher” calling that would make you much more perseverant.</p>",
      "vision": "<p>While Impact measured the tip of the Iceberg, this indicator helps us go below the surface. It’s no coincidence that on the Acetracker we have placed it opposite to Impact.</p><p>Your vision will not be clear to you if you are unable to first understand your past, present and potential future behavior.</p><p>This indicator comprises the joint scores of Target and Talent and their synergy.</p><p>Paraphrasing a famous advertisement we could say that “Talent is nothing without Target”.</p><p>Establish synergy with a well-defined target is essential.</p><p>Otherwise your vision will express something too abstract that could actually end up undermining you.</p><p>The submerged part of our being is the one that defines our approach to life in general and is the hardest part to deal with. As an absolutely intangible indicator, when you score low on this metric you need to attentively revisit the self-assessments that lead to such a score.</p><p>An Amateur level Vision in an activity that you have a lot of experience in, for example, will mean you probably need to assess your level of frustration and potentially poor attitude towards change. It could also be a symptom of low self-esteem or an inability to identify your own needs or even worse, to deny yourself of value and dreams.</p><p>In general, the submerged part expressed by your Vision is linked to your ability to pursue your dreams. First by identifying them and making them clear, and then by fueling their fire and keeping them alive within you.</p>"
    }
  },
  "it": {
    "questions": [
      "<p>Generalmente i momenti più belli della nostra vita sono caratterizzati da uno stato emotivo quasi estatico. Le preoccupazioni svaniscono, i problemi che ci attanagliano sono sullo sfondo, i desideri scompaiono, ci sentiamo più leggeri quasi meno “vittime” della gravità. Ma quel che più colpisce a posteriori è che questo straordinario, eterogeneo complesso di sensazioni ed emozioni non pare misurabile nel tempo. Almeno secondo l’idea convenzionale che ad esso attribuiamo. E non è da escludere che proprio lo svincolarsi dal Tempo sia una delle chiavi di questa condizione estatica non potendo disconoscere la componente ansiogena insita nel suo inarrestabile procedere verso l’ineluttabile esaurimento. Il nostro Tempo quello che per destino ci è stato assegnato è immutabile. È una grandezza che non conosciamo a priori. Né il più intelligente, né il più ricco degli esseri viventi può prevedere il Tempo di cui disporrà. Paradossalmente a tale problema la maggior parte delle persone sembra assolutamente disinteressata. Lo spreco di Tempo è l’attività più diffusa e ricorrente. Raramente ci ritroviamo a discutere con qualcuno che abbia a cuore questo aspetto centrale della vita.</p><p>E non a caso quando capita ci ritroviamo al cospetto di persone particolarmente intelligenti.</p><p>Recenti ricerche ci dicono che le persone più ricche impiegano il proprio denaro per far fare ad altri quel che per loro è tedioso o poco remunerativo. Insomma, acquistano il Tempo altrui non potendo aumentare il proprio. A questo punto qualcuno obietterà che il Tempo, proprio per tal motivo, è in un certo senso cumulabile come qualsiasi altro bene.</p><p>In realtà, a ben vedere, quel che si dilata non è il Tempo inteso in senso quantitativo. Se fossimo ricchi potremmo decidere di assumere un autista, un giardiniere, un segretario e un cameriere. Al contempo, acquistare beni di lusso. Ma se non fossimo interessati a tutto questo ed avessimo a cuore il destino del mondo e dei più deboli, potremmo creare una fondazione con volontari e dipendenti oppure semplicemente effettuare ricche donazioni a quelle già esistenti ed in linea con il nostro sentire.</p><p>In tutti questi casi acquistiamo beni e servizi per migliorare la qualità del nostro Tempo, immutabile nella sua quantità disponibile (a noi del tutto sconosciuta….). Anche nell’acquistare beni, che sia giusto o meno, al di là di valutazioni morali, l’obiettivo è sentirci meglio, provare emozioni in un determinato istante o lasso temporale. Cerchiamo in tutti i modi, talvolta per tutta la vita, di aumentarne la qualità. Insomma siamo strettamente legati al concetto di Tempo. E non possiamo svincolarci dai suoi limiti quantitativi. Salvo...comprendere a fondo la relazione che abbiamo con esso.</p><p>Dicevo della sensazione che proviamo in alcuni momenti topici della nostra vita. Quelli nei quali il Tempo sembra fermarsi. Non riusciamo a descrivere quanto quel frangente sia durato. Tutti noi abbiamo vissuto almeno un’occasione in cui siamo stati talmente presi nel fare qualcosa al punto che il Tempo è sembrato scapparci di mano. Succede quando siamo assorti totalmente in qualcosa che ci prende fin nel midollo. Siamo coinvolti perché siamo identificati in quel che facciamo. E l’aspetto più sorprendente è che siamo al contempo come calati nell’operare ma incredibilmente vigili. E il Tempo non esiste. Le lancette cessano di scandire i secondi, i minuti, le ore. Siamo in quello spazio perfetto disegnato da e per noi e che gli orientali amano definire con un’espressione priva di sbavature, “Qui e Ora”.</p><p>Nessuna Pre-occupazione nel “Qui e Ora” nessun passato e nessun futuro che incombano sul nostro operato.</p><p>Dobbiamo entrare in questo “Spazio senza Tempo” per esprimerci fuori dai vincoli della Pre-occupazione. La zona franca per eccellenza prima ed oltre ogni nostra creazione mentale o semplice pensiero, fuorviante e distrattiva atta a fungere da bastone fra le ruote.</p><p>Per ottenere 9 in questa area di miglioramento devi recuperare questa sensazione, tutta personale ed intima, di sospensione del fattore temporale.</p><p>Mi darò 9 quando quell’attività in cui mi sto autovalutando e il modo in cui la svolgo (che può dipendere anche dal contesto) è capace in modo ricorrente e costante di farmi sentire fuori dal Tempo e nel “Qui e Ora”. Se inizierò a dire “Io Sono il Tempo perché sono Qui e Ora” significherà aver intrapreso il cammino verso il 9.</p>",
      "<p>Questa è l’area delle sensazioni più profonde. Non ci sono verifiche esogene che tengano. Partiamo dalla certezza che ogni attività che svolgiamo può assumere i connotati di un disvalore o di un valore. Nella nostra esistenza potrà essere un minus o un plus. Ancor di più, enfatizzando questo concetto ed utilizzando una metafora contabile possiamo dire, con tranquillità, che quel che quotidianamente abbiamo scelto di fare, ad esempio il nostro lavoro, non è soltanto un costo o un beneficio ma soprattutto un debito o un credito.</p><p>Un debito che sarò chiamato a saldare in futuro o un credito che incasserò nel tempo…. e su questa affermazione c’è poco da commentare.</p><p>Estremizziamo per spiegarci al meglio. Immaginiamo di fare un lavoro che ci rende depressi, instabili, collerici verso noi stessi e gli altri, profondamente insoddisfatti, cui diamo la colpa per ogni nostra frustrazione. Crediamo forse che non ci sia un conto da pagare? Non stiamo forse accumulando un enorme debito che prima o poi saremo chiamati a pagare?</p><p>Lo stesso valga per rapporti interpersonali (e familiari a maggior ragione) pieni di tensione.</p><p>Gli studi sugli effetti negativi di pessimismo, stress, collera, depressione, senso di frustrazione hanno prodotto, negli anni, risultati univoci. Il rischio di insorgenza di patologie e mortalità aumenta vertiginosamente. La propensione ad ammalarsi è radicalmente superiore in soggetti che presentano questi stati d’animo così negativi.</p><p>Più debiti accumuliamo più probabile il default.</p><p>Ebbene, per spiegare il concetto di “centrato” in questa area di miglioramento facciamo riferimento proprio agli stati d’animo depotenzianti o potenzianti.</p><p>Per chiunque non si senta “centrato” il consiglio chiave è proprio questo: passare dal “Perché” al “Cosa facciamo”. Quando non siamo centrati su quel che facciamo, operiamo in condizioni depotenzianti. L’immagine è quella di una zavorra talmente pesante da non permettere alla mongolfiera di volare.</p><p>Spesso quel che fa paura è mollare la fune, lasciar andare, affidarsi a sé stessi. È paradossale ma è così. Ed invece solo mollando la zavorra, la mongolfiera muta il punto di vista. Lo amplia a dismisura. Non solo si impossessa dell’idea del volo ma permette di acquisire una prospettiva privilegiata. Dall’alto tutto cambia. L’idea del mondo che ci circonda e il respiro dei progetti. Ogni cosa diviene relativa e i nodi si sciolgono. Cambia l’aria, che diviene più leggera e tutti ci sembrano così piccoli da non poterci intimorire. Possiamo finalmente tracciare senza limiti la nostra traiettoria.</p><p>Essere centrati è un plus di valore inestimabile. Non attivare stati d’animo negativi e depotenzianti è uno dei nostri compiti principali nel cammino verso l’eccellenza della performance. Anche in funzione di quel che abbiamo specificato nell’autoverifica precedente.</p><p>Essere centrati significa avere la massima presenza di spirito. Zero distrazioni, zero aggravi da pensieri inutili per la nostra causa.</p><p>Pertanto le strade da percorrere non sono tante. Se dobbiamo investire la nostra vita in una nuova attività o divenire eccellenti in quel che già facciamo dobbiamo analizzare gli stati d’animo che proviamo giornalmente con grande franchezza.</p><p>Avere il coraggio di ammettere che l’insoddisfazione ci porta lontani dal nostro ideale posizionamento.</p><p>La conseguenza più naturale è che non si avrà alcuna propensione all’investimento di tempo, denaro, coraggio e quanto necessario per eccellere.</p><p>Goleman autore di uno dei più grandi e importanti testi sulla gestione delle emozioni richiama gli studi di Mayer, il quale sostiene l’esistenza di tre categorie di persone:</p><ul><li>Gli autoconsapevoli</li><li>I sopraffatti</li><li>I rassegnati</li></ul><p>Solo se si è nella prima categoria si gestisce a proprio vantaggio ogni cosa accada e non si subiscono gli stati emotivi.</p><p>Può, comunque, capitare di non essere così grandemente disassati ma ad esempio di essere sufficientemente motivati a “spingere” (o che lo si faccia quasi per natura, per caratteristica personale) sebbene le emozioni di cui sopra facciano capolino lo stesso. In questi casi è sufficiente un lavoro di fino sugli aggiustamenti. Individuare i rapporti tra lo stato emotivo e la causa scatenante.</p><p>Quando si sente di poter “spingere” liberamente senza freni particolari nella pienezza del proprio sentire siamo sicuramente da 9 in questa specifica area.</p><p>Il segreto è una sorta di spiegazione chiara in fisica. Se sono centrato ovvero mi trovo esattamente sul mio baricentro, posso effettuare qualsiasi azione con la massima efficacia senza alcun timore di cadere.</p>",
      "<p>Entriamo, ora, nell’area della “propensione a far meglio” una determinata attività, con naturalezza al di là della Tecnica e, quindi, di ogni gesto tecnico da affinare.</p><p>Come è facile notare, in ogni contesto di T l’obiettivo è quello di scavare dentro di noi. Stimolare la riflessione su ogni utile profilo affinché ci possiamo sentire liberi da vincoli di qualsiasi natura. Se nella precedente area di miglioramento abbiamo ricercato quel baricentro, quella stabilità foriera di una volontà ferma ad investire tutto di noi stessi, qui lavoriamo su un piano ancor più sottile dal punto di vista intimistico.</p><p>Sebbene autorevoli studiosi rivelano che “Il temperamento non è destino” in quanto è possibile plasmare le proprie reazioni, educare le emozioni e gestirle, non possiamo negare che imporci di svolgere un’attività poco coerente con la nostra indole può portare a risultati devastanti nel lungo periodo. Se parliamo di contesti lavorativi sappiamo che ogni mestiere o professione assume connotati totalizzanti riguardo il tempo e il valore ad esso attribuiti nelle nostre vite. Questo significa che dedicarsi ad un mestiere che non ci si cuce bene addosso pone le basi non solo per una vita infelice ma per un depotenziamento assoluto.</p><p>Rifacciamoci quindi all’idea che il Talento sia anche e non solo una predisposizione naturale. Una dotazione di madre natura ma che da sé non garantisce il successo né monetario né di altra natura.</p><p>Alcuni dei più famosi studi condotti, negli ultimi trent’anni, sull’eccellenza delle performance umane hanno addirittura messo in evidenza una preponderante incidenza della pratica rispetto alla dote personale.</p><p>Per i più scettici che identificano, sbagliando, questa dote naturale con il QI c'è una notizia che cambierà il loro modo di vedere le cose e li spingerà ad agire: oramai è certo, che il famigerato QI incide al massimo solo per il 20% sul successo personale. E il restante ottanta è tutto nelle nostre mani!</p><p>In fondo, il Talento sfugge a misurazioni obiettive sebbene gli studiosi che si sono occupati della mielina sostengano che il talentuoso, il genio di una particolare attività, di fatto, produce più mielina della media rendendo le connessioni neuronali più efficienti. Del resto in alcune attività, ad esempio nello sport, si tratta di attimi, frazioni di secondo. Immaginiamo l’uscita dai blocchi dei centometristi in termini di rapidità di esecuzione dell’impulso allo scatto a seguito dello sparo dello starter.</p><p>Gli studi più convincenti ci dicono anche che l’intelligenza non si esprime in termini unidirezionali e soprattutto con il QI.</p><p>Questo misuratore, in particolare, appare piuttosto fuorviante. Utilizzato a partire dagli anni Cinquanta non tiene conto di aspetti centrali della vita e decisamente molto più rilevanti non solo ai fini della nostra felicità ma anche della riuscita delle nostre iniziative in ogni campo.</p><p>Analizziamo quindi la chiave di lettura di questa autoverifica dal punto di vista dell’intelligenza di cui disponiamo e che ci permette, per ovvietà di cose, di sentirci al posto giusto nello svolgimento di una determinata attività ad essa consona.</p><p>Rifacciamoci in primis alle intelligenze codificate da Howard Gardner:</p><blockquote><ul><li>Linguistica</li><li>logico-matematica</li><li>visivo-spaziali</li><li>musicale</li><li>cinestetica o procedurale</li><li>intrapersonale</li><li>interpersonale</li><li>naturalistica</li><li>esistenziale</li></ul></blockquote><p>Allora la domanda è: In quale o quali di queste intelligenze ti ritrovi? In quali di questi talenti naturali hai dato prova di essere dotato? In quali di queste caratteristiche ritrovi la tua indole?</p><p>Questo passaggio è uno dei più importanti nell’utilizzo del Metodo. Capiamo perché. Purtroppo siamo intrisi di pregiudizi e viviamo, per quanto ci si possa sforzare, immersi in un mare di stereotipi che, quasi per osmosi, tendono a condizionarci.</p><p>La nostra capacità di giudizio, nella sua dimensione più onesta ed equilibrata, è messa duramente alla prova costantemente. Numerosissimi gli studi che dimostrano i paradossi delle nostre scelte anche in ambiti delicati come quello della previdenza o della finanza. Inoltre i bias cognitivi dovuti alle associazioni maldestre e bislacche del nostro cervello teso come ogni organo a razionalizzare le risorse disponibili sono frequentissimi.</p><p>Tutto questo per ricordare che anche quando parliamo, e parlano di noi, siamo vittime di strane e paradossali associazioni che alimentano una visione distorta delle nostre reali attitudini. Salvo che queste non siano così evidenti e dominanti da essere oggettivamente inconfutabili.</p><p>Nel libro “16 Domande per cambiare la tua vita” è descritta la traiettoria tracciata quando si ha il coraggio ma anche la certezza che solo dalla propria indole, dal proprio Talento si costruisce una vita di successo e si ottiene il massimo dai propri sforzi.</p><p>Quindi è venuto il momento di analizzare a fondo quali intelligenze ci appartengono. Non neghiamo che le difficoltà maggiori si creino quando abbiamo più di una forma di intelligenza individuata da Gardner.</p><p>Così procedendo devo chiedermi:</p><ol><li>Quello che sto facendo appartiene pienamente ad una delle mie aree di intelligenza?</li><li>Se sì, le altre aree che mi caratterizzano sono utilizzate in questa attività?</li></ol><p>Se la prima domanda è molto chiara la seconda va in profondità, virando verso un pieno coinvolgimento della mia dotazione naturale.</p><p>Immaginiamo che tutti i nostri Talenti siano come bocche cui dar da mangiare e che tendano a lamentarsi quando questo non avviene. Questo lamento è un rumore di fondo, talvolta brusio, talvolta retropensiero o semplicemente voce sommessa tesa al giudizio interiore. Nessuna parte di noi può rimanere insoddisfatta perché inespressa.</p><p>Assumiamo che in virtù dei bias cognitivi e dei pregiudizi ma anche di un metro non del tutto oggettivo in tema di talento sia difficile dire con certezza quale sia preponderante rispetto ad un altro quando sentiamo di averne più d'uno. Anche solo per il fatto di non aver creato l’occasione di metterli alla prova davvero.</p><p>Ne consegue che l’optimum sia coinvolgerli tutti, che equivale a dire “usarli tutti”, per il beneficio massimo della nostra prestazione.</p><p>Pertanto la terza domanda sarà</p><ol><li>Come posso apportare cambiamenti per coinvolgere tutti i miei talenti e includere la mia indole per intero?</li></ol><p>Per avere 9 in questa area di miglioramento devi mettere a fuoco le tue intelligenze e coinvolgerle tutte, nessuna esclusa.</p><p>Potrebbe necessitare grande creatività per trovare le soluzioni corrette e apportare gli aggiustamenti necessari al raggiungimento di questo ambizioso traguardo. Devi spogliarti della paura del cambiamento e provare. Sarà come andare dal sarto a provarti il più bell’abito su misura che tu abbia mai avuto.</p>",
      "<p>Un’intervista di un allenatore di calcio giunto alla ribalta del grande calcio europeo in età matura, dopo una lunga trafila, ripercorre le tappe della sua vita e in particolar modo racconta di quando, la sera, allenava squadre dilettantistiche essendo impiegato in banca.</p><p>Poi venne, come spesso accade, il momento della scelta. La proposta, non certo milionaria, di una squadra di categoria superiore. L’incerto per il certo. La passione contro il posto fisso. Una frase ricorda ancora una volta quanto sia importante questa area di miglioramento “Ho scelto come unico mestiere quello che avrei fatto gratis”. Da lì in poi fu tutto un successo verso traguardi sempre più ambiziosi.</p><p>È impressionante cosa possa scatenare in noi una passione disinteressata.</p><p>Disinteressata ad ogni aspetto materiale. Al denaro in primis. Nella certezza che non tarderà ad arrivare quando avremo coordinato tutte le componenti del successo del Metodo.</p><p>Abbiamo una cultura fondata sul do ut des. Se faccio qualcosa devo sempre avere un ritorno. Sul lavoro, poi, è impensabile concepire un approccio diverso. Ed è giusto ricevere quanto ci spetti. Ma qui siamo nell’area della definizione di ciò che è più importante del denaro. Siamo nell’area dei valori che ci ispirano o ci avrebbero ispirato se non avessimo avuto freni di qualsiasi natura.</p><p>Se non riuscite a mettere a fuoco la risposta a questa autoverifica fate il seguente esercizio. Immaginate un mondo dove nessuno debba preoccuparsi della sussistenza perché garantita a tutti, niente più problemi di bollette, spesa, affitto, rate di mutuo. Un mondo perfetto dove ognuno è semplicemente votato a ricercare quel che più lo eleva come persona, lo aiuta a completarsi nel pieno della sua natura, secondo quel che reputa il motivo per cui è realmente nato. Si tratta di spingere in alto l’asticella della nostra ricerca intima. Di capire realmente che cosa sceglieremmo in un mondo perfetto. Perché in fondo, se un mondo perfetto non esiste attorno a noi, dobbiamo iniziare a costruirlo nel nostro piccolo, partendo dalla nostra dimensione e dalle nostre scelte. Giunti a questo punto, calati in questa nuova realtà, poniti una serena domanda.</p><p>Quale attività ambisco a svolgere in questo mondo perfetto? Io ad esempio insegnerei sport la mattina e farei il meccanico di bici la sera.</p><p>La risposta va data con estrema sincerità e franchezza. Direi quasi d’istinto assaporando la libertà da ogni pregiudizio, in un mondo perfetto non ci sarà nemmeno chi giudica il prossimo tantomeno sé stesso.</p><p>Se abbiamo trovato una risposta siamo a buon punto. Me se facciamo fatica a trovarla ci aiuteremo ricercando le origini del nostro imprinting etico.</p><p>Per quale valore siamo realmente disposti ad impegnarci al di là di ogni calcolo?</p><p>Una volta risposto a questa domanda la successiva sarà più semplice.</p><p>In quale attività/Nell’attività che svolgo, questo valore superiore è contemplato, trova pieno accoglimento?</p><p>Anche qui come per la Tecnica incide l’esperienza del flusso. Ancora una volta ci aiuta Daniel Goleman:</p><blockquote><p>“Il flusso è uno stato in cui l’individuo si disinteressa di sé, l’opposto del rimuginare e del preoccuparsi”</p><p>(Daniel Goleman - Intelligenza emotiva)</p></blockquote><p>Quindi, il valore superiore per il quale svolgeremmo un’attività senza interesse alcuno, in un mondo perfetto, è talmente alto per noi (e solo per noi) da porsi anche al di sopra della percezione di noi stessi.</p><p>Alcuni raccontano di non aver mai provato questa straordinaria sensazione. Ma poi scavando con attenzione nei ricordi, ne ritrovano traccia riaffiorando con grande veemenza. Perché è nella natura di ogni uomo, soprattutto quando è molto giovane, privo di filtri e giudizi fin troppo facili, entusiasmarsi dando tutto sé stesso per una causa. Magari soltanto per poche ore durante un gioco adolescenziale. Nel gioco siamo tutti disinteressati. Giochiamo perché amiamo farlo.</p><p>Ma come posso puntare al 9 in questa area di miglioramento? Sentendomi al di sopra di ogni giudizio, interiore o a noi esterno, nel mentre in cui svolgiamo la determinata attività, fermo restando lo svincolo da qualsiasi ricompensa attesa. Quanto più saremo impermeabili ai giudizi tanto più saremo graniticamente integerrimi nell’esaltare la nostra vera natura.</p><p>Per aspirare a 9 in questa area di miglioramento devi riaffermare la “superiorità del flusso”. Rintracciarla con certezza nei tuoi ricordi se non sei consapevole ora. Quel senso di distacco dal tutto che si prova nello svolgere l’attività scelta. Una sensazione che può impregnare anche solo pochi attimi ma che nel tempo si diffonde a macchia d’olio in funzione della tua capacità di riconoscerla.</p><p>Acquisita questa sensibilità potrai, in un certo senso, misurarla nel tempo. Il 9 spetta a chi avvisa una senso di totale immersione nel suo “mondo attivo” che è al tempo stesso isolamento e interconnessione assoluta con le proprie risorse tecniche e psichiche.</p>",
      "<p>Il nostro traguardo, se siamo qui, è fissato nel raggiungimento dell’eccellenza della nostra performance. Essere efficienti soprattutto. Che significa anzitutto ottenere il massimo risultato possibile in funzione delle risorse disponibili in quel dato momento. Il livello tecnico di un Asso può rappresentare all’inizio di un percorso di apprendimento una meta lontana perché siamo nel campo della tecnica che promana da un livello inconscio; controllata con disinvoltura grazie a connessioni neuronali strutturate e createsi nel tempo, attraverso training fondato su pratica deliberata per migliaia di ore. Pertanto, la Tecnica dell’Asso è un insieme di abilità che a seconda del tipo di attività specifiche, oggetto del nostro percorso, possono o meno coinvolgere la sfera intellettiva e fisica al contempo o, prevalentemente, solo quella intellettiva.</p><p>Nell’esempio di un avvocato che si accorge di essere carente nell’eloquio e più in generale nel public speaking il suo riferimento/obiettivo di Tecnica da Asso sarà quello dei migliori speakers al mondo. In tal caso sarà utile guardare e osservare i numerosi video sulle gare e sui primati mondiali per comprendere quali siano i top speakers e farsi un’idea del proprio livello.</p><p>Va da sé, in questo caso, l’avvocato dovrà comprendere che se, ad oggi, la sua attività era di tipo sostanzialmente intellettivo ovvero di concetto, il public speaking presuppone anche l’impiego efficiente e convincente del corpo.</p><p>Con questo voglio dire che l’individuazione del livello tecnico di un Asso può determinare anche un cambiamento dei paradigmi assoluti che hanno condotto la persona fino al suo attuale livello di consapevolezza professionale. È importante, però, che il livello dell’Asso sia definito come il punto di arrivo semplicemente tecnico e quindi di esecuzione del gesto, o in generale, di espressione fisico intellettuale della prestazione, con tutta l’onestà di cui si è capaci.</p><p>Può essere mortificante vedersi anni luce lontani da un Asso ma è determinante essere realisti proprio per palesare, anche e soprattutto grazie al test 16Q, il gap che ci separa e che vogliamo fortemente colmare. Non dobbiamo dimenticare infatti che il Metodo 16Q garantisce un monitoraggio costante del cammino verso il successo personale incardinando i nostri sforzi sulla sinergia delle sue componenti che dovranno essere valutate con serenità ed equilibrio.</p><p>Qui è abbastanza semplice ed intuitivo capire che per ottenere 9 in questa autoverifica il tuo livello tecnico dovrà essere quello di un autentico professionista che equivale a dire di potersi misurare ai massimi livelli di un lavoro, una professione, un’attività sportiva. Il bagaglio tecnico di chi si attribuisce 9 non necessariamente è vastissimo e sconfinato ma con certezza è adatto a gestire con disinvoltura e naturalezza i compiti e le attività insite nel contesto specifico.</p><p>In tal senso, ci sono professionisti che hanno raggiunto livelli altissimi o sono divenuti tali, grazie ad una iperspecializzazione che ne ha connotato anche la notorietà oltre che la riconoscibilità sul mercato.</p><p>Ad esempio nei settori consulenziali, in senso lato, la specializzazione super verticale fa sì che si acceda in nicchie di mercato molto ristrette dove ci si può concentrare sull’apprendere in modo quasi maniacale meno abilità ma in modo prossimo alla perfezione.</p><p>Per capire meglio quanto sia importante questo concetto di specializzazione verticale, ricordiamo che anche nello sport ci sono esempi di campioni arrivati al vertice concentrandosi espressamente su alcune abilità particolarmente coerenti con le proprie caratteristiche fisiche.</p><p>Ad esempio nel tennis alcun giocatori si specializzano nel gioco da fondo campo. Nel calcio alcuni hanno costruito la propria carriera sul gioco di testa per via della loro prerogativa fisica.</p><p>Nelle professioni se non si è portati ad esempio al rapporto con la clientela e quindi alle pubbliche relazioni ci si può trovare dinanzi al bivio: mi sforzo di imparare l’arte delle relazioni o mi specializzo negli aspetti del mio lavoro che non comportano rapporti diretti con la clientela?</p><p>In questo secondo caso, ad esempio, un commercialista o un esperto di marketing online potrebbero decidere di vendere il proprio know-how in rete con video corsi o consulenze in differita, non in tempo reale, specializzandosi fortemente su determinate aree specifiche di una tipologia di business. Il commercialista ad esempio potrebbe scegliere di fornire consulenza solo su società off shore mentre l’esperto di mktg on line rivolgersi solo a studi legali perché il mercato è vergine e nessun avvocato lo presidia.</p><p>Può accadere, quindi, che alla ricerca della massima verticalità ci appaia difficile individuare un benchmark cui ispirare i propri risultati. In realtà, i canoni che caratterizzano la Tecnica dell’Asso sono sempre gli stessi: una Tecnica composta da quelle abilità che non generano alcuno stato ansiogeno nell’esecuzione e che non necessita quindi di presenza di spirito e aggiustamenti consci improvvisi tanto meno continui. Le abilità dovranno operare in background senza richiedere aggiustamenti consci, nel silenzio della mente orientata, come vedremo, alla focalizzazione del Target.</p><p>Verificate queste condizioni saremo da 9.</p>",
      "<p>Questa autoverifica è particolarmente importante sia negli esiti che nel processo di autovalutazione.</p><p>Nel corso dell’apprendimento il nostro know-how si accresce. Diventiamo così sempre più consapevoli di cosa sia giusto e cosa non lo sia. È un processo naturale. In qualsiasi cosa ci impegniamo questa è una conseguenza naturale. A patto che l’impegno abbia le caratteristiche della pratica profonda garantita da una assoluta presenza di spirito. Ed il punto è anche questo. La presenza di spirito è attenzione al particolare nel medesimo istante dell’esecuzione del gesto tecnico. È osservazione pura e priva di condizionamenti emotivi. Per dirla con Freud: “L’attenzione che si libra imparziale”. Siamo quindi nel contesto dell’autoconsapevolezza. Percepire, cogliere, individuare i nostri errori nel mentre piuttosto che in un’analisi a posteriori, ci avvicina al massimo voto.</p><p>Per puntare al 9 in questa autoverifica dobbiamo favorire lo sviluppo della nostra sensibilità verso noi stessi. Dobbiamo orientare i nostri sforzi nella creazione di un’“empatia di noi stessi”. Siamo cablati e predisposti geneticamente per sentire il prossimo, così come dimostrano gli studi delle neuroscienze. Questo ci deve far riflettere sulla nostra dotazione emotiva. Perché “riconoscere l’errore” va oltre la mera questione tecnica che ha comunque una sua valenza. Il nodo è stabilire un contatto con sé stessi al punto da sentire rivelato l’errore nell’istante stesso dell’esecuzione. Se non addirittura un attimo prima.</p><p>Anni fa ho assistito ad una scena incredibile che mi ha aiutato molto ad accrescere questa capacità.</p><p>Si racconta che un calciatore professionista famoso durante gli allenamenti si esercitava a colpire al volo la palla da fuori area, crossata dall’allenatore dai lati, cercando ovviamente di far gol più volte possibile. Il tiro al volo e il conseguente gol è uno dei più bei gesti tecnici che si possano compiere nel calcio perché altamente spettacolare ma soprattutto complesso da un punto di vista propriocettivo.</p><p>Ebbene, ciò a cui si assisteva era illuminante e stupefacente.</p><p>Quando la palla era ancora in volo all’apice della parabola prima che gli giungesse, in occasione di alcuni cross, il calciatore gridava “Gol!” e puntualmente con una percentuale pari al 100% la palla finiva in rete. Quando non esclamava “Gol!” gli esiti positivi dei tiri avevano una percentuale molto più bassa. È evidente che questo episodio attiene anche alla capacità di vedersi proiettati verso il Target ma, in assoluto, il calciatore “sentiva” prima ancora del gesto tecnico che tutto sarebbe andato alla perfezione. Siamo di fronte ad una “inconsapevole autoconsapevolezza” che operava con una tale sicumera da scoraggiare il portiere ogni qualvolta sentiva urlare “Gol!”. Gli studi dell’attività cerebrale condotti grazie alle risonanze hanno permesso di accertare che le nostre azioni sono decise con un determinato anticipo rispetto all’effettivo compimento.</p><p>Il nostro cervello o forse la nostra mente che ne è un’emanazione/creazione, sono al lavoro già da molto prima che, apparentemente, “decidiamo” di fare qualsiasi cosa.</p><p>Il calciatore aveva sviluppato o gli era innata, quella capacità di sentire e controllare che ogni variabile necessaria fosse esattamente al suo posto. La sua era palesemente una sorta di intuito potentissimo. A chiunque abbia praticato sport a buon livello, ad esempio quelli ove sia presente una palla o simile, gli sarà capitato di dire a sé stesso “quando ho impattato la palla sapevo di aver fatto gol/punto”. Ci sono, quindi, situazioni dove non serve la verifica dell’esito nella frazione successiva. È una sensazione di sicurezza totale. Una volta provata non ti abbandona più e ti permette di capire quando non sei allineato e stai producendo un errore.</p><p>Attribuirsi il massimo in questa autoverifica significa aver raggiunto la percezione potente del proprio intuito che sembra dirti prima che tu esegua “vai sei nella perfezione del gesto!” e al contempo questo significa sentire l’errore ancor prima di consumarlo.</p>",
      "<p>Riuscire a svolgere un’attività in una sorta di surplace mentale è un po’ il sogno di tutti. Ammiriamo istintivamente chiunque con disinvoltura riesca a fare qualcosa di specifico con incredibile tranquillità e sicurezza. È straordinario notare come questa capacità di ogni essere vivente faccia la differenza nella vita di tutti i giorni. Chi di noi non si è sentito rapito nell’osservare la capacità di un ragno di tessere una tela? O la perfezione di un nido in cima ad un albero, assemblato ramoscello dopo ramoscello?</p><p>Eppure gli animali non sembrano avere coscienza. Non paiono avere quella voce che crea rumore interiore, quel commento talvolta inesorabile e implacabile che ci impedisce di essere fluidi e sospesi nel tempo all’atto di dover svolgere un compito, un’attività sia essa fisica o mentale.</p><p>Quando la competenza raggiunge il livello inconscio il nostro agire è come una danza. Tutto è leggero e fluente. Assistiamo a una sorta di miracolo della perfezione che si rinnova di attimo in attimo. La consapevolezza che quel singolo frame appartenga alla perfezione è un dato scontato e certo.</p><p>Hai mai osservato il conducente di un bus mentre guida? Rimani facilmente rapito dal modo in cui muove le mani sull’enorme sterzo, dalla sicurezza con cui pennella le curve nei punti più stretti sfiorando ostacoli, macchine, pedoni. Le mani e le braccia disegnano cerchi eleganti ed infiniti sullo sterzo. Il tutto pare appartenere ad un contesto talmente noto al conducente che i suoi occhi sembrano sempre puntare altrove, già oltre l’ostacolo, a tracciare nuove traiettorie.</p><p>Si rimane di stucco. Non solo la facilità e l’abilità con cui porta a spasso un bestione carico di gente in un traffico a dir poco caotico e pieno di insidie ma soprattutto la tranquillità mentale e l’eleganza dei gesti. Il guidare appare come un tutt’uno con l’artefice dell’agire. Il conducente non è tanto diverso dal ragno nell’atto di tessere la tela. Quando si è nel flusso della competenza inconscia noi siamo l’agire e al contempo l’azione ci identifica. Ovvero non c’è spazio per l’errore.</p><p>L’avvicinamento alla competenza inconscia è un cammino identico per ogni essere vivente e passa attraverso il processo per tentativi ed errore. Nel libro “16 Domande per cambiare la tua vita” ricordiamo i risultati delle ultime scoperte in fatto di mielina. Prodotta naturalmente dal nostro corpo durante le fasi di apprendimento, riesce a rendere l’attività neuronale più efficiente. La mielina viene prodotta in maggior quantità se i tentativi sono numerosi, ripetuti e ravvicinati nel tempo. Questa sostanza agisce come una guaina isolante che rende le fibre nervose straordinariamente efficienti nella conduzione dello stimolo nervoso. Più ci alleniamo più ci avviciniamo alla competenza inconscia. Più pratichiamo ad intervalli vicini fra loro e più mielina produciamo.</p><p>Come ha detto un autore famoso “la mielina è democratica” non gli interessa chi sei, quanti soldi hai e che lavoro svolgi. Premia chi si applica in modo profondo e con occhio vigile e imparziale verso il proprio allenamento. La mielina ti rende capace di parlare un’altra lingua, di recitare le poesie come un attore così come di giocare a baseball al meglio delle tue possibilità.</p><p>Allora, consapevolizzare che l’accesso alla competenza inconscia è necessario per entrare in quello che molti autori definiscono come “flusso”, ove tutto sembra sospeso, compreso il tempo, e dove tutto non a caso fluisce senza intoppi e il gesto tecnico, in senso lato, è come se si riproducesse da sé, significa accettare che la produzione di mielina è un passaggio obbligato.</p><p>Per attribuirmi 9 in questa autoverifica devo essere consapevole della percezione del “flusso”. Devo saper svolgere quella attività con disinvoltura totale. Potenzialmente la mente deve essere capace di occuparsi di altro in ogni istante della performance. La capacità di reazione ad ogni improvviso e imprevedibile input deve essere assoluta e trattata, vissuta, gestita come elemento di normalità.</p><p>Ecco le parole usate da Daniel Goleman riguardo all’esperienza di ingresso nel flusso:</p><blockquote><p>“Ma la zona del flusso e della prestazione ottimale sembra essere un’oasi di efficienza corticale, nella quale viene consumato un minimo indispensabile di energia mentale. […] avendo la padronanza delle mosse necessarie per compiere una data impresa, di tipo fisico, come scalare una parete di roccia, o di tipo mentale, come programmare un computer, il cervello può essere più efficiente. [...]l’individuo in stato di flusso mostra un controllo magistrale su ciò che sta facendo e le sue risposte sono perfettamente sincronizzate con le mutevoli esigenze della circostanza.”</p><p>(Daniel Goleman - Intelligenza emotiva)</p></blockquote><p>Facendo un parallelo con la mountain bike, ad esempio, appare ovvio che chiunque sappia pedalare, magari anche parlando con un amico in sella accanto; alla prima discesa piena di buche, radici, fango e massi la nostra competenza potrebbe ben presto presentare il conto apparendo totalmente insufficiente. Saper pedalare su un sentiero privo di insidie ci può far sentire molto bravi e permetterci di pensare ad altro ma non appena appaiono gli ostacoli che mettono a rischio la nostra incolumità lo stato ansiogeno si attiva o meno intensamente a seconda del nostro grado di competenza.</p><p>Lo stesso dicasi per un avvocato, un presentatore televisivo, un giornalista, un chirurgo. Fin quando ci ritroviamo sul terreno del conosciuto anche una competenza imperfetta può bastare ma la vera competenza inconscia è quella che non teme di andare oltre le colonne di Ercole. I grandi navigatori in solitaria sanno di dover fronteggiare tempeste che non hanno mai visto prima ma la loro competenza “totale” messa alla prova da numerose processi di tentativi ed errore nelle condizioni più disparate fa sì che nulla può attivare stati ansiogeni così profondi da impedire l’utilizzo di tutte le proprie risorse disponibili e quindi di uscire dal flusso.</p><p>Il nostro cervello è abilissimo nel creare associazioni per risolvere i problemi nel minor tempo possibile e per rispondere alle emergenze. Questo profilo può tradursi in un vantaggio ma anche essere foriero di errori madornali. Molto dipende dalla possibilità di attingere ad un bagaglio di dati esperienziali vasto e complesso. Affinché, nel momento in cui mi si chieda il massimo della performance anche in condizioni limite, io possa versare nel “flusso” facendo lavorare in background il controllo cosciente della tecnica è necessario che ogni situazione “in un certo modo” non abbia le caratteristiche della totale novità. Per cui poter attingere ad una propria banca dati, vasta e solida e nella quale ritrovo anche il modo in cui ho saputo reagire, nelle condizioni più disparate e critiche, mi rende ancor più capace di avvicinarmi al 9 in questa autoverifica.</p>",
      "<p>Qui ci riagganciamo ai contenuti della precedente in una sorta di continuum delle chiavi da tenere a mente e utilizzare, per ottenere il massimo da noi stessi in questa specifica area di miglioramento.</p><p>“Imparare ad apprendere” sembra, più che un dettame, un gioco di parole. In realtà potremmo definirlo uno stato mentale di consapevolezza, di maturità vera, che consegue ad una crescita complessiva dell’individuo capace di far proprie le certezze che sono alla base dei miglioramenti della Tecnica. Senza mai metterle, giunto a questo stadio, in discussione. È una strategia naturale che si stratifica nel tempo che riguarda chiunque fra noi abbia avuto occasione di analizzare minuziosamente il processo di apprendimento. Il cammino che ci immette nel flusso anche solo per un attimo immisurabile.</p><p>Ci riferiamo alla certezza nutrita giorno dopo giorno di dover affrontare alti e bassi nel processo di apprendimento. È naturale aspettarsi, quando ci si impegna al massimo delle proprie capacità, continui passi in avanti. Dato per scontato che ciascuno di noi abbia metabolizzato la necessità imprescindibile di produrre mielina (in qualunque cosa ci si voglia cimentare o migliorare), il passo successivo è acquisire il ruolo determinante della perseveranza.</p><p>Quella dote che, come uno schiacciasassi, ci fa vedere le giornate negative (in cui i risultati non sembrano arrivare) solo come un passaggio necessario e fisiologico nel nostro cammino.</p><p>Vogliamo ricordare che il processo di apprendimento umano è raffigurabile come una serie di plateau sempre più alti con passaggi repentini da uno stadio all’altro quasi improvvisi (talvolta ci si meraviglia di riuscire a fare qualcosa che giorni addietro sembrava impensabile) ma accompagnati anche da peggioramenti transitori prima di ricominciare a crescere.</p><p>Ne consegue che la consapevolezza del significato di questi alti e bassi diviene determinante.</p><p>La storia dei fuoriclasse (di ogni disciplina e natura) è piena di episodi e aneddoti anche simpatici e buffi nei quali maestri e insegnanti consigliavano l’abbandono dell’attività a quelli che poi sarebbero diventati autentiche leggende.</p><p>La differenza per questi fuoriclasse l’hanno fatta alcune componenti che sono alla base di questa autoverifica.</p><p>La prima è avere quella che Carol Dweck definisce “mentalità di crescita”. Scavare dentro i nostri pregiudizi affinché si rimuova ogni credenza riguardo l’immutabilità delle nostre capacità così come della nostra intelligenza. Va acquisita, di contro, la certezza che siamo esseri sempre in fieri. Anzi la stasi non è prevista. È impossibile biologicamente rimanere sempre gli stessi. Tanto vale impegnarsi nella direzione dell’evoluzione costante. Questo approccio implica anche che la visione sia profondamente ottimistica. Sul punto è necessario fare chiarezza. Nei momenti più difficili quando ci troviamo sul plateau e ci sembra di non ottenere quei risultati che parrebbero legittimi, quale giusta ricompensa al nostro grande impegno, la perseveranza deve poggiare sulla capacità di proiettarsi a ciò che saremo. Il resto è solo dettaglio.</p><p>Se sto cercando di divenire uno straordinario speaker capace di parlare senza tema dinanzi a platee di centinaia di persone ma nel frattempo mi è capitato di fornire una prestazione scadente dinanzi ad auditori ben più ristretti e meno impegnativi, ho due possibilità. Andare avanti come uno schiacciasassi considerando l’accaduto come un episodio necessario per il mio affinamento, considerando brevemente gli errori per prenderne coscienza. Oppure approcciare con disistima al mio risultato parziale.</p><p>Ecco, il punto è proprio questo. La parola “parziale” non ci interessa. Noi puntiamo al totale. Alla realizzazione totale. Quindi anche un errore è espressione di stadio parziale e non di meta assoluta.</p><p>La mentalità fissa è foriera di insuccessi. Ebbene dentro di noi come insegna Angela Duckworth nel suo “Grit” un pessimista è sempre attivo. Pronto a giudicare e a farci vedere il bicchiere mezzo vuoto anche solo per un frangente. Riconoscerlo e disattivarlo è una carta vincente per il nostro futuro.</p><p>Per avere 9 in questa area di miglioramento devo sapere fare questo “esercizio”, disattivare il pessimista, puntare sulla perseveranza, schiacciare nella certezza dei plateau di ogni processo i momenti di basso e di apparente regressione.</p><p>Approccio fondamentale ed allenante è l’adozione di nuova forma mentis imperniata sullo specifico impegno personale a terminare sempre quel che si è iniziato, non interrompere mai un’esperienza. Quest’ultima si giudica solo nella sua interezza. Seguire il detto: “Finisci come hai iniziato e sarà sempre un successo” è una sorta di must. Allenare la perseveranza è un concetto determinante per il successo perché è un percorso necessario dell’“Imparare ad apprendere”. Numerosi studi, peraltro realizzati anche con riferimento a diversi periodi storici, confermano che la perseveranza è una delle chiavi del successo talvolta determinante ben oltre il know-how e la dotazione di base. Noi riteniamo importante questa componente proprio in ambito del processo che porta ad “Imparare ad apprendere”. Se non c’è perseveranza non si è imparato ad apprendere e non potremo aspirare al 9.</p><p>Per avere 9 devi essere in possesso di una smodata perseveranza. Per ottenere questo risultato devi aver interiorizzato le modalità di apprendimento senza lasciar spazio al dubbio. Siamo oltre la semplice comprensione razionale del processo di apprendimento e delle ragioni biologiche alla base di una performance. Sai che esiste un budello nel quale dover necessariamente passare.</p><p>Infine il passaggio nodale per il 9. Migliorare la Tecnica con il Training per Essere e non per Avere come insegna Erich Fromm. Abbatti ogni forma di narcisismo e dedica l’apprendimento al tuo cambiamento profondo con atteggiamento di grande disponibilità e apertura affinché questo avv
