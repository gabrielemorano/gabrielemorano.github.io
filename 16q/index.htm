<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16Q</title>
<style>/* src/styles.css
   ============================================================
   16Q — editorial paper, one blue.
   The single accent is #3377c8, taken from the chart's outermost
   rank ring, so a selection ties forward to the result. The chart
   keeps Roboto for its own labels (faithful to samples/); the
   interface is set in a serif.

   Two rules, asserted in test/styles.test.js:
     - all text is one ink. Secondary matter is separated by size,
       weight and letter-spacing, never by a lighter grey.
     - blue means interaction. Hover, press and selection are the
       only things that recolour, and they recolour to the accent.
       The one exception is delete, which reads as danger.
   ============================================================ */

/* Optional and non-blocking; its failure is invisible. Used only
   inside the chart — see spec section 4.1. */
@font-face {
  font-family: 'Roboto';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url('https://fonts.gstatic.com/s/roboto/v30/KFOmCnqEu92Fr1Mu4mxK.woff2') format('woff2');
}

:root {
  --paper:  #f7f7f5;
  --card:   #fff;
  --ink:    #1b1e22;
  /* Secondary text used to step down through two greys. It now reads at full
     ink strength and is separated by size, weight and letter-spacing instead,
     so nothing on the page is faint. The names still mark the roles, so the
     step can be reintroduced by changing these two lines alone. */
  --muted:  #1b1e22;
  --dim:    #1b1e22;
  --hair:   #dcdfe3;
  --line:   #d3d8de;
  --accent: #3377c8;

  --serif: Georgia, 'Times New Roman', 'Noto Serif', serif;
  --sans:  'Roboto', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.5 var(--serif);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--accent); }

#app {
  position: relative; min-height: 100dvh; display: flex; flex-direction: column;
  padding: 22px 24px 20px; max-width: 620px; margin-inline: auto;
}
section[hidden] { display: none !important; }
section { flex: 1; display: flex; flex-direction: column; }

/* ---------- chrome ---------- */
.bar { display: grid; grid-template-columns: 26px 1fr 26px; align-items: center; flex: none; }
.bar__title {
  text-align: center; font-size: 11px; letter-spacing: .22em;
  text-transform: uppercase; color: var(--dim);
}
.icon { width: 26px; height: 26px; display: grid; place-items: center; color: var(--dim); }
.icon:hover { color: var(--accent); }
.icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.icon[hidden] { visibility: hidden; display: grid; }
.hair { height: 1px; background: var(--hair); margin-top: 14px; flex: none; }

/* ---------- home ---------- */
.home { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.covers { display: flex; justify-content: center; gap: 16px; margin-bottom: 4px; }
.cover { display: block; border-radius: 3px; overflow: hidden; line-height: 0;
         box-shadow: 0 2px 10px rgb(20 24 28 / .16); transition: transform .18s ease, box-shadow .18s ease; }
.cover:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgb(20 24 28 / .22); }
.cover:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.cover img { display: block; width: clamp(178px, 56vw, 320px); height: auto; }

.home h1 { font-size: clamp(26px, 7vw, 34px); line-height: 1.15; letter-spacing: -.02em; margin: 0; }
.home__prompt {
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--dim); margin: 0;
}
.field { display: flex; flex-direction: column; gap: 10px; }
select, input[type="text"] {
  font: inherit; width: 100%; padding: 14px 13px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--card); color: var(--ink); min-height: 52px;
  -webkit-appearance: none; appearance: none;
}
select {
  background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='7'%3E%3Cpath d='M1 1l4.5 4.5L10 1' stroke='%238d949c' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 14px center;
}
select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn {
  background: var(--accent); color: #fff; border-radius: 5px; padding: 15px;
  text-align: center; font-size: 16px; min-height: 52px;
}
.btn[disabled] { background: #c9d4e2; cursor: default; }
.btn--quiet { background: none; color: var(--accent); border: 1px solid var(--line); }

/* ---------- question ---------- */
.q { font-size: clamp(20px, 4.6vw, 25px); line-height: 1.26; letter-spacing: -.015em; margin: 20px 0 0; }
.q-meas { font-style: italic; font-size: 12.5px; line-height: 1.5; color: var(--muted); margin: 12px 0 0; }
.q-mid { flex: 1; display: flex; align-items: center; padding: 14px 0; }
.q-block { width: 100%; }
.q-lab { font-size: 10px; letter-spacing: .18em; color: var(--accent); margin: 0 0 5px; }
.q-lab--after { margin: 11px 0 5px; }
.q-say { font-size: 12.5px; line-height: 1.45; color: var(--ink); margin: 0 0 9px; }
.q-say--last { margin: 0; }
.q-rows { display: flex; flex-direction: column; gap: 8px; }
.q-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.q-row button {
  height: 54px; display: grid; place-items: center; border: 1px solid var(--line);
  border-radius: 4px; background: var(--card); font-size: 17px; color: var(--ink);
  transition: background .15s, border-color .15s, color .15s;
}
.q-row button:hover { border-color: var(--accent); }
.q-row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.q-row button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
@keyframes q-glow {
  0%   { box-shadow: 0 0 0 0 rgb(51 119 200 / .55); transform: scale(1); }
  45%  { box-shadow: 0 0 0 9px rgb(51 119 200 / 0);  transform: scale(1.06); }
  100% { box-shadow: 0 0 0 0 rgb(51 119 200 / 0);    transform: scale(1); }
}
.q-row button.is-confirming {
  background: var(--accent); border-color: var(--accent); color: #fff;
  animation: q-glow .42s ease-out;
}
.steps { display: flex; gap: 3px; flex: none; margin-top: 16px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: #dfe3e8; transition: background .25s ease; }
.steps i.is-on { background: var(--accent); }

/* ---------- drawer ---------- */
.scrim {
  position: fixed; inset: 0; background: rgb(20 24 28 / .34); opacity: 0;
  pointer-events: none; transition: opacity .22s ease; z-index: 9;
}
.scrim.is-open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 86vw);
  background: #fbfbfa; border-left: 1px solid #e2e5e9; transform: translateX(100%);
  transition: transform .24s cubic-bezier(.4, 0, .2, 1); z-index: 10;
  display: flex; flex-direction: column; padding: 20px 22px; gap: 4px; overflow-y: auto;
}
.drawer.is-open { transform: none; }
.drawer__close { align-self: flex-end; margin: -4px -6px 6px 0; }
.drawer h3 {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim);
  margin: 18px 0 8px; font-weight: 400;
}
.drawer h3:first-of-type { margin-top: 14px; }
.drawer__primary { margin-top: 2px; }
.drawer__item {
  display: block; width: 100%; text-align: left; padding: 12px 0; font-size: 15px;
  color: var(--ink); border-bottom: 1px solid #ecedef; min-height: 46px;
}
.drawer__item:hover { color: var(--accent); }
.drawer__item--empty { color: var(--dim); cursor: default; }
.drawer__langs { display: flex; gap: 8px; padding: 4px 0 2px; }
.drawer__langs button {
  flex: 1; min-height: 46px; border: 1px solid var(--line); border-radius: 5px;
  font-size: 14px; color: var(--ink);
}
.drawer__langs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- result ---------- */
.result { gap: 16px; }
.result__activity { font-size: clamp(21px, 5vw, 27px); line-height: 1.2; margin: 18px 0 0; letter-spacing: -.015em; text-align: center; }
/* the chart takes the shorter viewport axis, so it is always fully visible */
.chart-wrap { width: min(100%, 78dvh); margin: 4px auto 0; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
/* one centred column per assessment, so a comparison aligns row by row */
.scoreboard { display: flex; justify-content: center; gap: clamp(24px, 9vw, 64px); }
.scorecol {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  text-align: center; min-width: 96px;
}
.scorecol__series {
  width: 15px; height: 15px; border-radius: 50%;
  border: 1px solid var(--line); box-shadow: inset 0 0 0 1px #fff; margin-bottom: 2px;
}
.scorecol__medal { width: 52px; height: auto; }
.scorecol__pct { font-size: 31px; line-height: 1.05; letter-spacing: -.02em; }
.scorecol__rank { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.scorecol__when { font-size: 11.5px; color: var(--dim); }
.legend-html { list-style: none; padding: 0; margin: 0; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.legend-html li { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
.swatch { display: inline-block; width: 13px; height: 13px; border-radius: 50%; flex: none; }

.table { border-collapse: collapse; width: 100%; font-size: 14px; }
.table th, .table td { border-bottom: 1px solid var(--hair); padding: 7px 8px; text-align: right; }
.table th { font-weight: 400; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.table th:first-child, .table td:first-child { text-align: left; }
.table tr.is-section td {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim);
  padding-top: 16px; border-bottom-color: var(--ink); text-align: left;
}
.table td:not(:first-child) { font-variant-numeric: tabular-nums; }

.axis-note {
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--dim); margin: 6px 0 -6px;
}
.axis { border-top: 1px solid var(--hair); padding-top: 15px; }
.axis__head { display: flex; align-items: center; gap: 11px; }
.axis__medal { width: 30px; height: auto; flex: none; }
.axis__name { font-size: 17px; letter-spacing: -.01em; }
.axis__score { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-left: auto; }
.axis p { font-size: 13.5px; line-height: 1.6; color: var(--ink); margin: 9px 0 0; }
.axis__gloss { font-style: italic; color: var(--muted); font-size: 13px; }
.axis__imbalance { border-left: 3px solid var(--accent); padding-left: 11px; }

.actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 4px; }
.actions .btn { flex: 1; min-width: 130px; }
.status { min-height: 1.4em; font-size: 13px; color: var(--muted); margin: 0; }
.warn { border-left: 3px solid #cc2027; padding-left: 11px; font-size: 13.5px; color: var(--ink); }

/* ---------- data screen ---------- */
.data-summary {
  display: flex; flex-direction: column; gap: 3px; margin-top: 20px;
  padding-bottom: 16px; border-bottom: 1px solid var(--hair);
}
.data-summary__count { font-size: clamp(20px, 5vw, 25px); letter-spacing: -.015em; }
.data-summary__detail { font-size: 12.5px; color: var(--dim); }

.block { display: flex; flex-direction: column; gap: 11px; margin-top: 26px; }
.block__title {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--accent); margin: 0; font-weight: 400;
}
.block--quiet .block__title { color: var(--dim); }
.block__blurb { font-size: 13.5px; line-height: 1.55; color: var(--muted); margin: 0; }

.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  display: flex; flex-direction: column; gap: 3px; text-align: left;
  border: 1px solid var(--line); border-radius: 5px; padding: 12px 14px;
  background: var(--card); min-height: 52px;
}
.choice:hover { border-color: var(--accent); }
.choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice__name { font-size: 15px; }
.choice[aria-pressed="true"] .choice__name { color: var(--accent); }
.choice__blurb { font-size: 12.5px; line-height: 1.45; color: var(--muted); }

/* The browser's own file control, visible and clicked directly. Every attempt
   to wrap or forward it failed in Chrome on macOS; ::file-selector-button lets
   the trigger be styled without taking the click away from the input. */
.filepick { display: flex; flex-direction: column; gap: 7px; }
.filepick__caption {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim);
}
.filepick__input {
  font: inherit; font-size: 13px; color: var(--muted); width: 100%;
  padding: 0; border: 0; background: none; min-height: 48px;
}
.filepick__input::file-selector-button {
  font: inherit; font-size: 15px; padding: 13px 20px; margin-right: 12px;
  border: 1px solid var(--line); border-radius: 5px; background: var(--card);
  color: var(--accent); cursor: pointer; min-height: 48px;
}
.filepick__input::file-selector-button:hover { border-color: var(--accent); }
.filepick__input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- history ---------- */
.hnotice {
  margin: 18px 0 0; padding: 11px 13px; border-left: 3px solid var(--accent);
  background: #eef2f7; font-size: 13.5px; color: var(--ink);
}
.hhint { font-size: 13px; color: var(--muted); margin: 18px 0 4px; }
.hnotice + .hhint { margin-top: 12px; }
.empty { margin-top: 22px; }
.hlist { list-style: none; padding: 0; margin: 0; }

.hrow {
  display: grid; grid-template-columns: 22px 1fr auto 30px;
  align-items: center; gap: 12px;
  padding: 13px 2px; border-bottom: 1px solid var(--hair);
}
.hrow.is-picked { background: #eef2f7; box-shadow: inset 3px 0 0 var(--accent); padding-left: 10px; }
.hrow__pick { width: 19px; height: 19px; accent-color: var(--accent); cursor: pointer; }
.hrow__main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hrow__activity { font-size: 16px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.hrow__when { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }

.hrow__score { display: flex; align-items: center; gap: 9px; }
.hrow__medal { width: 26px; height: auto; }
.hrow__nums { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.hrow__pct { font-size: 18px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hrow__rank { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.hrow__del {
  width: 30px; height: 30px; border-radius: 50%; color: var(--dim);
  font-size: 19px; line-height: 1; display: grid; place-items: center;
}
.hrow__del:hover { background: #f2e3e2; color: #b23a2e; }
.hrow__del:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Deliberately not a grid. This row shares nothing with the columns of a normal
   history row, and while it used to redefine them, the narrow-screen rule below
   re-specifies .hrow at equal specificity and later in the file. On a phone the
   question was therefore being laid into the 22px checkbox column, one word per
   line, with the buttons pushed off the right edge. Flex owes that rule nothing. */
.hrow--confirm {
  display: flex; flex-wrap: wrap; align-items: center; gap: 9px;
  background: #fbf3f2; box-shadow: inset 3px 0 0 #b23a2e; padding-left: 10px;
}
/* Wide enough to sit beside the buttons on a roomy row; on a phone it claims the
   line and they wrap underneath. */
.hrow__ask { font-size: 14px; flex: 1 1 240px; }
/* One flex item, so Delete and Cancel are never separated by a wrap. */
.hrow__acts { display: flex; gap: 9px; flex: 0 0 auto; margin-left: auto; }
.hbtn {
  flex: 0 0 auto;
  min-height: 40px; padding: 0 14px; border: 1px solid var(--line);
  border-radius: 5px; font-size: 14px; background: var(--card); color: var(--muted);
}
.hbtn:hover { color: var(--accent); }
.hbtn--danger { background: #b23a2e; border-color: #b23a2e; color: #fff; }
.hbtn--danger:hover { color: #fff; filter: brightness(1.08); }

@media (max-width: 420px) {
  .hrow { grid-template-columns: 22px 1fr 30px; row-gap: 8px; }
  .hrow__score { grid-column: 2 / 4; justify-content: flex-start; }
}

.note { font-size: 13px; line-height: 1.6; color: var(--muted); }

/* ---------- chart internals (Roboto, faithful to samples/) ---------- */
.chart-wrap text { font-family: var(--sans); }
.q-quadrant { font-size: 46px; font-weight: 700; letter-spacing: .02em; }
.q-axis     { font-size: 30px; font-weight: 700; }
.q-legend   { font-size: 24px; font-weight: 400; }
.q-score    { font-size: 54px; font-weight: 700; }

/* ---------- compact: short or narrow viewports ---------- */
@media (max-height: 660px), (max-width: 360px) {
  #app { padding: 16px 18px 14px; }
  /* the enlarged cover puts the shortest phone 4px into scroll; take it back
     from the spacing rather than from the image */
  .home { gap: 16px; }
  .covers { margin-bottom: 0; }
  .q { font-size: clamp(17.5px, 4.6vw, 21px); margin-top: 14px; }
  .q-meas { font-size: 11.5px; margin-top: 9px; }
  .q-mid { padding: 8px 0; }
  .q-row button { height: 48px; font-size: 16px; }
  .q-say { font-size: 11.5px; margin-bottom: 7px; }
  .q-lab--after { margin-top: 8px; }
  .steps { margin-top: 12px; }
  .hair { margin-top: 11px; }
}
@media (max-width: 767px) {
  .q-quadrant { font-size: 62px; }
  .q-axis     { font-size: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- reading material ----------
   The book's long-form essays: one per question and one per indicator. They are
   background reading, not part of taking the assessment, so they live behind a
   mortarboard and open as their own screen. */
.cap {
  flex: none; width: 26px; height: 26px; display: grid; place-items: center;
  color: var(--dim); border-radius: 3px;
}
.cap:hover { color: var(--accent); }
.cap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.q-head { display: flex; align-items: flex-start; gap: 10px; }
/* the heading carries the top margin, so the cap is nudged onto its first line */
.q-head .cap { margin-top: 23px; }
.table .cap { display: inline-grid; vertical-align: -7px; margin-left: 2px; }

.essay { position: fixed; inset: 0; z-index: 20; display: flex; }
.essay[hidden] { display: none; }
.essay__backdrop {
  position: absolute; inset: 0; background: rgb(18 21 25 / .46);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  animation: essay-fade .24s ease both;
}

/* Phone: a sheet rising from the bottom, stopping short of the top so the app
   stays visible behind it and the gesture back out is obvious. */
.essay__sheet {
  position: relative; margin: auto auto 0; width: 100%; max-height: 92dvh;
  display: flex; flex-direction: column;
  background: var(--paper); border-radius: 15px 15px 0 0;
  box-shadow: 0 -2px 40px rgb(12 16 20 / .3);
  animation: essay-rise .3s cubic-bezier(.22, .84, .28, 1) both;
}
.essay__sheet:focus { outline: none; }   /* focused only to move the reading position */
.essay__grab {
  flex: none; width: 34px; height: 4px; border-radius: 2px;
  background: var(--line); margin: 8px auto 0;
}
.essay__bar {
  flex: none; display: grid; align-items: start; gap: 0 14px;
  grid-template-columns: 1fr auto; padding: 12px 16px 13px;
  border-bottom: 1px solid var(--hair);
}
.essay__eyebrow {
  grid-column: 1; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 3px;
}
.essay__title {
  grid-column: 1; font-size: 15px; line-height: 1.3; letter-spacing: -.01em; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.essay__close { grid-column: 2; grid-row: 1 / span 2; margin-top: 2px; }
.essay__body {
  flex: 1; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; padding: 22px 18px 40px;
}
.essay__body > * { max-width: 63ch; margin-inline: auto; }
.essay__body p { font-size: 15.5px; line-height: 1.74; margin: 0 0 1.15em; }
.essay__body ul, .essay__body ol {
  font-size: 15.5px; line-height: 1.74; padding-left: 1.25em; margin: 0 0 1.15em;
}
.essay__body li { margin-bottom: .5em; }
.essay__body a { color: var(--accent); }
.essay__body > :last-child { margin-bottom: 0; }

/* the 22 pulled book quotations, set apart from the author's own voice */
.essay__body blockquote {
  margin: 0 auto 1.6em; padding: 3px 0 3px 17px; border-left: 3px solid var(--accent);
  color: var(--muted); font-style: italic;
}
.essay__body blockquote p { margin-bottom: .55em; }
.essay__body blockquote p:last-child {
  margin-bottom: 0; font-style: normal; font-size: 12.5px;
  letter-spacing: .04em; color: var(--dim);
}

/* the app behind must not scroll under the sheet */
body.is-reading { overflow: hidden; }

@keyframes essay-fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes essay-rise {
  from { transform: translateY(14%); opacity: .4 }
  to   { transform: none;            opacity: 1  }
}
@keyframes essay-lift {

      "<p>Generally, the best times in our lives are defined by feelings we could describe as almost ecstatic. Our worries vanish, our problems fall to the background, our frustrations disappear, we feel lighter, almost as if gravity no longer had power over us. But what’s even more remarkable is that this incredible and highly varied blend of feelings seems unbound by the shackles of time, at least according to our conventional definition of time. And perhaps feeling unbound by the shackles of time is precisely one of the key elements of this ecstatic condition, since we feel free from the stress that time’s inexorable passing and our unavoidable end can hold looming over us. The amount of Time assigned to each one of us by destiny is both unchangeable and unknown. Not even the most brilliant or richest man on earth can tell you how long he’ll live. Ironically, most people don’t act in a way that seems concerned about this. Wasting Time is the most widespread and common human activity. I have rarely discussed this key aspect of our lives with anyone.</p><p>The few times I did it was with highly intelligent people.</p><p>Recent studies have shown that fulfilled wealthy individuals spend their money-making others do the tasks they find tedious or not rewarding. In other words, since they can’t increase their own, they buy other people’s Time. Some people may argue that precisely for this reason Time is an asset than can be collected like any other good.</p><p>But actually, Time does not increase in a quantitative sense. If you are rich you might hire a driver, a gardener, a secretary and a waiter. You might also buy some luxury items. Or if you’re not interested in all that and your heart’s into saving the world and protecting the poor, you might create a foundation with volunteers and employees, or you could simply donate large sums of money to existing NGOs already aligned with our interests.</p><p>In all these cases you would be purchasing goods and services that increase the quality of your Time, which still will remain unchanged as far as quantity is concerned; a quantity which, once again, is unknown to us. Whether we like to admit it or not, and regardless of any moral judgment about it, even when we buy goods, the final aim is to feel better, to experience certain feelings for a specific timeframe. All we do in life is trying to inrease the quality of our Time. We are always haunted by this concept of Time; and we have no way to break free of its quantitative limits. Save for… gaining a deeper understanding of our relationship with Time itself.</p><p>I mentioned the feeling that we experience in certain unique moments of our lives. Those moments when time seems to stand still. It’s often hard to even describe how long those moments last; yet we have all experienced them. At least once in our lives, we have all felt a moment when we were so immersed in doing something that we seemed to be outside of time. This usually happens when we are doing something that interests us to our very core. We are engaged because we identify with what we are doing. And what’s particularly surprising is that we are at once immersed yet extremely alert and vigilant. And time doesn’t exist anymore. The clock stops ticking. We are in a perfect space designed for us alone, which certain philosophies have described as being in the “Here and Now”.</p><p>There are no concerns in the “Here and Now”, there is no past nor future preconditioning of our actions.</p><p>We must be able to enter this “Timeless Space” in order to express ourselves without being preoccupied.</p><p>To score a 9 in this area for improvement you must be able to achieve this very personal and intimate feeling of being outside of time. In my case, I get that feeling when I am teaching or managing a classroom and preparing for a training activity. Teaching projects me beyond the petty concerns of the daily humdrum. It makes me feel lighter than the air. And it helps me see the world with rose tinted glasses, even many hours after the class has ended. Everything feels relative. And while I’m teaching, I don’t even feel like looking at my watch. I wouldn’t even bother were it not to better manage breaks for my students. If it was up to me, I’d go on for hours without breaks. I realized this when I was still very young. As a young man I used to play soccer at a competitive level. When I was out on the field during training or during a match, I was so engaged that when I heard the whistle marking the end of a session, I always felt shocked. It was a terrible feeling, like being forced to put back on a pair of heavy boots in order to walk up a mountain.</p><p>I still remember clearly that sinking feeling that a teammate and myself used to experience. Sitting on the bench we’d wonder why it got us feeling so sad. It was only years later that I realized that when we were out on the field we were in the “Here and Now”, projected in our perfect world. We were right where we wanted to be, doing exactly what we wanted to do and that were willing to do for the rest of our lives. Which is why there is such a drastically different feel between the lightness of that moment and the heaviness that comes immediately thereafter. So, you will score a 9 when the activity you are self-assessing and the way in which you carry it out make you feel in the “Here and Now” time after time. If you start telling yourself “I am Time because I am in the Here and Now” you will be well on your way to scoring a 9.</p>",
      "<p>This is the realm of our innermost feelings. No external assessment can properly analyze this area. Obviously, any activity we do can add or subtract value. It can be a positive or a negative experience in our lives. So, using an accounting analogy, we could say that what we have chosen to do on a daily basis, for example our job, is not only a cost or a benefit, but also a debit or credit.</p><p>A debit that in time will be collected upon, or a credit that one day I’ll be able to cash...</p><p>Let me explain. Say your job makes you feel depressed, anxious, angry towards yourself and towards others, extremely unsatisfied, and you blame every single one of your frustrations on it. Don’t you think that it’s going to claim its toll on you? Don’t you think you are slowly accruing an enormous debt that one day, sooner or later, you’ll be forced to pay.</p><p>The same applies to stressful interpersonal relationships, especially when it comes to family.</p><p>Research on the negative impacts of pessimism, stress, anger, depression, feelings of frustration, have revealed a clear link between these feelings and the onset of illness and shortened lifespans. Individuals who continually experience these negative emotions are much more likely to get sick.</p><p>The more debts you accrue the more likely you’ll go into default.</p><p>So, to explain this notion of feeling “centered”, which is key to this area of improvement, I must refer specifically to these enhancing or hindering emotions.</p><p>I spent many years of my life, just over sixteen, thinly concealing my discontent and frustration over a job that I didn’t like, and which made me unhappy. I got sick multiple times. My job was obviously subtracting value from my life even though it allowed me to live comfortably. I pretended not to notice because it would have meant abandoning financial security and starting over from scratch and I wasn’t that young anymore. But I felt like I was barely treading water for years. Years which felt like centuries and which taught me very little compared to everything I learned from the moment I swam to the shore and said “enough!”. All I had to do was ask myself one question: “why?”. Soon after I had the willpower to ask myself “What?”. What can I do to change or get rid of all this anger, frustration and suffering? And especially “What is worth saving and bringing away with me?”</p><p>By picking the wrong line of work or by doing our jobs in a way we don’t enjoy, we are tipping the scales towards costs rather than benefits, and in time we end up paying for it with our health and lack of happiness; and starting over has its own cost, although in time it ends up being extremely gratifying.</p><p>And that’s a tip for anyone who doesn’t feel “centered”: move from “why?” to “what?”. When we are not centered in what we are doing we are carrying an anchor. Picture a balloon being held to the ground by a heavy weight that prevents it from flying.</p><p>Sometimes we are simply scared of letting go, of releasing that anchor, of relying just on ourselves. It’s ironic but it’s just the way it is. Only by letting go of the anchor will the balloon take flight and we’ll experience the world from a different angle. We will broaden our horizons. Not only do we start to master the art of flying, but we gain a new and privileged perspective. Everything looks different from above. Our notions of the world and the potential of projects changes. The air feels lighter and things look so small that they no longer seem threatening. We can finally trace our path without obstacles in our way.</p><p>Being centered is an incredible added value. To not trigger negative or hindering feelings is one of our main duties on our journey towards excellence and performance. This also links back to the point made in the previous self-assessment.</p><p>Being centered means being fully present. No distractions, no interference from useless thoughts or worries.</p><p>So, there isn’t much of a choice. If we want to invest ourselves in a new activity or become excellent at something, we need to take a very honest look at the feelings we experience every day.</p><p>We need to have the courage to admit that frustration only strays us from our ideal target.</p><p>Otherwise we will simply not invest the time, money and courage required to succeed.</p><p>I clearly remember that during all those years when I didn’t feel centered at work the notion of investing in the company or its staff never even crossed my mind. If a new and interesting client appeared, I saw it more as a problem rather than an opportunity. I was disconnected from the notion of giving the best of me. I was not “pushing through” at all. I was simply not in the right frame of mind. I lacked a real drive and motivation.</p><p>Goleman, author of one of the most important books on managing emotional intelligence, quotes research conducted by Mayer. Mayer holds that there are three kinds of people</p><ul><li>Self-aware</li><li>Engulfed</li><li>Accepting</li></ul><p>I was definitely in the third category. I was one of those people who know what the problem is, but just won’t do anything to change it.</p><p>Only those in the first category can successfully manage and leverage events and not fall prey to negative feelings.</p><p>But perhaps you are not so terribly defeated, and you are still sufficiently motivated to “push through”. Perhaps you just do it because it’s in your nature, even if you’re experiencing terrible negative emotions. In this case it’s just a matter of fine-tuning, of identifying the link between these feelings and what causes them.</p><p>In my case, when clients wanted to haggle the prices, I felt completely out of place, like a fish out of water. I felt overpowered by a feeling of disgust, I felt an urge to rebel, and it got to the point that I would simply end meetings by asking clients to check with other firms or other colleagues. I experienced these emotions because I felt that my quality of my work wasn’t being valued, that some clients were trying to pay as little as possible, and in doing so they slyly questioned the validity of the price I was demanding. I felt like my morals and credibility were being questioned. So, I started to plot a new course. In fact, two: raise the profile of my clients while also focusing on selling my know-how online, so that I wouldn’t have to deal with retail clients.</p><p>As Gandhi said, “be the change you want to see in the world”.</p><p>When you feel able to “push through” freely and without hindrance, experiencing yourself as centered, then you will have certainly earned a 9 in this self-assessment.</p><p>Physics have a clear explanation for this: if you are centered and find your balance, you can perform any action with maximum efficacy and without falling.</p>",
      "<p>Now we look at our natural “tendency to do better,” regardless of our Technical capacity.</p><p>As you have probably figured out, with each T our goal is to dig a little deeper inside of us. We need to reflect on every single useful profile so that we may free ourselves of any bonds that are holding us back. While in the previous area for improvement we were trying to find our center, our willingness to fully commit to what we are doing, here we are dealing with an even more subtle and intimate dimension.</p><p>Even though reputable researchers have shown that “temperament does not equal destiny”, (since people can adjust their reactions, manage and train their feelings) we can’t deny the fact that trying to do something that simply does not sit right with us can have terrible consequences in the long run. If we’re talking about work, we all know that our jobs take up so much of our time that they have an enormous weight in terms of value. Meaning that if we are stuck in a job that doesn’t gel with us, we are creating the foundations for a very unhappy life and are deeply undermining ourselves.</p><p>So, let’s go back to the notion that Talent is a mere natural tendency. A gift of mother nature that in and of itself does not guarantee success, be it financial or of any other kind.</p><p>Over the past thirty years, many famous studies on excellence and performance have highlighted that training trumps talent every time.</p><p>For those skeptics who believe that talent is nothing more than a high IQ, I have some news that will shake things up: research has shown that IQ has, at best, a 20% impact on our likelihood of success. The remaining 80% is completely up to us!</p><p>Talent is elusive and hard to measure objectively, even though myelin researchers hold that talented individuals and geniuses have more efficient neural connections because they produce more myelin than the average person. But in certain activities, such as sports, we are talking of measuring things that happen in fractions of a second. Think of a 100-meter runner: think of the moment when the gun goes off and the speed at which they shift from impulse to action after hearing the gunshot.</p><p>The more convincing studies also tell us that intelligence does not express itself in a single way and cannot be summarized as a mere IQ score.</p><p>An IQ score is a particularly misleading indicator. Used since as far back as the fifties, the IQ score does not consider certain key aspects of our lives that are central not just to our happiness but also to the success of most of our endeavors in any kind of field.</p><p>We will interpret this self-assessment from the perspective of our own kind of intelligence, which, obviously, helps us feel well suited to the activities that are aligned with it.</p><p>Let’s look at the types of intelligences identified by Howard Gardner:</p><blockquote><ul><li>Linguistic</li><li>logical-mathematical</li><li>visual spatial</li><li>musical</li><li>kinesthetic or procedural</li><li>intra-personal</li><li>interpersonal</li><li>naturalistic</li><li>existential</li></ul></blockquote><p>So, the question is the following: which of these types of intelligence do you identify with the most? Which of these natural talents have you been gifted with?</p><p>This is one of the Method’s most important steps. You can clearly see why. Unfortunately, we are filled with prejudice and despite our best efforts we are drowning in a sea of stereotypes that tend to condition our thinking almost through osmosis.</p><p>Our ability to honestly and unbiasedly assess things is constantly and harshly tested. Many studies have highlighted our extreme contradictions even in such sensitive fields like welfare or finance. What’s more, our brain tends to ration its available resources and often clumsily leads us to terrible cognitive biases.</p><p>It’s important to remember that even when we describe ourselves or others describe us, strange contradictory associations come into play and feed into a distorted vision of who we really are.</p><p>I still remember an experimental aptitude test that I (and the other kids in my high school) had to take to help us figure out what we should go on to study.</p><p>My profile, prepared by an independent expert, clearly revealed that I should work in close contact with nature. The bare minimum for my peace of mind was to work in the outdoors. I was twelve years old and my mother was sitting right next to me and what we were being told went completely opposite to my family’s cultural background and expectations.</p><p>The whole thing was quickly forgotten and never taken seriously neither by my parents or myself. Decades later I remembered the experience, that day in particular and the ease with which this selfless advice was dismissed.</p><p>I got my best scores in scientific subjects, so I focused my studies down that path. Decisions were made without any nuance. The environment I grew up in did not allow me much speculation about my true identity, nor much philosophizing at all, so my alleged tendency to enjoy the outdoors was never explored. It was not aligned with the expectations of a “normal” career that a “normal” person would have.</p><p>Nowadays, after a whole life confined to the enclosure of a big city, I aspire to permanently move to the mountains. I find refuge in their silence, and I escape to the forests with my bicycle whenever I get the chance. Lately I often think back on that day.</p><p>I’ve thought about it also in light of the feeling of immediate satisfaction that I experienced whenever I trained; and of the fact that despit there being so many indoor sports, I never practiced a single one of those.</p><p>For decades I felt the same way as many other professionals: I had a firm to grow and I marched on like a railroad car on a railroad track.</p><p>I too was a victim of cognitive biases and erroneous associations. I certainly couldn’t turn my life upside down, but I certainly could have steered it as best as possible.</p><p>In my book “THE A4T METHOD”, I describe my personal experience finding the courage and confidence to build a successful life based on the kind of maximum effort I could can only achieve by working in alignment with my true nature and Talent.</p><p>But now it’s time for you to analyze which types of intelligence you possess. Often, if you have more than one of these forms of intelligence identified by Gardner, things can get a little confusing, I know.</p><p>In my case, for example, I identify with the first, second and eighth type. I am hopeless as far as the third and fourth are concerned. I would have never made it as an architect or musician. In the remaining areas I’m certainly not excellent, therefore if want to pursue my absolute best performance, I should rule those out as well.</p><p>So now it’s your turn to ask yourself these questions:</p><ol><li>Is what I’m currently doing truly aligned with one of my areas of intelligence?</li><li>If so, are my other types of intelligence also used in this activity?</li></ol><p>While the first question is very clear, the second delves deeper, aiming to measure the full involvement of your natural talents.</p><p>Think of your Talents as mouths to feed, which complain if you let them go hungry. Their cry for nourishment can manifest itself as background noise, as second-guessing yourself or simply as an internal voice that is always judging you. You can’t leave any part of yourself unfulfilled or unexpressed.</p><p>If you feel that you have more than one talent, it may be difficult to determine which one is the dominant one, especially if you consider your cognitive biases and prejudices. Especially if you think about the fact that you may simply never had the chance to truly put them to test.</p><p>Therefore, ideally you would involve them all and put them all in the service of your best performance.</p><p>So now, the third question you must ask yourself will be:</p><ol><li>How can I make changes to engage all my talents and fully align with my true nature?</li></ol><p>In my book I tell the story of what happened when I realized that teaching gave me a great sense of fulfilment. When I identified with the intelligences, I mentioned earlier I figured I’d use the know-how that I had spent my whole life learning but focus on a new activity. I wanted to help people improve themselves, see them grow and evolve with training. When I incorporated my expression of linguistic intelligence by writing and preparing these materials my outlook changed almost overnight. It was like switching into turbo mode, partly because I was also forced to drop other commitments that were weighing me down.</p><p>I expressed my naturalistic intelligence by moving into a new house in a much greener location, completely different from living in a chaotic city.</p><p>Nowadays, my life is very reminiscent of that saying that goes, “Choose a job you love and you will never have to work a day in your life”</p><p>To score a 9 in this area of improvement you must focus your intelligences and involve them all, excluding none.</p><p>You might have to get really creative in order to find the right solutions and adjustments to achieve this ambitious goal. You must stop fearing change and dare to try new things. It will be like having the finest suit ever tailored just for you.</p>",
      "<p>I once read an interview with a soccer coach who made it big in the European leagues during the latter years of his life. The interview went over the various stages of his life and it focused heavily on the fact that he used to train amateurs in the evening, after he got off from work at the bank.</p><p>Then, as is often the case, he had to make a choice. He got an offer (not a million dollar one) from a team in a higher league. Would he leave the familiar for the unknown? His job security to follow his dreams? His words, which I quote verbatim, once again echo the importance of this area for improvement: “I ended up choosing what I would have willingly done for free”. From that moment on, his life was defined by success after success, as he pursued higher and more ambitious goals.</p><p>A selfless passion can unleash an amazing chain of events in our lives.</p><p>I mean selfless in terms of pursuing material benefits. Money first and foremost. If we focus on the method and its components for success, money will inevitably come to us as a consequence.</p><p>Our culture is deeply rooted in this notion of “you give me, I give you”. Quid pro quo. If I do something, I must get something in return; especially when work is concerned. Acting in any other way would seem unthinkable. And it’s fair to receive what we’re due. But what I’m talking about here is that we need to discover what’s more important to us than money. I am talking about the values that inspire us, or that would inspire us if we didn’t let other external factors get in the way.</p><p>If you have a hard time answering this self-assessment, do the following: picture a world where everyone’s needs are covered, where no one is forced to make a living; no bills to pay, no shopping expenses, no rent, no mortgage. A perfect world where people are free to pursue whatever interests them, that fulfils them personally, where people can do what they feel they were born to do. To answer this, you need to really dig deep. You must figure out what you would pick in this perfect world. Because at the end of the day, even if you don’t live in a perfect world, your goal is to strive to build it in your life, by starting with yourself and your choices. Once you are in this mindset, calmly ask yourself the following question:</p><p>What do I want to do in this perfect world? I, for one, would coach sports every morning and would work at a bicycle workshop in the afternoon.</p><p>You must answer this question with absolute peace of mind and honesty; almost instinctively, free from all prejudices, since in a perfect world people don’t judge other people, and certainly don’t judge themselves.</p><p>If you find the answer you have made good progress. But if you have a hard time identifying it, you must go back to the origins of your ethical imprinting.</p><p>What value are you really willing to commit to regardless of payment?</p><p>Once you have answered this question the following one will be easier.</p><p>Of the activities I’m involved in, which one encompasses this higher value?</p><p>Here, the experience of flow comes into play, just as it does in Technique.</p><blockquote><p>“Flow is a state of self-forgetfulness, the opposite of rumination and worry”</p><p>Daniel Goleman – Emotional Intelligence</p></blockquote><p>So, this higher value for which we would carry out a completely selfless activity in this perfect world should be so important to us (and us alone) that it precedes even our own perception.</p><p>Some people tell me they have never experienced this extraordinary feeling. But as we dig deeper the memories come to surface with great strength. Because it’s in our nature, especially when we are young, to give ourselves fully and selflessly to a cause, free of any prejudgments and facile typecasting. Even if it’s only for a few hours during a teenage game, at play we are always selfless, because we love to play.</p><p>But so, how can you score a 9 in this area for improvement? By performing your activity without being undermined by negative judgment, be it internal or external, while also not expecting any reward for it. You must become bulletproof against judgment; that is the path to unleashing your true nature.</p><p>To score a 9 in this area for improvement you must reassert the “supremacy of flow”. If you don’t experience it in your life now you need to find it in your memories. That feeling of being above it all as you perform an activity. A feeling which can last even just a couple of seconds, but which will increase and grow as you become able to recognize it.</p><p>Develop this awareness and in time you will even learn how to kind of measure it. A 9 will be yours when you learn to experience full immersion in the “active world”, while you simultaneously remain focused and interconnected with all your technical and intellectual skills.</p>",
      "<p>Our goal, now that we’re at it, is to achieve excellence in performance. To be as efficient as possible; which in turn means to achieve the best result possible in relation to the resources available to us. The technical level of an ACE may initially seem like a distant goal, since we’re talking about a level of technique that springs from the unconscious; controlled with ease due to neural connection formed after thousands of hours of training and deep practice. An ACE’s technique is a collection of skills that may involve both the intellectual and physical realm or even just the intellect, depending on the type of activity that is being carried out.</p><p>In the example of the attorney that realizes he needs to improve at public speaking, his reference for an Ace’s technique will be some of the world’s greatest speakers; which is why he would find it useful to watch many videos on public speaking competitions and famous speeches to really get a grip on who are the top speakers and to assess his level compared to them.</p><p>It goes without saying that the attorney will have to realize that while his activity so far has been mostly intellectual, public speaking will entail he also learn to efficiently manage his body language.</p><p>What I’m getting at with this is that identifying the technical level of an Ace can often help change the paradigms that have led us to our current level of professional awareness. However, we must be as honest as possible in identifying the Ace’s level as our final target for the physical and intellectual performance of technique.</p><p>Discovering that you are light years behind an Ace can be a humbling experience, but you must be honest if you want to truly identify the gap that separates you and that you are hoping to close. Let’s not forget that it’s thanks to the Acetracker that the A4T Method offers you constant monitoring on your journey towards personal success, and which focuses your efforts on the synergies between its components, which must be assessed calmly and honestly.</p><p>So, it’s easy to see that in order to score a 9 on this self-assessment, your technical level must be akin to that of a real professional, meaning you are performing at the highest level possible for a task, profession, or even a sports activity. The technical skills of a 9 are not necessarily boundless but are certainly suited to easily deal with specific tasks or activities.</p><p>So, for example: certain professionals at the top of their game are known for their hyperspecialization, which often is precisely what made them famous or what they are known for.</p><p>The consultancy sector, for example, tends to favor vertical specialization, which helps gain access to niche markets, so that professionals can focus on learning fewer things but at an almost maniacal level of detail, nearing perfection.</p><p>To better understand the importance of this kind of vertical specialization, let’s not forget that many sport champions have made a name for themselves by focusing solely and exclusively on a couple of core skills that are particularly well aligned with their physical traits.</p><p>For example, some tennis players have specialized in playing the backcourt. Some soccer players, because of their physical build, have focused their entire career on head shots.</p><p>In the corporate world if you’re not particularly talented at public relations you’ll soon have to answer the difficult question: do I focus on learning PR or do I just specialize in those aspects of my job that don’t involve dealing with clients directly?</p><p>So in this second scenario, for example, an online marketing specialist could decide he wants to sell his know-how online, through a series of webinars or pre-recorded sessions, rather than in real-time, specializing on certain specific aspects of his line of business; a marketer could, for example, choose to provide consultancy only to offshore companies, while an online marketing specialist could focus only on legal firms because it’s a virgin market with virtually no competitors.</p><p>This generalized pursuit of maximum verticality could mean that you might have problems identifying a proper benchmark to compare your results against. But actually, the standards that define an Ace’s Technique are always the same: a skillset that, when used, doesn’t induce any stress and doesn’t require any additional presence of mind or conscious adaptations. These skills will work in the background, without requiring any conscious adjustments, acting from a calm mindset that is completely focused on its Target.</p><p>If you meet these conditions, then congratulations, you can assign yourself a 9.</p>",
      "<p>The value of this self-assessment comes not just from what its score tells us, but from the self-assessment process itself.</p><p>Through the learning process, our know-how increases. It helps become more and more aware of what we’re doing right and what we’re doing wrong. It’s a very instinctive process and the natural consequence of any activity we partake in, as long as our commitment involves deep practice with full presence of mind. And that’s also the point. We need to be fully conscious and completely focused in performing the technique. We need to be able to observe attentively and calmly, free of any emotional conditioning. We need, as Freud called it: “evenly-suspended attention”. We are therefore in the realm of self-awareness. If we can perceive and identify our mistakes on the spot, rather than after the facts, then will be close to a top score.</p><p>To score a 9 in this self-assessment you must work on developing your self-awareness. You must work on “self-empathy”. As neuroscience has shown, we are genetically hardwired to feel other people’s emotions. But we should also take the time to focus on our own emotions. Because “identifying our mistakes” goes beyond mere technique. We need to learn how to get in touch with ourselves so that we can detect mistakes as we commit them; hopefully even before that.</p><p>A few years ago, I saw something that really helped me increase this ability.</p><p>I was on the bleachers watching a professional soccer team train, and I remember seeing this famous soccer player working on kicking the ball out of the air as it was thrown at him by the coach from outside of the playing field. Obviously, he was trying to score as many goals as possible. Kicking the ball out of the air is one of the most incredible moves in soccer, and doesn’t just look spectacular, it’s also incredibly hard to pull off from a kinesthetic perspective.</p><p>What I saw that day was at once incredible and inspiring.</p><p>This soccer player, as he was about to kick the ball out of the air, would sometimes yell “Goal!”. Every time he did, the ball would end up smack dab in the net. When he didn’t yell “Goal!”, he didn’t always score. Obviously, this highlights the importance of projecting yourself towards your Target, and it was clear that this soccer player could “feel”, just a moment before hitting the ball, that everything would go smoothly. He would then perform the technique flawlessly. I was witnessing “unconscious competence” of such caliber that the goalie was being intimidated every time he heard him yell the simple word “Goal!”... As I thought back upon this scene, I realized that it was not simply a matter of technique, but also of truly being able to read oneself prior to performing an action. MRI studies have shown that our brains dictate our actions well in advance of us actually performing them.</p><p>Our brain, or perhaps our mind, which is a construct of our brain, is already hard at work before we consciously “decide” to do something.</p><p>The soccer player had developed this ability to feel when every variable was exactly in place. He had mastered some kind of extremely powerful intuition. I kept remembering this episode and tried to put it in service of my own performance. I started trying to listen to my own mind as it worked in the background, for example right before meeting with a client to provide consultancy services, I would try to fine tune my ability to feel and deduct what my mind had already prepared for me. If you have ever practiced a sport involving a ball, at some point you will have felt, right before hitting that ball, that you were about to score. There are times when you don’t even need to assess things after the facts. You feel it with absolute certainty. Once you are in synch with this perception you will know when you are out of tune and are about to make a mistake. I recently had to give a speech at a company at the end of their fiscal year, concerning legal issues and corporate finance. I had been invited only two da prior.</p><p>I studied public speaking for a short time, and I know the basics. On this occasion I didn’t have much information about the audience or the other speakers, so the risk of being out of synch were quite high.</p><p>I opted for a technique that focused on form instead rather than substance, and which aimed at keeping the audience engaged based on the style of presentation rather than its contents. I was technically confident, so I didn’t feel nervous, and my skills effortlessly worked in the background. As I gave my speech, I was able to think of the arguments that I went on to immediately articulate, and just like that soccer player, I could “feel” which arguments would gain the audience’s approval.</p><p>To earn a top score in this self-assessment, you must be fully perceptive of your intuition, which will alert you as if to say “Go! You’re doing things perfectly!” while at the same time, will warn you of potential mistakes you are about to commit.</p>",
      "<p>We all dream of being able to perform our actions from a place of complete inner peace. We instinctively admire anyone who can nonchalantly do something with incredible confidence and aplomb. It’s remarkable to think that this ability, within the grasp of every living being, can make such a difference in our daily lives. Have you ever been fascinated by the perfection with which a spider weaves its web? Or by the impeccable craftsmanship and skill of a bird building its nest, one twig at a time, high upon a treetop?</p><p>Yet animals don’t seem to display any self-awareness. They don’t seem to have that inner voice that ends up being inner noise; that self-doubt that keeps us from being fully immersed in what we are doing, be it a physical or mental activity.</p><p>When we reach the level of unconscious competence our actions become like a dance. Everything becomes effortless and flows. We witness a sort of miracle of perfection in each step we take...</p><p>As a child, I used to ride the bus to school. I used to love sitting behind the glass that separated the driver from the passengers and just observed his movements. I was enthralled by the way he skillfully turned the enormous wheel and the confidence with which he navigated even the narrowest spots, deftly avoiding obstacles, cars and pedestrians. His arms and hands turned in elegant circles around the wheel. It all seemed so extremely familiar to the driver that his eyes seemed to be looking out beyond the obstacle in front of him, already scouting the road ahead.</p><p>I was amazed… Not just by the ease and skill with which he piloted a gigantic metal beast full of people through narrow roads of chaotic traffic, but especially by his peace of mind and the elegance of his movements. The driver seemed to be one with the action of driving. The driver was like the spider, calmly weaving its web. When you are in the zone of unconscious competence you are the one who performs the action and also the action itself. In other words, it’s impossible for you to make a mistake.</p><p>Every living being reaches unconscious competence by first going through the same process of Trial and Error. In the book “THE A4T METHOD” we went over the latest discoveries on a substance called myelin. Produced naturally by our bodies during the learning process, myelin helps neural activity become more efficient. The more times we attempt to do something, and the closer together those attempts are, the more myelin we produce. This substance acts as insulation for our nerve fibers, making them more efficient in transporting signals. The more we train, the more we approach the level of unconscious competence. The more frequently we train, the more myelin we produce.</p><p>As a famous author once said: “myelin is meritocratic”, it doesn’t care who you are, how much money you have or what line of work you’re in. It rewards only those who apply themselves deeply and are fully and unbiasedly immersed in their training. Myelin can help you learn another language, recite poetry like an actor or play baseball to the best of your ability.</p><p>Now, to reach the level of unconscious competence we must get into what many authors call “flow”, a state of mind where everything seems suspended, including time itself, and where everything flows effortlessly, and technique is performed spontaneously. To get into this state, producing more myelin is essential.</p><p>To score a 9 in this self-assessment you must be able to get into a state of “flow”. You must be able to carry out an activity effortlessly. You should potentially be able to focus your mind on other things while performing the activity. Your ability to react to any unforeseen input should be absolute and should be experienced as something mundane.</p><p>I’d like to remind you of Daniel Goleman’s words on the experience of this state of “flow”:</p><blockquote><p>“But the zone of flow and optimal performance seems to be an oasis of cortical efficiency, with a bare minimum of mental energy expended. […] having mastered the moves of a task, whether a physical one such as rock climbing or a mental one such as computer programming, means that the brain can be more efficient in performing them. [...] people in flow exhibit a masterly control of what they are doing, their responses perfectly attuned to the changing demands of the task.”</p><p>Daniel Goleman – Emotional intelligence</p></blockquote><p>If we look at Mountain Biking, for example, obviously anyone who knows how to pedal and ride a bicycle will be able to chat with his friend as they ride along a flat trail, but as soon as they reach the first downhill full of holes, mud and roots their skill may be insufficient to keep chatting while navigating the trail. You might feel really skilled and confident pedaling along a featureless trail, so much so that you will probably be able to focus your mind on other things, but as soon as the first obstacles and the threat of physical peril come into play, your level of stress will rise if your skill level is not high enough.</p><p>The same applies to any lawyer, news anchor, journalist or surgeon. If we are treading the beaten path even an imperfect level of skill may suffice, but true unconscious competence is not afraid to sail past the edge of the earth. The best single-handed sailors know they will have to brave unknown storms, but as we have seen their “total” mastery, tested time and time again through trial and error over a vast number of different scenarios keeps their stress at bay, and so there is nothing that can pull them out of their state of flow.</p><p>Our brain is very skilled at establishing links in order to problem solve as quickly as possible and to respond to emergencies. This can be an advantage but can also lead us to commit terrible mistakes. Being able to access an extensive and varied collection of experiences can make all the difference. That way, when you are required to give your best performance even under extreme conditions, you will still be able to “flow” and let conscious control work in the background. So, having an extensive and extremely solid databank of experiences that allows you to quickly identify the best course of action, even under the most extreme and difficult circumstances, will get you close to scoring a 9 in this self-assessment.</p>",
      "<p>This one is directly related to the previous self-assessment, building a sort of continuum of the key points that we must keep in mind to really get the best out of ourselves.</p><p>“Learning to learn” seems more like a play on words than an actual saying. But really, we could define it as a conscious and truly mature state of mind, aimed at our holistic development, which, in order to improve technique, leverages our truths without questioning them, at least not at this stage. It’s a very natural strategy that any person who has had the chance to scrutinize the learning process develops over time. It’s the path that leads to flow, even if only for an instant.</p><p>By truths I refer to those things we discover day after day while we face the highs and lows of the learning process. Obviously, what most people expect after fully immersing themselves in their training, is to constantly make progress. I am taking for granted that we all understand the importance of producing myelin as the next step in achieving perseverance.</p><p>Perseverance helps us soldier through those negative days when results seem nonexistent.</p><p>Remember that the learning process can be envisioned as a number of plateaus, increasing in height, with sudden steep hills in between them. Sometimes we are amazed by how something that seemed impossible to us just a couple of days ago, now we can do effortlessly. But we must remember that in between periods of growth there are also occasional negative dips.</p><p>It’s extremely important that we properly frame these highs and lows.</p><p>Regardless of field of activity, the story of most Aces is often full of anecdotes and even funny stories about how their teachers or mentors at one point suggested they quit the activity altogether… and we’re talking about people who went on to become true legends.</p><p>Some aspects of this self-assessment are precisely at the core of what made the difference for many of these Aces.</p><p>The first is what Carol Dweck calls a “growth mindset”. We need to carefully study our prejudices to eliminate any belief concerning our inability to change ourselves or to develop our intelligence. We must come to fully understand that we are always in the act of transforming. In fact, stasis is impossible. It is biologically impossible to remain unchanged. So, it is best to work on constantly evolving. This approach also requires us to be profoundly optimistic. It’s important to clarify this: when we have reached a plateau and we are going through some hard times and it seems like we are unable to get the results we feel that we so rightfully deserve, it’s perseverance that will project us towards what we will become. The rest is just busywork.</p><p>If my goal is to become a world class speaker that can stand in front of an audience of hundreds of people and captivate them effortlessly, yet I’ve just given a mediocre presentation to a small group of auditors, I have one of two options: I can soldier on and interpret what just happened as a necessary step and opportunity to learn from my mistakes on my road to personal development... Or look at my mediocre result with self-contempt...</p><p>And that’s precisely the point. Mediocre shouldn’t even be a part of our vocabulary. We are not aiming for the middle of the road; we are aiming for the top of the hill. So, even a mistake is just a step along the way and not the end result.</p><p>A rigid mentality is harbinger of failure. As Angela Duckworth in her book “Grit” explains, we all have a very active pessimist inside of us, ready to judge and to make us see the glass half empty. If we want to succeed, we need to identify him and shut him down.</p><p>To score a 9 in this area of improvement you must be able to do just that: shut down the pessimist, be perseverant, forget your apparent regressions and negative dips.</p><p>You must focus your mind on always finishing what you start, never interrupting an experience. Things must be judged only in their entirety. Or as the saying goes: “Finish how you started and you will always be successful”. You must train your perseverance if you wish to succeed, because it’s a key component of “learning to learn”. Numerous researchers, at various points in history, have confirmed that perseverance is one of the keys to success, often-times more important than knowhow or talent. We believe it is an essential element of the process of “learning to learn”. Without perseverance you will not learn to learn, and you cannot hope to score a 9.</p><p>To score a 9 you must be extremely perseverant. To achieve this, you must have internalized the methods of learning and leave no room for doubt. You have gone beyond mere rational understanding of the learning process and of the biological reasons behind performance. You know that hardship is an intrinsic part of the process.</p><p>And finally, the key element for a 9. You need to improve Technique through Training, so that, in Erich Fromm’s words, your mode of existence is “to be” rather than “to have”. You need to banish all forms of narcissism and focus your learning on changing at a deep level, keeping your mind open to letting this change happen.</p><p>You must perform to the best of your ability using Technique as a tool for self-development. Your consultancy services, your sports performance, whatever the goal you are pursuing through the use of the A4T, it will be the end result of competences built on Technique, but you must have internalized that Technique at such a level that you have truly made it a part of you. If you only have skills, they will be nothing more than merchandise on display. If you become the skills the difference will be remarkable.</p><p>Therefore, learning to learn at its highest level means Being Technique instead of Having Technique.</p><blockquote><p>“Students in the having mode have but one aim: to hold onto what they \"learned,\" either by entrusting it firmly to their memories or by carefully guarding their notes. […] The process of learning has an entirely different quality for students in the being mode of relatedness to the world. […] They do not simply acquire knowledge that they can take home and memorize. Each student has been affected and has changed: each is different after the lecture than he or she was before it.”</p><p>Erich Fromm – To Have or to Be?</p></blockquote><p>To summarize we need:</p><ul><li>Confidence understood as a sense of control over the environment that surrounds, which we believe we can modify through our actions</li><li>Curiosity understood as the pleasure of discovery</li><li>Intentionality meaning the will to be decisive and persistent</li><li>Self-control, meaning being aware of our own behaviors and thoughts</li></ul>",
      "<p>Quoting Carol Dweck:</p><blockquote><p>“We have raised a generation that can’t get through the day without an award. The meaning of sacrifice and hardship are transformed when we come to understand that our abilities and skills can be enhanced by training outside of our comfort zone, which is how new neural connections are created.”</p><p><a href=\"https://youtu.be/_X0mgOOSpLU\" target=\"_blank\" rel=\"noreferrer noopener\">TED 09/2014</a></p></blockquote><p>Because inside of my comfort zone I don’t experience hardship and I don’t expand the limits of what is “known” to me, because every external input I receive is still encompassed by those limits, is still part of what I have previously experienced.</p><p>We must identify our comfort zone by critically analyzing our reactions to external stimuli. We need to understand that it acts like an enclosure.</p><p>It’s useful to draw a circle on a piece of paper and visualize ourselves within it. We will write in there all our skills and activities and the feelings we associate with them; we will write in as many as we can think of.</p><p>That is a map of our comfort zone.</p><p>Outside of it, we will write all those things that we don’t know how to do, that we do not master, those that we are afraid we might have to do someday, and we’ll also write our feelings about these things.</p><p>Putting our Comfort Zone into proper perspective helps us become aware of Training’s true potential. As we’ll see, our enclosure will keep expanding at the same rate as the quality of our Training.</p><p>It’s useful to repeat this exercise and consider that everything inside of your comfort zone is managed as best as possible and in line with the highest standards of efficiency and performance.</p><p>All the neural connections required for the skills and activities inside of your enclosure have been established.</p><p>Obviously, if you repeat this exercise you may notice that some activities now seem borderline or even outside of your Comfort Zone due to a setback or some misconception about yourself.</p><p>But usually your comfort zone will have a very solid core, a sort of baseline acquired by frequently practicing certain activities, which you have probably been building upon since you were a child. Examples of these are: speaking a foreign language, motor skills in general as well as physical skills such as riding a bicycle, swimming and playing various sports. In time, you can expand this core to encompass more content, such as the ability to read, write and drive... While many of these activities were at point difficult and stressful for you, they helped you gradually expand your limits and broaden your enclosure.</p><p>So, in order to aim for a 9 in this first self-assessment test, you need to more clearly identify your Comfort Zone by carefully analyzing the activities involved in achieving one of your targets and how these activities make you feel. Remember that driving, reading, writing and even walking are now in your Comfort Zone precisely because they do not induce any feelings of stress and therefore require no additional brainpower or particular attention on your part.</p><p>Keep in mind that identifying your Comfort Zone is a step by step process, which requires you to take stock of your feelings even on a daily basis. Your comfort zone allows you to figure out your limits, which are the threshold within which you can achieve maximum performance through unconscious competence.</p><p>Link with the transactional analysis:</p><ul><li>in order to clearly define our Comfort Zone, we need the ADULT. We need his experiences and his objective assessment of these experiences. We need him to carefully assess the results obtained and confirmed over time.</li><li>at the same time, we must rely on the CHILD, who triggers our feelings. We must observe him in order to figure out whether things we think we master are not actually causing us any feelings that could undermine our performance.</li><li>We could say we need the ADULT to list the activities and the CHILD to verify whether they actually belong to our Comfort Zone.</li></ul>",
      "<blockquote><p>“It’s in fact been proven that whenever we get out of our comfort zone we build new neural connections. It’s that “not yet” culture, being conscious that I am on a learning curve. We need to foster a growth mentality based on the certainty that our capacity to learn is not set in stone, but rather changes in relation to our effort and sacrifice. Failing is not a permanent condition, but rather transitory”</p><p><a href=\"https://youtu.be/_X0mgOOSpLU\" target=\"_blank\" rel=\"noreferrer noopener\">TED 09/2014</a></p></blockquote><p>In order to score 9 in this area of improvement you must remember that new neural connections need to be created and new synapses must be formed. This process does not just occur on its own, but actually requires specific stimuli.</p><p>Being aware of your Comfort Zone gives you a clear picture of the areas you must expand, the obstacles to overcome. It is only there, in uncharted waters, that you will learn to face the unforeseen, that you will fight new challenges and come up with new solutions. The reach of your limits expands and your emotions level out into the calmness of performance.</p><p>But to score a 9 in this self-assessment you must have an almost Pavlovian response to the thought of your Comfort Zone.</p><p>Because you might know your Comfort Zone but remember that it is also your number one enemy! To be an Ace in this area you must be “outside the box” willingly and often. You must be in that area where frequent mistakes will only be improved upon by trying and training again and again.</p><p>To score a 9 you must learn to love the Uncomfort Zone. You must “consciously feel” like Ulysses, exploring the uncharted, day in and day out. You must become Ulysses.</p><p>Quoting Emil Cioran: “if you change your attitude towards things, you will change things”.</p><p>Link with the transactional analysis: we leave our Comfort Zone thanks to the ADULT, who filters experiences and adds to his skillset, and thanks to the PARENT, who defines the rules of behavior to navigate this field of new and undiscovered inputs.</p>",
      "<p>This self-assessment focuses on a “quantitative” variable. The mechanisms through which learning work start having an effect only if we apply them regularly. As you probably already know, the efficiency of performance relies on training deliberately and for long enough as to activate new neural connections. As we shall see, without this, we will never reach the level of unconscious competence, which is precisely what we are after. We also know that success is not linked to merely “quantitative” efforts, but also to the synergy that exists between quality and quantity. But remember that biology mandates that evolution only occurs over the span of thousands of years, so we are forced to stick to trial and error until we have lowered likelihood of the latter to near zero.</p><p>Which is why it’s important to be transparent about the level of training required to be a true Professional, an Ace. We must never underestimate the importance of intensive training. Remember that before being an Ace, a professional went through all the interim stages on the path to “mastery”, and we’re not just talking about technical mastery but also emotional mastery, as I explained earlier.</p><p>The only training that allows us to move up from one level to the next is the kind that we consciously perform outside of our comfort zone. The process of “trial and error” defines our deliberate practice, where we train and measure ourselves against challenges by fully becoming involved in the process. We need to be completely present to ensure that we are “training” at the right level.</p><p>In short, you must leave your comfort zone (confirmed by the fact that you are making mistakes and that your mind is fully engaged in performing a specific activity), and you must also be completely conscious and train for sufficient hours a day every day in order to expand the limits of your comfort zone and therefore of your unconscious competence.</p><p>As a perfect example of this think of an ai
