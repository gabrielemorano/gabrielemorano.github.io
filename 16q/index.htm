  // English and Italian both inflect the noun, so one assessment needs its own
  // string rather than reading "1 assessments".
  const counted = (key, n, one, many) => strings.format(
    n === 1 ? label(`${key}_one`, one) : label(key, many), n);

  const CHEVRON = '<svg width="9" height="15" viewBox="0 0 9 15" fill="none" aria-hidden="true">'
    + '<path d="M8 1 L1.6 7.5 L8 14" stroke="currentColor" stroke-width="1.6"'
    + ' stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const BURGER = '<svg width="17" height="13" viewBox="0 0 17 13" aria-hidden="true">'
    + '<g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">'
    + '<path d="M1 1.5h15"/><path d="M1 6.5h15"/><path d="M1 11.5h15"/></g></svg>';
  const CLOSE = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">'
    + '<g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">'
    + '<path d="M1 1l12 12"/><path d="M13 1L1 13"/></g></svg>';

  // A mortarboard: the essays are the book's teaching material rather than
  // anything the assessment needs, so they sit behind an icon that says so.
  const CAP = '<svg width="17" height="14" viewBox="0 0 20 16" aria-hidden="true">'
    + '<path d="M10 1 L19 5 L10 9 L1 5 Z" fill="currentColor"/>'
    + '<path d="M4.6 6.9 V11 c0 1.6 2.4 2.9 5.4 2.9 s5.4-1.3 5.4-2.9 V6.9" fill="none"'
    + ' stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'
    + '<path d="M18.6 5.3 V10" fill="none" stroke="currentColor" stroke-width="1.5"'
    + ' stroke-linecap="round"/></svg>';

  // ---- essay overlay ----
  // The essays run to several thousand words, so they rise over the app on their
  // own sheet: a bottom sheet on a phone, a centred card on a wide screen. The
  // entrance is a CSS animation rather than a scripted transition, so nothing
  // has to be timed and dismissal stays immediate.
  function openEssay(title, html) {
    const panel = $('#essay');
    if (!panel) return;
    panel.replaceChildren();

    const backdrop = el('div', { class: 'essay__backdrop' });
    backdrop.addEventListener('click', closeEssay);
    panel.appendChild(backdrop);

    // tabindex -1 so focus can move into the dialog for keyboard and screen
    // reader users without leaving a focus ring on the close button.
    const sheet = el('div', { class: 'essay__sheet', role: 'dialog', tabindex: '-1',
                              'aria-modal': 'true', 'aria-label': title });
    sheet.appendChild(el('div', { class: 'essay__grab', 'aria-hidden': 'true' }));

    const bar = el('div', { class: 'essay__bar' });
    bar.appendChild(el('div', { class: 'essay__eyebrow' }, label('read_more', 'Read more')));
    bar.appendChild(el('div', { class: 'essay__title' }, title));
    const x = el('button', { class: 'icon essay__close', type: 'button',
                             'aria-label': label('close', 'Close'), html: CLOSE });
    x.addEventListener('click', closeEssay);
    bar.appendChild(x);
    sheet.appendChild(bar);

    const body = el('div', { class: 'essay__body', html });
    sheet.appendChild(body);
    panel.appendChild(sheet);

    panel.hidden = false;
    // The page behind must not scroll under the sheet on iOS.
    if (global.document && global.document.body) {
      global.document.body.classList.add('is-reading');
    }
    body.scrollTop = 0;
    sheet.focus();
  }
  function closeEssay() {
    const panel = $('#essay');
    if (panel) { panel.hidden = true; panel.replaceChildren(); }
    if (global.document && global.document.body) {
      global.document.body.classList.remove('is-reading');
    }
  }
  const essayIsOpen = () => { const p = $('#essay'); return !!p && !p.hidden; };

  // Returns null when no essay exists for the key, so callers can append
  // unconditionally without emitting an empty button.
  function capButton(title, html) {
    if (!html) return null;
    const b = el('button', { class: 'cap', type: 'button', html: CAP,
                             'aria-label': `${label('read_more', 'Read more')} — ${title}` });
    b.addEventListener('click', () => openEssay(title, html));
    return b;
  }
  const essayFor = (kind, key) => {
    const set = moreinfo && (moreinfo[S.lang] || moreinfo.en);
    if (!set) return '';
    return kind === 'question' ? set.questions[key] : (set.indicators[key] || '');
  };

  // ---- drawer ----
  function buildDrawer() {
    const drawer = $('#drawer');
    if (!drawer) return;
    drawer.replaceChildren();

    const x = el('button', { class: 'icon drawer__close', type: 'button',
                             'aria-label': label('close', 'Close'), html: CLOSE });
    x.addEventListener('click', closeDrawer);
    drawer.appendChild(x);

    // Order runs from what you are most likely to want to do, down to a setting
    // you set once: new assessment, history, data, language.
    // The primary action leads, as a button rather than a list row — a heading
    // above it would only repeat its own words.
    const fresh = el('button', { class: 'btn drawer__primary', type: 'button' },
                     label('new_assessment', 'New assessment'));
    fresh.addEventListener('click', () => { closeDrawer(); renderHome(); show('start'); });
    drawer.appendChild(fresh);

    drawer.appendChild(el('h3', {}, label('history', 'Past assessments')));
    const saved = store.load(S.storage).assessments;
    if (!saved.length) {
      drawer.appendChild(el('div', { class: 'drawer__item drawer__item--empty' },
                          label('history_empty', 'No saved assessments yet.')));
    } else {
      const open = el('button', { class: 'drawer__item', type: 'button' },
                      `${label('view_all', 'View all')} (${saved.length})`);
      open.addEventListener('click', () => { closeDrawer(); renderHistory(); show('history'); });
      drawer.appendChild(open);
    }

    drawer.appendChild(el('h3', {}, label('your_data', 'Your data')));
    const dataItem = el('button', { class: 'drawer__item', type: 'button' },
                        label('export_import', 'Export and import'));
    dataItem.addEventListener('click', () => { closeDrawer(); renderData(); show('data'); });
    drawer.appendChild(dataItem);

    drawer.appendChild(el('h3', {}, label('language', 'Language')));
    const langs = el('div', { class: 'drawer__langs' });
    for (const [code, name] of [['en', 'English'], ['it', 'Italiano']]) {
      const b = el('button', { type: 'button', 'aria-pressed': String(S.lang === code) }, name);
      b.addEventListener('click', () => { S.lang = code; buildDrawer(); rerender(); });
      langs.appendChild(b);
    }
    drawer.appendChild(langs);
  }
  function openDrawer() {
    buildDrawer();
    const d = $('#drawer'), sc = $('#scrim');
    if (d) d.classList.add('is-open');
    if (sc) sc.classList.add('is-open');
  }
  function closeDrawer() {
    const d = $('#drawer'), sc = $('#scrim');
    if (d) d.classList.remove('is-open');
    if (sc) sc.classList.remove('is-open');
  }

  // ---- shared chrome ----
  function chrome(host, opts = {}) {
    const bar = el('div', { class: 'bar' });
    const back = el('button', { class: 'icon', type: 'button',
                                'aria-label': label('back', 'Back'), html: CHEVRON });
    if (!opts.onBack) back.hidden = true; else back.addEventListener('click', opts.onBack);
    bar.appendChild(back);
    bar.appendChild(el('div', { class: 'bar__title' }, opts.title || ''));
    const menu = el('button', { class: 'icon', type: 'button',
                                'aria-label': label('menu', 'Menu'), html: BURGER });
    menu.addEventListener('click', openDrawer);
    bar.appendChild(menu);
    host.appendChild(bar);
  }

  // ---- home (new assessment) ----
  function renderHome() {
    const host = $('#view-start');
    host.replaceChildren();
    chrome(host, {});

    const wrap = el('div', { class: 'home' });

    // The book the assessment comes from, in the language being read. Both
    // covers are embedded so switching language swaps it without a request.
    const BOOKS = {
      en: { src: covers.en, href: 'https://amzn.eu/d/09U8PhEA',
            alt: label('book_en', 'The 16Q book, English edition') },
      it: { src: covers.it, href: 'https://amzn.eu/d/0a2fIQFB',
            alt: label('book_it', 'The 16Q book, Italian edition') },
    };
    const book = BOOKS[S.lang] || BOOKS.en;
    const shelf = el('div', { class: 'covers' });
    const link = el('a', { class: 'cover', href: book.href,
                           target: '_blank', rel: 'noreferrer noopener' });
    link.appendChild(el('img', { src: book.src, alt: book.alt }));
    shelf.appendChild(link);
    wrap.appendChild(shelf);

    wrap.appendChild(el('h1', {}, label('new_assessment', 'New assessment')));
    wrap.appendChild(el('p', { class: 'home__prompt' },
                       label('assessing_prompt', 'What are you assessing?')));

    const field = el('div', { class: 'field' });
    const past = [...new Set(store.load(S.storage).assessments
      .slice().sort((a, b) => new Date(b.date) - new Date(a.date))
      .map((r) => r.activity).filter(Boolean))];

    const sel = el('select', { id: 'activity-select',
      'aria-label': label('assessing_prompt', 'Choose an activity') });
    for (const a of past) sel.appendChild(el('option', { value: a }, a));
    sel.appendChild(el('option', { value: '__new' }, label('other_activity', 'Something else…')));
    sel.hidden = past.length === 0;

    const input = el('input', { type: 'text', id: 'activity',
      placeholder: label('activity_placeholder', 'What activity are you assessing?') });
    input.hidden = past.length > 0;

    const go = el('button', { class: 'btn', type: 'button', id: 'begin' }, label('begin', 'Begin'));
    const sync = () => {
      const typing = sel.hidden || sel.value === '__new';
      input.hidden = !typing;
      S.activity = typing ? input.value.trim() : sel.value;
      go.disabled = !S.activity;
    };
    sel.addEventListener('change', sync);
    input.addEventListener('input', sync);
    go.addEventListener('click', () => { if (S.activity) startAssessment(); });

    field.append(sel, input);
    wrap.append(field, go);
    host.appendChild(wrap);
    sync();
  }

  function startAssessment() {
    S.answers = new Array(16).fill(null);
    S.qIndex = 0;
    renderQuiz();
    show('quiz');
  }

  // ---- quiz: one question at a time, four chapters ----
  const CHAPTERS = ['talent', 'technique', 'training', 'target'];
  const chapterOf = (i) => CHAPTERS[Math.floor(i / 4)];
  const reduceMotion = () => !!(global.matchMedia
    && global.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function renderQuiz() {
    const host = $('#view-quiz');
    const i = S.qIndex;
    const q = buildQuestion(i, S.activity, S.lang);
    host.replaceChildren();

    chrome(host, {
      title: `${t().chart[chapterOf(i)]} — ${(i % 4) + 1} / 4`,
      onBack: goBack,
    });
    host.appendChild(el('div', { class: 'hair' }));
    const qhead = el('div', { class: 'q-head' });
    qhead.appendChild(el('h2', { class: 'q', id: `q${i}-label` }, q.label));
    const qcap = capButton(q.label, essayFor('question', i));
    if (qcap) qhead.appendChild(qcap);
    host.appendChild(qhead);
    if (q.tip[0]) host.appendChild(el('p', { class: 'q-meas' }, q.tip[0]));

    const mid = el('div', { class: 'q-mid' });
    const block = el('div', { class: 'q-block', role: 'radiogroup',
                              'aria-labelledby': `q${i}-label` });
    if (q.tip[1]) {
      block.appendChild(el('div', { class: 'q-lab' },
        `0 · ${label('scale_low', 'Strongly disagree').toUpperCase()}`));
      block.appendChild(el('p', { class: 'q-say' }, q.tip[1]));
    }
    const rows = el('div', { class: 'q-rows' });
    for (const [from, to] of [[0, 4], [5, 9]]) {
      const row = el('div', { class: 'q-row' });
      for (let v = from; v <= to; v++) {
        const b = el('button', { type: 'button',
                                 'aria-pressed': String(S.answers[i] === v) }, String(v));
        b.addEventListener('click', () => choose(i, v, b));
        row.appendChild(b);
      }
      rows.appendChild(row);
    }
    block.appendChild(rows);
    if (q.tip[2]) {
      block.appendChild(el('div', { class: 'q-lab q-lab--after' },
        `9 · ${label('scale_high', 'Strongly agree').toUpperCase()}`));
      block.appendChild(el('p', { class: 'q-say q-say--last' }, q.tip[2]));
    }
    mid.appendChild(block);
    host.appendChild(mid);

    const steps = el('div', { class: 'steps', role: 'progressbar',
      'aria-valuemin': '0', 'aria-valuemax': '16',
      'aria-valuenow': String(S.answers.filter((v) => v !== null).length) });
    for (let n = 0; n < 16; n++) {
      steps.appendChild(el('i', S.answers[n] !== null ? { class: 'is-on' } : {}));
    }
    host.appendChild(steps);
  }

  // Selecting confirms with a short glow, then advances. The pause is what makes
  // the choice feel registered rather than snatched away.
  function choose(i, v, btn) {
    if (S.busy) return;
    S.busy = true;
    S.answers[i] = v;
    for (const sib of btn.parentElement.parentElement.querySelectorAll('button')) {
      sib.setAttribute('aria-pressed', 'false');
    }
    btn.setAttribute('aria-pressed', 'true');
    btn.classList.add('is-confirming');
    const strip = $('#view-quiz .steps');
    if (strip && strip.children[i]) strip.children[i].classList.add('is-on');

    const advance = () => {
      S.busy = false;
      if (S.qIndex < 15) { S.qIndex += 1; renderQuiz(); return; }
      // Completing the sixteenth answer persists the assessment, so it is in
      // History without anyone having to ask for it.
      const record = currentRecord();
      const res = store.add(S.storage, record);
      showResult([record], { saved: res.saved });
    };
    if (reduceMotion()) advance(); else global.setTimeout(advance, 430);
  }

  // Chevron steps back one question; from the first it returns home.
  function goBack() {
    if (S.qIndex === 0) { renderHome(); show('start'); return; }
    S.qIndex -= 1;
    renderQuiz();
  }

  const currentRecord = () => ({
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    label: S.activity, activity: S.activity, date: new Date().toISOString(),
    lang: S.lang, answers: S.answers.slice(),
  });

  // ---- result ----
  function htmlLegend() {
    const box = el('ul', { class: 'legend-html' });
    for (const key of render.RING_ORDER) {
      const li = el('li');
      li.appendChild(el('span', { class: 'swatch',
                                  style: `background:${render.RING_FILL[key]}` }));
      li.appendChild(el('span', {}, t().ranks[key]));
      box.appendChild(li);
    }
    return box;
  }

  // Quadrant totals and derived indicators only — the sixteen raw answers are
  // the input, not the reading, and listing them buried the four numbers that
  // matter. Everything is shown as a percentage so one scale runs throughout.
  const AXES = ['assets', 'impact', 'discipline', 'vision'];
  const pctOf9 = (v) => Math.round(v / 9 * 100);

  function summaryTable(records) {
    const table = el('table', { class: 'table' });
    const head = el('tr');
    head.appendChild(el('th', {}, ''));
    for (const r of records) head.appendChild(el('th', {}, r.date.slice(11, 16)));
    table.appendChild(head);

    const section = (title, rows, withCap) => {
      const h = el('tr', { class: 'is-section' });
      const cell = el('td', { colspan: String(records.length + 1) }, title);
      h.appendChild(cell);
      table.appendChild(h);
      for (const [key, name, values] of rows) {
        const tr = el('tr');
        const first = el('td', {});
        first.appendChild(el('span', {}, name));
        const cap = withCap ? capButton(name, essayFor('indicator', key)) : null;
        if (cap) first.appendChild(cap);
        tr.appendChild(first);
        for (const v of values) tr.appendChild(el('td', {}, `${v}%`));
        table.appendChild(tr);
      }
    };

    // a quadrant is four answers out of a possible 36. The quadrants carry the
    // reading link here because this is the only screen that names them; the
    // four indicators get theirs beside the section that discusses them.
    section(label('quadrants', 'Quadrants'), CHAPTERS.map((key) => [
      key, t().chart[key],
      records.map((r) => Math.round(scoring.dials(r.answers)[key] / 36 * 100)),
    ]), true);
    section(label('indicators', 'Indicators'), AXES.map((key) => [
      key, t().chart[key],
      records.map((r) => pctOf9(scoring.axes(r.answers)[key])),
    ]), false);
    return table;
  }

  const AXIS_PAIR = {
    assets:     ['talent', 'technique'],
    impact:     ['training', 'technique'],
    discipline: ['training', 'target'],
    vision:     ['talent', 'target'],
  };
  const Cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // The source remarks on an imbalance only when the two quadrants are far
  // enough apart to be worth remarking on: at least a 20% gap measured against
  // the smaller of the pair (helpers_functions.php, get_compare_text). Merely
  // being unequal is not enough — 31 against 32 is a 3% gap and stays silent.
  const MIN_IMBALANCE = 20;

  // Which of an axis's two quadrants dominates, or '' when the gap is too small
  // to be worth remarking on. Kept pure and exported so the threshold can be
  // tested without a DOM — it is the reason an axis shows no closing paragraph.
  function imbalanceKey(dials, axis) {
    const [a, b] = AXIS_PAIR[axis];
    const gap = Math.abs(dials[a] - dials[b]);
    if (!gap) return '';
    // Against a floor of zero the relative gap is unbounded, so any difference
    // qualifies; two zeros are already gone on the line above.
    const floor = Math.min(dials[a], dials[b]);
    if (floor > 0 && gap / floor * 100 < MIN_IMBALANCE) return '';
    const [hi, lo] = dials[a] > dials[b] ? [a, b] : [b, a];
    return `${Cap(hi)} > ${Cap(lo)}`;
  }

  function comparingText(record, axis) {
    const key = imbalanceKey(scoring.dials(record.answers), axis);
    return key ? (t().comparing[axis] || {})[key] || '' : '';
  }

  // Every axis carries its own band, so every axis gets its own medal.
  // Returns an array rather than a DocumentFragment: the caller appends each,
  // which keeps the contract explicit and testable without fragment semantics.
  function indicatorSections(record) {
    const out = [];
    const ax = scoring.axes(record.answers);
    for (const key of AXES) {
      const band = rank.classify(ax[key] / 9 * 100);
      const sec = el('section', { class: 'axis' });
      const head = el('div', { class: 'axis__head' });
      head.appendChild(el('img', { class: 'axis__medal', src: medals[band.medal],
                                   alt: t().ranks[band.key], width: '30' }));
      head.appendChild(el('span', { class: 'axis__name' }, t().chart[key]));
      head.appendChild(el('span', { class: 'axis__score' },
                          `${pctOf9(ax[key])}% · ${t().ranks[band.key]}`));
      const cap = capButton(t().chart[key], essayFor('indicator', key));
      if (cap) head.appendChild(cap);
      sec.appendChild(head);
      const gloss = t().ui[`${key}_description`];
      if (gloss) sec.appendChild(el('p', { class: 'axis__gloss' }, gloss));
      sec.appendChild(el('p', {}, t().indicators[key][band.key]));
      const imbalance = comparingText(record, key);
      if (imbalance) sec.appendChild(el('p', { class: 'axis__imbalance' }, imbalance));
      out.push(sec);
    }
    return out;
  }

  function showResult(records, opts = {}) {
    S.lastResult = { records, opts };
    const host = $('#view-result');
    host.replaceChildren();
    host.className = 'result';
    chrome(host, { title: label('result', 'Result'),
                   onBack: () => { renderHome(); show('start'); } });

    host.appendChild(el('h1', { class: 'result__activity' }, headerFor(records, S.lang)));

    const chartBox = el('div', { class: 'chart-wrap' });
    const svg = global.document.createElementNS(render.NS, 'svg');
    svg.setAttribute('viewBox', '0 0 1000 1000');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    chartBox.appendChild(svg);
    host.appendChild(chartBox);
    // The legend renders as HTML beneath the chart at every width: inside the SVG
    // it shrinks with the drawing and stops being readable. PNG export builds its
    // own clone with the SVG legend switched on.
    render.drawChart(svg, { records, lang: S.lang, showLegend: false });

    // Each score is its own centred column, so comparing two lines the medals,
    // percentages, ranks and timestamps up with each other.
    const { light } = render.assignSeries(records);
    const board = el('div', { class: 'scoreboard' });
    for (const r of records) {
      const pct = scoring.percentage(r.answers);
      const band = rank.classify(pct);
      const col = el('div', { class: 'scorecol' });
      if (records.length > 1) {
        col.appendChild(el('span', {
          class: 'scorecol__series',
          style: `background:${r === light ? '#fff' : '#7a7979'}`,
          title: r === light ? label('newer', 'Newer') : label('older', 'Older'),
        }));
      }
      col.appendChild(el('img', { class: 'scorecol__medal', src: medals[band.medal],
                                  alt: t().ranks[band.key], width: '52' }));
      col.appendChild(el('span', { class: 'scorecol__pct' }, `${pct}%`));
      col.appendChild(el('span', { class: 'scorecol__rank' }, t().ranks[band.key]));
      col.appendChild(el('span', { class: 'scorecol__when' },
                        `${r.date.slice(0, 10)} · ${r.date.slice(11, 16)}`));
      board.appendChild(col);
    }
    host.appendChild(board);

    host.appendChild(htmlLegend());
    host.appendChild(summaryTable(records));
    // The written interpretation describes one assessment only. With two on
    // screen that is not self-evident, so name which.
    const subject = records[records.length - 1];
    if (records.length > 1) {
      host.appendChild(el('p', { class: 'axis-note' },
        strings.format(label('interpretation_note', 'Interpretation — newer assessment, %s'),
                       `${subject.date.slice(0, 10)} · ${subject.date.slice(11, 16)}`)));
    }
    for (const sec of indicatorSections(subject)) host.appendChild(sec);

    const bar = el('div', { class: 'actions' });
    const status = el('p', { class: 'status', role: 'status' });

    // opts.saved is set only when this result was just completed; viewing an
    // existing assessment from History reports nothing.
    if (opts.saved === true) status.textContent = label('saved_auto', 'Saved to your history.');
    else if (opts.saved === false) {
      status.textContent = label('save_failed', 'Could not save. Export it to keep it.');
      status.className = 'status warn';
    }

    const pngBtn = el('button', { class: 'btn btn--quiet', type: 'button' },
                      label('export_png', 'Export PNG'));
    pngBtn.addEventListener('click', () => {
      png.exportChart({ records, lang: S.lang, filename: '16q-chart.png' })
        .catch((e) => { status.textContent = `${label('png_failed', 'Export failed')}: ${e.message}`; });
    });
    bar.appendChild(pngBtn);
    const again = el('button', { class: 'btn', type: 'button' },
                     label('new_assessment', 'New assessment'));
    again.addEventListener('click', () => { renderHome(); show('start'); });
    bar.appendChild(again);
    host.append(bar, status);
    show('result');
  }

  // ---- history ----
  // Rows carry their own score and rank, so the list is readable on its own
  // rather than being a set of labels you have to open to understand.
  // opts: { confirmId } marks a row awaiting delete confirmation;
  //       { notice }    carries a message across a re-render, e.g. after import.
  function renderHistory(opts = {}) {
    const { confirmId, notice } = opts;
    const host = $('#view-history');
    host.replaceChildren();
    chrome(host, { title: label('history', 'Past assessments'),
                   onBack: () => { renderHome(); show('start'); } });

    const all = store.load(S.storage).assessments
      .slice().sort((a, b) => new Date(b.date) - new Date(a.date));
    if (!all.length) {
      if (notice) host.appendChild(el('p', { class: 'status hnotice', role: 'status' }, notice));
      host.appendChild(el('p', { class: 'note empty' },
                         label('history_empty', 'No saved assessments yet.')));
      return;
    }

    if (notice) host.appendChild(el('p', { class: 'status hnotice', role: 'status' }, notice));
    host.appendChild(el('p', { class: 'hhint' },
      label('select_hint', 'Select one to view, or two to compare.')));

    const list = el('ul', { class: 'hlist' });
    for (const r of all) {
      const li = el('li', { class: 'hrow' });

      // Deleting is not undoable, so it asks first — in place, rather than in a
      // browser dialog that blocks the page and belongs to no design.
      if (confirmId === r.id) {
        li.className = 'hrow hrow--confirm';
        li.appendChild(el('span', { class: 'hrow__ask' },
          label('delete_confirm_msg', 'Are you sure you want to delete this evaluation?')));
        const yes = el('button', { class: 'hbtn hbtn--danger', type: 'button' },
                       label('delete', 'Delete'));
        yes.addEventListener('click', () => {
          store.remove(S.storage, r.id);
          S.selected = S.selected.filter((id) => id !== r.id);
          renderHistory();
        });
        const no = el('button', { class: 'hbtn', type: 'button' }, label('cancel', 'Cancel'));
        no.addEventListener('click', () => renderHistory());
        // Grouped so the pair wraps as one unit. Left as siblings of the
        // question, a middling width fits Delete beside it and pushes Cancel
        // onto a line of its own.
        const acts = el('div', { class: 'hrow__acts' });
        acts.append(yes, no);
        li.appendChild(acts);
        list.appendChild(li);
        continue;
      }

      const pct = scoring.percentage(r.answers);
      const band = rank.classify(pct);
      const picked = S.selected.includes(r.id);
      if (picked) li.className = 'hrow is-picked';

      const pick = el('input', { type: 'checkbox', class: 'hrow__pick',
                                 'aria-label': `${r.activity} ${r.date.slice(0, 10)}` });
      pick.checked = picked;
      pick.addEventListener('change', () => {
        S.selected = pick.checked
          ? [...S.selected, r.id].slice(-2)
          : S.selected.filter((id) => id !== r.id);
        renderHistory();
      });

      const main = el('div', { class: 'hrow__main' });
      main.appendChild(el('span', { class: 'hrow__activity' }, r.activity || r.label));
      main.appendChild(el('span', { class: 'hrow__when' },
                          `${r.date.slice(0, 10)} · ${r.date.slice(11, 16)}`));

      const score = el('div', { class: 'hrow__score' });
      const nums = el('div', { class: 'hrow__nums' });
      nums.appendChild(el('span', { class: 'hrow__pct' }, `${pct}%`));
      nums.appendChild(el('span', { class: 'hrow__rank' }, t().ranks[band.key]));
      score.appendChild(nums);
      score.appendChild(el('img', { class: 'hrow__medal', src: medals[band.medal],
                                    alt: t().ranks[band.key], width: '26' }));

      const del = el('button', { class: 'hrow__del', type: 'button',
                                 'aria-label': label('delete', 'Delete') }, '×');
      del.addEventListener('click', () => renderHistory({ confirmId: r.id }));

      li.append(pick, main, score, del);
      list.appendChild(li);
    }
    host.appendChild(list);

    const bar = el('div', { class: 'actions' });
    const view = el('button', { class: 'btn', type: 'button' }, S.selected.length > 1
      ? label('compare', 'Compare') : label('view', 'View'));
    view.disabled = S.selected.length === 0;
    view.addEventListener('click', () => {
      // oldest-first: assignSeries resolves timestamp ties by input order
      showResult(all.filter((r) => S.selected.includes(r.id))
                    .sort((a, b) => new Date(a.date) - new Date(b.date)));
    });
    bar.appendChild(view);
    host.appendChild(bar);
  }

  // ---- data ----
  // `notice` survives the re-render a successful import triggers; setting the
  // status before rebuilding would write to an element about to be discarded.
  function renderData(notice) {
    const host = $('#view-data');
    host.replaceChildren();
    chrome(host, { title: label('your_data', 'Your data'),
                   onBack: () => { renderHome(); show('start'); } });

    const state = store.load(S.storage);
    const count = state.assessments.length;
    const activities = [...new Set(state.assessments.map((r) => r.activity).filter(Boolean))];
    const oldest = state.assessments
      .map((r) => r.date).sort()[0];

    // What is actually here, so "export" means something concrete.
    const summary = el('div', { class: 'data-summary' });
    summary.appendChild(el('span', { class: 'data-summary__count' }, count
      ? counted('stored_count', count, '%s assessment stored', '%s assessments stored')
      : label('stored_none', 'Nothing stored yet')));
    if (count) {
      summary.appendChild(el('span', { class: 'data-summary__detail' },
        `${activities.join(' · ')}${oldest ? ` — ${label('since', 'since')} ${oldest.slice(0, 10)}` : ''}`));
    }
    host.appendChild(summary);

    if (!store.available(S.storage)) {
      host.appendChild(el('p', { class: 'warn' }, label('no_storage',
        'This browser is not allowing local storage, so nothing can be kept between '
        + 'visits. You can still complete an assessment and export it.')));
    }

    // ---- export ----
    const exportBlock = el('section', { class: 'block' });
    exportBlock.appendChild(el('h2', { class: 'block__title' }, label('export_title', 'Export')));
    exportBlock.appendChild(el('p', { class: 'block__blurb' }, label('export_blurb',
      'One file containing every assessment. This is the durable copy — keep it somewhere safe.')));
    const out = el('button', { class: 'btn', type: 'button' }, count
      ? counted('export_count', count, 'Export %s assessment', 'Export %s assessments')
      : label('export_json', 'Export'));
    out.disabled = count === 0;
    out.addEventListener('click', () => {
      const text = store.serialise(store.load(S.storage));
      const name = `16q-export-${new Date().toISOString().slice(0, 10)}.json`;
      const blob = new global.Blob([text], { type: 'application/json' });
      const href = global.URL.createObjectURL(blob);
      const a = el('a', { href, download: name });
      global.document.body.appendChild(a);
      a.click();
      global.document.body.removeChild(a);
      global.URL.revokeObjectURL(href);
      exportStatus.textContent = strings.format(label('exported', 'Exported to %s'), name);
    });
    const exportStatus = el('p', { class: 'status', role: 'status' });
    exportBlock.append(out, exportStatus);
    host.appendChild(exportBlock);

    // ---- import ----
    const importBlock = el('section', { class: 'block' });
    importBlock.appendChild(el('h2', { class: 'block__title' }, label('import_title', 'Import')));
    importBlock.appendChild(el('p', { class: 'block__blurb' }, label('import_blurb',
      'Add assessments from a file you exported earlier.')));

    // A named choice with its consequence spelled out beats a bare dropdown:
    // one of these options destroys data.
    const choices = el('div', { class: 'choices', role: 'radiogroup',
                                'aria-label': label('import_json', 'Import') });
    let mode = 'merge';
    const opts = [
      ['merge', label('merge', 'Merge'), label('merge_blurb', 'Keep what is here and add the file’s assessments.')],
      ['replace', label('replace', 'Replace'), label('replace_blurb', 'Discard what is here and use the file instead.')],
    ];
    const buttons = [];
    for (const [value, name, blurb] of opts) {
      const b = el('button', { class: 'choice', type: 'button',
                               'aria-pressed': String(mode === value) });
      b.appendChild(el('span', { class: 'choice__name' }, name));
      b.appendChild(el('span', { class: 'choice__blurb' }, blurb));
      b.addEventListener('click', () => {
        mode = value;
        for (const other of buttons) other.setAttribute('aria-pressed', String(other === b));
      });
      buttons.push(b);
      choices.appendChild(b);
    }
    importBlock.appendChild(choices);

    const importStatus = el('p', { class: 'status', role: 'status' });
    if (notice) importStatus.textContent = notice;
    const file = el('input', { type: 'file', accept: 'application/json,.json',
                               id: 'import-file', class: 'filepick__input' });
    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      if (!f) return;
      const reader = new global.FileReader();
      reader.onload = () => {
        const parsed = store.parse(String(reader.result));
        if (!parsed.ok) {
          importStatus.textContent = parsed.error;
          importStatus.className = 'status warn';
          return;
        }
        const held = mode === 'merge' ? store.load(S.storage).assessments.length : 0;
        const next = mode === 'merge'
          ? store.merge(store.load(S.storage), parsed.state)
          : parsed.state;
        // What arrived, not what is now on file: merging skips duplicates, so
        // the total would credit the import with assessments already held.
        const added = next.assessments.length - held;
        if (store.save(S.storage, next)) {
          // Go to where the assessments now are, rather than leaving the reader
          // on a data screen whose summary is the only sign anything happened.
          renderHistory({ notice: counted('imported', added,
            'Imported %s assessment.', 'Imported %s assessments.') });
          show('history');
        } else {
          importStatus.className = 'status warn';
          importStatus.textContent = label('import_failed', 'Could not write to storage.');
        }
      };
      reader.onerror = () => {
        importStatus.className = 'status warn';
        importStatus.textContent = label('read_failed', 'Could not read that file.');
      };
      reader.readAsText(f);
    });
    // The browser's own control, visible and clicked directly. Three attempts
    // at a prettier wrapper — a <label for>, a forwarded .click(), a
    // zero-opacity overlay — all failed in Chrome on macOS. The native input
    // cannot fail, and ::file-selector-button styles the part that matters.
    const pick = el('div', { class: 'filepick' });
    pick.appendChild(el('span', { class: 'filepick__caption' },
                        label('choose_file', 'Choose a file')));
    pick.appendChild(file);
    importBlock.append(pick, importStatus);
    host.appendChild(importBlock);

    // ---- where it lives ----
    const note = el('section', { class: 'block block--quiet' });
    note.appendChild(el('h2', { class: 'block__title' },
                       label('where_it_lives', 'Where your data lives')));
    note.appendChild(el('p', { class: 'note' }, label('data_note',
      'Results are stored in this browser. Every local copy of this file shares one '
      + 'store, so another copy can see and overwrite them. The exported file is the '
      + 'durable copy — export regularly.')));
    host.appendChild(note);
  }

  // Re-render whatever is on screen, e.g. after a language change.
  function rerender() {
    const current = VIEWS.find((v) => {
      const node = global.document.getElementById(`view-${v}`);
      return node && !node.hidden;
    }) || 'start';
    if (current === 'quiz') renderQuiz();
    else if (current === 'result' && S.lastResult) {
      showResult(S.lastResult.records, S.lastResult.opts); return;
    } else if (current === 'history') renderHistory();
    else if (current === 'data') renderData();
    else renderHome();
    show(current);
  }

  function init(root, storage) {
    S.storage = storage || global.localStorage;
    const sc = $('#scrim');
    if (sc) sc.addEventListener('click', closeDrawer);
    if (global.document) {
      global.document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        // The sheet sits above the drawer, so it is what Escape dismisses first.
        if (essayIsOpen()) closeEssay(); else closeDrawer();
      });
    }
    renderHome();
    show('start');
  }

  const api = { VIEWS, SCALE, buildQuestion, headerFor, show, init, imbalanceKey, MIN_IMBALANCE };
  if (typeof module === 'object' && module.exports) module.exports = api;
  else (global.Q16 = global.Q16 || {}).screens = api;
})(

  (typeof module === 'object' && module.exports) ? require('../data/strings.js')
    : (typeof globalThis !== 'undefined' ? globalThis : this).Q16.strings,
  (typeof module === 'object' && module.exports) ? require('../chart/render.js')
    : (typeof globalThis !== 'undefined' ? globalThis : this).Q16.render,
  (typeof module === 'object' && module.exports) ? require('../model/scoring.js')
    : (typeof globalThis !== 'undefined' ? globalThis : this).Q16.scoring,
  (typeof module === 'object' && module.exports) ? require('../model/rank.js')
    : (typeof globalThis !== 'undefined' ? globalThis : this).Q16.rank,
  (typeof module === 'object' && module.exports) ? require('../app/store.js')
    : (typeof globalThis !== 'undefined' ? globalThis : this).Q16.store,
  (typeof module === 'object' && module.exports) ? require('../data/medals.js')
    : (typeof globalThis !== 'undefined' ? globalThis : this).Q16.medals,
  (typeof module === 'object' && module.exports) ? require('../app/png.js')
    : (typeof globalThis !== 'undefined' ? globalThis : this).Q16.png,
  (typeof module === 'object' && module.exports) ? require('../chart/geometry.js')
    : (typeof globalThis !== 'undefined' ? globalThis : this).Q16.geometry,
  (typeof module === 'object' && module.exports) ? require('../data/covers.js')
    : (typeof globalThis !== 'undefined' ? globalThis : this).Q16.covers,
  (typeof module === 'object' && module.exports) ? require('../data/moreinfo.js')
    : (typeof globalThis !== 'undefined' ? globalThis : this).Q16.moreinfo
);

    document.addEventListener('DOMContentLoaded', () => {
      let storage = null;
      try { storage = window.localStorage; } catch (_) { storage = null; }
      // A null storage still satisfies store.js — every access is wrapped.
      Q16.screens.init(document.getElementById('app'), storage || {
        getItem() { return null; }, setItem() { throw new Error('unavailable'); },
        removeItem() {},
