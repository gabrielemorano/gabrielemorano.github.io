enga.</p><p>Devi essere performante al meglio delle tue possibilità utilizzando la Tecnica come strumento di realizzazione. Le tue consulenze, le tue performance sportive, qualunque sia l’oggetto della tua attività per la quale usi 16Q, saranno il frutto di competenza che si basa sulla Tecnica. Ma quella Tecnica dovrà essere talmente tua da identificarti e differenziarti senza che si scorga distanza da te. Possedendola semplicemente ti apparterrà ma ad un occhio attento sarà come mostrare mercanzia. La differenza è sostanziale.</p><p>Imparare ad apprendere nella forma più alta significa quindi “Essere la Tecnica” e non “Avere la Tecnica”.</p><blockquote><p>“Gli studenti che fanno propria la modalità dell’avere si prefiggono un’unica meta: mantenere ciò che hanno appreso, registrandolo esattamente nella propria memoria oppure conservandone accuratamente le annotazioni. […] Il processo di apprendimento è di tutt’altro tipo per quegli studenti che fanno propria la modalità di rapporto con il mondo incentrata sull’essere. […] Non acquisiscono semplicemente conoscenze, un bagaglio da portarsi a casa e imparare a memoria. Ognuno di loro è stato coinvolto ed è mutato: ognuno dopo la lezione è diverso da come era prima”</p><p>Erich Fromm – Avere o essere?</p></blockquote><p>Per sintetizzare necessitiamo di:</p><ul><li>Fiducia intesa come senso di controllo sulla realtà che ci circonda e che pensiamo di poter modificare con il nostro operato</li><li>Curiosità intesa come piacere della scoperta</li><li>Intenzionalità ovvero la voglia di essere decisivi e pertinaci</li><li>Autocontrollo e consapevolezza dei propri comportamenti e dei propri pensieri</li></ul>",
      "<p>Citanto Carol Dweck:</p><blockquote><p>“Abbiamo cresciuto una generazione che non riesce a vivere senza continue validazioni e riconoscimenti dall’esterno per via del sistema scolastico e non solo. Il significato del sacrificio e della difficoltà sono trasformati quando comprendiamo che le capacità e le competenze possono essere accresciute attraverso un approccio mentale consapevole che solo con la pratica al di fuori della comfort zone si creano nuove connessioni neuronali.”</p><p><a href=\"https://youtu.be/_X0mgOOSpLU\" target=\"_blank\" rel=\"noreferrer noopener\">TED 09/2014</a></p></blockquote><p>Quindi nella comfort zone non avvertiamo difficoltà e non determiniamo un ampliamento del perimetro del “conosciuto” cosicché ogni input che riceviamo dall’esterno è come se fosse compreso nello stesso perimetro perché già sperimentato.</p><p>La comfort zone si sperimenta e quindi si percepisce ponendo uno sguardo critico alle nostre reazioni agli stimoli esterni. Essa va prefigurata e vissuta come un recinto.</p><p>Esercizio utile è quello di rappresentare su un foglio di carta un perimetro al cui interno ci siamo noi. All’interno, a farci compagnia, ci saranno il know-how e le attività, con le relative emozioni e stati d’animo associati, quante più possiamo richiamarne.</p><p>Quella tracciata è una mappa della comfort zone.</p><p>Al di fuori di essa porremo quel che non sappiamo fare, di cui non abbiamo padronanza, quel che temiamo di trovarci a dover fare e le relative emozioni e stati d’animo.</p><p>L’immagine creata aiuta a consapevolizzare l’area utile del Training attraverso la corretta visione del perimetro della comfort zone. Perimetro che, nel tempo, è soggetto a variazioni continue in funzione della qualità del Training, come vedremo.</p><p>È utile fare questa verifica di continuo immaginando che all’interno della comfort zone tutto è gestito al meglio secondo criteri di massima efficienza della performance.</p><p>Le connessioni neuronali necessarie, a che questo avvenga, e relative al know-how e alle attività che abbiamo ricompreso nell’area, sono tutte presenti.</p><p>Ovviamente potremo accorgerci che alcune attività o sfumature siano boarderline o addirittura fuori della comfort zone sia per una involuzione sia per una errata percezione di noi stessi.</p><p>Generalmente la comfort zone ha uno zoccolo duro inattaccabile, una sorta di patrimonio di base acquisito soprattutto nelle attività da noi più sperimentate e possibilmente iniziate sin da piccoli. Esempi ne sono il bilinguismo, le attività motorie in genere oltre quelle fisiche come la bicicletta e il nuoto e i vari sport. Nel tempo si accresce questa area con altri contenuti, leggere, scrivere, guidare per cui, se tutto questo, ci creava all’inizio ansia, successivamente, questo know-how entra stabilmente nel perimetro ampliando lo stesso.</p><p>Per puntare, quindi, al 9, in questa prima Autoverifica, è necessario saper affinare la percezione esatta della comfort zone attraverso una cosciente ed attenta osservazione delle attività da svolgere in ordine ad un obiettivo e degli stati d’animo correlati. Ricordiamo che guidare, leggere o scrivere così come camminare appartengono alla comfort zone proprio perché non generano emozioni critiche tali da impegnare risorse mentali specifiche intese come presenza di spirito dedicata.</p><p>Va tenuto conto che la definizione e l’individuazione della comfort zone è un processo per step successivi talvolta day by day dove risulta utile annotare le sensazioni che affiorano nel quotidiano. La comfort zone è studio dei propri limiti intesi come soglia entro la quale eseguiamo performance in assoluto contesto di competenza inconscia.</p>",
      "<blockquote><p>“È provato infatti che ogniqualvolta usciamo dalla nostra comfort zone creiamo nuove connessioni fra i neuroni. È la cultura del “non ancora” ovvero mi trovo lungo la curva di apprendimento. Quindi va sviluppata la mentalità di crescita basata sulla certezza che la capacità di apprendimento non è fissa e immutabile ma cambia in funzione dei nostri sforzi e sacrifici. Non riuscire non è una condizione permanente bensì transitoria.”</p><p><a href=\"https://youtu.be/_X0mgOOSpLU\" target=\"_blank\" rel=\"noreferrer noopener\">Carol Dweck TED 09/2014</a></p></blockquote><p>Per ottenere un 9 in quest’area di miglioramento è necessario avere la consapevolezza che nuove connessioni neuronali devono nascere e nuove sinapsi devono aver luogo. Tutto questo non avviene da sé ma solo con un determinato stimolo.</p><p>La contezza della comfort zone ci dona una rappresentazione del perimetro da ampliare, della soglia da superare, delle nostre colonne di Ercole. Lì e soltanto lì, in mare aperto e mai navigato, impariamo a fronteggiare imprevisti e situazioni sconosciute, sfide e soluzioni a problemi mai affrontati. Il perimetro del conosciuto si amplia e gli stati d’animo correlati si uniformano nella calma dell’esecuzione.</p><p>Ma per ottenere 9 in questa autoverifica devo avere, si passi l’espressione, una reazione Pavloviana alla vista o al pensiero del perimetro della comfort zone.</p><p>La comfort zone è una certezza ma anche il nostro nemico numero uno! Per essere Ace in quest’area dobbiamo essere spesso e volentieri oltre soglia. In quell’area dove l’errore sovente incombe come fattore limitante e destinato a limarsi con l’assidua permanenza in essa e con la pratica deliberata.</p><p>Per ottenere 9 devo saper amare la uncomfort zone. Devo “sapermi sentire” Ulisse ogni giorno. Devo diventare Ulisse.</p><p>Ricordiamo anche Emil Cioran: «Se cambi il tuo atteggiamento verso le cose, finisci per cambiare le cose».</p>",
      "<p>Per questa autoverifica siamo dinanzi ad una variabile di tipo “quantitativo”. I meccanismi che regolano l’apprendimento presuppongo applicazione continua e perseverante. Come ci è noto e come comprenderemo sempre meglio, alcuni fattori da cui dipende l’efficienza della performance sono quelli attinenti lo svolgimento della pratica deliberata per un periodo necessario ad attivare nuove connessioni neuronali senza le quali la stessa attività apparterrà a categorie diverse dalla competenza inconscia che è, invece, il nostro precipuo obiettivo. Altresì, sappiamo che il successo non è solo legato a profili “quantitativi” ma anche alla sinergia con quelli qualitativi. Ma la base biologica da cui non possiamo sfuggire e che attiene alle caratteristiche genetiche umane che, ricordiamo, mutano solo dopo millenni, impone che si proceda attraverso tentativi ed errori fino a rendere l’incidenza statistica di questi ultimi prossima allo zero.</p><p>Pertanto è fondamentale aver chiaro quale sia il livello di allenamento di un vero Professionista, un Asso, evitando soprattutto di banalizzare il problema come spesso accade. In tal senso non può sfuggirci che prima di divenire Asso, un professionista è passato attraverso tutti gli stadi intermedi di “padronanza” intesa come abilità all’esecuzione. Che non è solo tecnica ma anche di quiete emotiva come abbiamo visto in precedenza.</p><p>L’unica pratica che permette di progredire da uno stadio all’altro è quella deliberata, ovvero, cosciente del superamento della soglia di comfort. Il processo per “tentativi ed errori” indica e caratterizza l’accesso alla pratica deliberata, laddove, certi di allenarci e misurarci, poniamo l’attenzione specifica alle difficoltà al fine di superarle con l’applicazione massima. Si tratta di garantire durante l’ “allenamento”, in senso lato, la nostra presenza di spirito.</p><p>Pertanto, riassumendo, devo uscire dalla zona di comfort (il che è certificato dal fatto che commetto errori e necessito di “metterci la testa” nell’esecuzione di quella specifica attività), inoltre, devo essere profondamente presente a me stesso e applicarmi per un numero sufficiente di ore ogni giorno per accelerare l’ampliamento dei perimetri della comfort zone e quindi delle competenze inconsce.</p><p>Esempio classico, quello del pilota di aerei che deve accumulare un certo numero di ore di volo tra aereo e simulatore affinché sia in grado di gestire ogni possibile situazione dominando non solo l’aereo su cui vola ma anche le sue emozioni. Queste ultime non si manifesteranno in tutta la loro gravità quando gli eventi e le variabili esogene siano state vissute, in precedenza, ripetutamente.</p><p>L’Asso ha dalla sua di aver sperimentato numerose, diverse situazioni, più e più volte avendo dedicato sé stesso a risolvere i problemi in esse insiti.</p><p>Capita al chirurgo che diviene esperto nel tempo, capita al commerciale che deve affrontare le eccezioni più disparate da parte dei suoi potenziali clienti, capita all’avvocato che deve esporre le sue tesi talvolta ardite per convincere chi giudicherà il suo cliente.</p><p>Posso tendere al 9 quando il mio allenamento sia realmente “ispirato” e capace di mantenere viva la presenza di spirito per cogliere l’errore incombente e riprovare la medesima attività, il medesimo gesto, perfezionandolo ed eliminando l’errore commesso in precedenza. Il 9 spetta a chi non “subisce” nemmeno un solo frangente del proprio workout. Qualunque forma esso assuma.</p>",
      "<p>Qui siamo in piena autovalutazione. Semplicemente perché nessuno meglio di noi potrà mai valutare il nostro appagamento al termine di una sessione di addestramento, formazione, allenamento. Quel senso di pienezza che ci coglie nell’attimo in cui realizziamo di aver impiegato il tempo al meglio e abbiamo contribuito in modo fattivo alla nostra crescita. Siamo certi di aver accresciuto il nostro potenziale.</p><p>Qui troviamo un nesso sotterraneo con il bagaglio tecnico e con la motivazione.</p><p>Subentra, a ben guardare, una componente “culturale” del training e legata alla percezione della naturale ed ovvia fatica discendente dalla pratica profonda.</p><p>Ricordiamo che la parola sacrificio deriva da Sacrum facere. Il punto è nodale in quanto nella nostra mente l’approccio deve essere ispirato a tale etimologia. Ovvero la pratica profonda è un operare che assume caratteri di sacralità in termini quasi rituali. Allenarsi è infatti un rito e come tale un momento dedicato e a carattere speciale. Istanti, momenti, ore dedicati a noi stessi e alla nostra capacità di “imparare ad apprendere” sempre più a fondo. È un viaggio attraverso noi stessi e i nostri limiti. Siamo, in questo, simili ad Ulisse. Il senso di soddisfazione deriverà e andrà misurato non solo in relazione alla migliorata padronanza tecnica percepita dopo un allenamento o una lezione ma in termini di percezione dell’importanza che attribuisco al rituale dell’allenamento e alla gratificazione che mi restituisce l’aver consapevolmente dedicato tempo al mio percorso in direzione Ace.</p><p>Pertanto, per puntare al 9 in questa autoverifica, va consapevolizzata, al di sopra di ogni cosa, la certezza dell’utilità del rito del training. Mi darò 9 quando nemmeno per un attimo considererò alienante allenarmi e tanto più quando il senso di pienezza mi proietta in una dimensione consapevole e superiore di mastery.</p><blockquote><p>Gli stadi iniziali dell’apprendimento di un’abilità comportano, per forza di cose, un certo tedio. Piuttosto che evitarlo, dovete accettarlo e farlo vostro. La sofferenza e la noia che proviamo agli inizi rafforzano infatti la nostra mente. (...) La sofferenza è una sfida che la vostra mente vi presenta: imparerete a concentrarvi e a superare la noia, oppure vi arrenderete al bisogno del piacere e di una distrazione come un bambino?</p><p>(Robert Greene - Riprenditi la tua vita)</p></blockquote><p>Ecco questo è il punto cruciale. Diamoci 9 quando la sofferenza è una sfida al punto tale da restituirci soddisfazione al termine dell’attività svolta.</p><p>Devi sapere che chi ha successo, da bambino, ha generalmente avuto occasione di sentirsi particolarmente bravo in qualcosa, un’attività, una materia a scuola, un gioco, uno sport, con uno strumento e per il quale veniva adulato o che lo faceva sentire unico e speciale. Allora, ancor di più possiamo puntare al 9 se siamo depositari di questo codice emotivo, consci che ogni processo di apprendimento e miglioramento assoluto o relativo passa necessariamente per la frustrazione cui non si deve cedere mai. E nel non cederle, la soddisfazione deve essere massima. La consapevolezza di questa forza interiore che non cede mai il passo alla sofferenza della pratica ed impermeabile alla frustrazione, rappresenta il 9. Ricorda che la frustrazione non è altro che un segnale importante e decisivo. Sei uscito dalla zona di comfort. Ti stai riadattando al nuovo contesto, stai prendendo le misure su un perimetro più grande. La soddisfazione può, e non è un paradosso, partire anche da qui.</p>",
      "<p>Quando ci soffermiamo a pensare a quale possa essere la soluzione a problemi che ci attanagliano da tempo può capitare di intravedere una luce in fondo al tunnel sotto forma di risposta semplice e lineare.</p><p>Soluzioni complesse e soluzioni semplici appartengono a zone differenti del nostro cervello. Le prime si articolano mettendo in moto la capacità di analisi dei dati disponibili e acquisibili approfondendo e studiando ma, soprattutto, vincendo la naturale ritrosia ad attivare quello che Kanheman definisce come Sistema 2. La parte del cervello che consuma di più e ci impegna a fondo.</p><p>Le soluzioni più semplici si prendono sulla base di associazioni di idee, immagini, emozioni, stati d’animo e dati esperienziali.</p><p>È stato dimostrato da numerosi studi che la gran parte delle persone tende a prendere decisioni utilizzando quasi sempre il Sistema 1, quello fondato sulle associazioni e non sulle analisi.</p><p>Non è detto che questo meccanismo non funzioni ma gli stessi studi dimostrano anche quanti paradossi si verifichino e quante risposte irrazionali ne derivino.</p><p>Semplicemente tocchiamo una corda essenziale per la definizione della nostra riuscita qualunque cosa si decida di fare.</p><p>Intendiamo chiarire che un obiettivo non misurabile non è un obiettivo. Un obiettivo non misurabile è anche un obiettivo non raggiungibile perché, ai nostri fini, inesistente. Una semplice espressione di filosofia di vita e nulla più.</p><p>Pertanto, dopo aver premesso quanto sopra, il Target necessita di una precisa ed esatta misurabilità che dipenderà dalla sua natura.</p><p>Il metro potrà essere il tempo e un aspetto quanti/qualitativo. Potrei esprimerlo in termini di posizione gerarchica da raggiungere all’interno di una carriera aziendale, di una posizione di mercato specifica, di una competenza particolare, di una cifra da guadagnare. Purché sia posizionata sull’asse dei tempi in modo coerente.</p><p>Per far questo tracciamo sempre l’asse dei tempi e rappresentiamo il lasso che ci separa dall’obiettivo e che riteniamo credibile per il raggiungimento.</p><p>Ma per un obiettivo credibile, motivante e spendibile nel proprio processo di crescita, è necessario attivare il Sistema 2, quello che richiede analisi di coerenza. Dobbiamo mettere al bando il Sistema 1, quello intuitivo e fondato sulle semplici associazioni.</p><p>Quanti più dati analizziamo e abbiamo a disposizione nel definire l’obiettivo, tanto più mi avvicino al 9. È una messa a fuoco tipica di chi esegue una fotografia senza l’ausilio di sistemi automatici.</p><p>Ecco, il Sistema 1 tende ad essere invasivo così come lo è una messa a fuoco di una camera digitale e funzionerà fin quando non lo disattiveremo. Nella maggior parte dei casi ci aiuta a risparmiare energie. Ad esempio quando dobbiamo scegliere un piatto nel menù, quando dobbiamo decidere se alzarci o meno per afferrare un oggetto o se il risultato di 25 x 25 assomiglia più a 625 o a 1000.</p><p>L’abilità sta proprio qui. Disattivare il Sistema 1: freddezza massima nel definire la misurabilità dell’obiettivo. Ogni misurazioni è scevra da condizionamenti e da emozioni di qualsiasi natura.</p><p>La parte emotiva appartiene ad altra autoverifica.</p><p>Potrei aver bisogno di giorni per raccogliere dati. Questo non deve farci paura. Non dobbiamo aver fretta perché, in metafora, se non mettiamo a fuoco il soggetto nell’obiettivo, la foto sarà sfocata e non servirà a nulla, vanificando ogni nostro sforzo.</p><p>In questa area di miglioramento più che mai sono in agguato errori da eccessiva semplificazione. Si tende a credere di aver chiaro quel che si vuole.</p><p>Qui vale una regola aurea. Poche parole e ben chiare. Non servono concetti. Serve una definizione sintetica fatta di meno sostantivi e aggettivi possibile.</p><p>“Risk manager di quattro aziende entro il …..”, “Fatturato pari a 3 milioni entro il…. ”, “Abilitazione a maestro di… entro il ”</p><p>Dietro questa apparente semplicità c’è un attento studio degli aspetti operativi, dei passi da compiere nel tempo, dei vincoli normativi, logistici etc. la cui considerazione rende credibile la misurabilità del Target.</p><p>Per tendere al 9 in questa area di miglioramento devi affinare la capacità di analisi dell’obiettivo, devi conoscerlo a fondo, instancabilmente sviscerarlo per renderlo sempre più facile da vedere e sempre più a fuoco. Per fare un paragone facile da comprendere, il Target è come un’immagine. Più la approfondisci, più la conosci, più ne aumenti i pixels e la sua risoluzione. A quel punto la tua capacità di analisi scevra da condizionamenti emotivi e associazioni da Sistema 1, di natura intuitiva, equivarrà a regolare con perizia l’obiettivo per la messa a fuoco e godere della migliore risoluzione acquisita. La misurabilità precisa e puntuale è una messa a fuoco perfetta.</p>",
      "<p>Nel libro \"16 Domande per cambiare la tua vita\" quando si affronta il tema del Target si riporta l’esperienza tratta dal famoso best seller “Lo Zen e il tiro con l’arco” in cui il maestro arciere Zen, dinanzi allo scetticismo, tutto occidentale, del suo allievo, un filosofo tedesco, che dopo anni di pratica nel tiro con l’arco, apparentemente infruttuosa, fatica oramai a credere nella filosofia Zen, mostra cosa significhi superare i limiti del razionale. Il maestro messo alla prova, a distanza di molti metri, al buio, con una benda sugli occhi, colpirà, con la sua freccia, il bersaglio. Al di là della mente, quando interiorizziamo il Target non può esservi, per ovvietà di cose, distanza da esso e conseguentemente possibilità di errore.</p><p>Non c’è testo più chiaro di questo nello specificare quanto sia possibile colpire l’obiettivo senza il minimo errore. Se puoi leggi questo libro illuminante più volte, magari ad età diverse della tua vita. Capirai che in realtà quel che di più importante hai raggiunto è stato ottenuto proprio perché non ammettevi dentro di te possibilità di errore. Eri il bersaglio che volevi colpire, eri l’obiettivo annullando di fatto la distanza fra te e questo.</p><p>La spiegazione del maestro Zen non lascia intravedere spazi di replica circa il funzionamento di questa sorta di legge del Target:</p><blockquote><p>“Sa perché non può attendere che il colpo parta e perché il fiato le viene a mancare prima che il colpo sia partito? Il tiro giusto nel momento giusto non viene perché lei non si stacca da sé stesso. Lei non è teso verso il compimento, ma attende il proprio fallimento. Finché le cose stanno così non le resta altra scelta che provocare lei stesso un accadimento che è indipendente da lei e fintanto che lei lo provoca la mano non si apre nella maniera giusta […]. Quanto più lei si ostinerà a voler imparare a far partire la freccia per colpire sicuramente il bersaglio, tanto meno le riuscirà l’una cosa, tanto più si allontanerà l’altra. Le è ostacolo una volontà troppo volitiva. Lei pensa che ciò che non fa non avvenga. […]”</p><p>Eugen Herrigel – Lo Zen e il tiro con l’arco</p></blockquote><p>Tutto questo assomiglia e ci riporta al concetto di Competenza inconscia. Il nostro agire non è inquinato da retropensieri ma affidato all’inconscio nella perfezione del gesto.</p><p>Infatti il Maestro ribadisce la soluzione ai dubbi:</p><blockquote><p>“Staccandosi da sé stesso, lasciandosi dietro tanto decisamente sé stesso e tutto ciò che è suo, che di lei non rimanga altro che una tensione senza intenzione”</p><p>(Eugen Herrigel – Lo Zen e il tiro con l’arco)</p></blockquote><p>Possiamo, quindi, attribuirci o tendere al 9 quando non comparirà alcuna volontà meramente razionale in relazione al Target.</p><p>Il Target deve lavorare in background. Un riferimento di sottofondo potente come un’eco inesauribile. Ogni dubbio in merito stimola la dimensione razionale o emotiva. Questo ci fa capire che non siamo ancora da 9 in questa area di miglioramento.</p><p>È indubbio che questo sia uno dei contesti più difficili del Metodo, sebbene, senza tema di smentita, possiamo affermare che una volta appropriatici pienamente dei concetti di base questi diverranno, immutabilmente, una leva potentissima nel nostro procedere verso l’eccellenza. Possiamo vedere questa area di miglioramento come una miniera da scavare riguardo la quale siamo certi della sua immensa ricchezza. Troveremo di certo quel filone d’oro che ci rende ricchi in senso lato. Perché avremo la certezza, di converso, che ogni qualvolta un Target non è realmente interiorizzato lasceremo spazio al retropensiero. Quanto più grande sarà questo spazio tanto più probabile l’insuccesso.</p><p>Ne consegue che l’autoverifica in questione è aspetto molto delicato e centrale nel metodo 16Q.</p><p>Il cammino verso 9 può essere lungo e pieno di ostacoli. Chi pratica la meditazione da tempo a buon livello potrebbe essere in vantaggio avendo probabilmente intuito il valore del silenzio interiore e della sospensione del giudizio.</p>",
      "<p>Rispetto all’autoverifica precedente il compito appare d’istinto più agevole. Passiamo dall’assenza di giudizio e di retropensiero, come detto, ad una dimensione emozionale forte ed inequivocabile. Un trasporto capace di distrarci dal “Qui e Ora” per infiammarci all’idea di raggiungere quell’obiettivo specifico.</p><p>Il punto in questione sfocia in qualcosa di molto più sofisticato nel momento in cui la nostra consapevolezza ci fa intuire quale sia la faccia della luna che non abbiamo mai visto. L’obiettivo che supporta la forza interiore è un’esperienza dell’essere piuttosto che dell’avere.</p><p>Ancora una volta Fromm, ancora una volta un passaggio decisivo nella cultura del nostro agire.</p><p>Giunti a tal punto della disamina complessiva del Metodo, non possiamo esimerci, in tal senso, dal rilevare che, se provenienti da una cultura dell’avere, per puntare ad avere 9 non solo in questa area ma in gran parte di esse, sia importante accedere ad una forma mentis nuova e più distaccata dalle cose e dal possesso delle stesse, compresa la conoscenza.</p><p>Ricordiamo che solo chi fa del progresso personale un’esperienza di vita e su di essa lo fonda, cristallizza dentro di sé le chiavi di volta del successo e non può temere di perderle. Perché semplicemente impossibile. Ogni esperienza la si fa propria, al contrario di coloro i quali fanno:</p><blockquote><p>“propria la modalità dell’avere si prefiggono un’unica meta: mantenere ciò che hanno appreso, registrandolo esattamente nella propria memoria oppure conservandone accuratamente le annotazioni. […] Il processo di apprendimento è di tutt’altro tipo per quegli studenti che fanno propria la modalità di rapporto con il mondo incentrata sull’essere. […] Non acquisiscono semplicemente conoscenze, un bagaglio da portarsi a casa e imparare a memoria. Ognuno di loro è stato coinvolto ed è mutato: ognuno dopo la lezione è diverso da come era prima”</p><p>Erich Fromm – Avere o Essere?</p></blockquote><p>Ecco, il punto è essere realmente diversi in virtù del Target. La forza interiore che dobbiamo valutare in questa autoverifica scaturisce dall’emozione provocata all’idea di essere definitivamente diversi da come siamo perché abbiamo avviato un processo di sviluppo personale (peraltro monitorato da noi stessi).</p><p>Non è la nostra semplice proiezione nel tempo.</p><p>Mutuando i concetti espressi da Fromm “La conoscenza ottimale” secondo la modalità dell’essere consiste nel “conoscere” più profondamente, mentre secondo la modalità dell’avere consiste nell’avere più conoscenza”, possiamo affermare che ai nostri fini crediamo talvolta di essere nell’alveo di un processo di crescita mentre in realtà stiamo semplicemente accumulando dati e informazioni che crediamo essere il Target o funzionali ad esso con la preoccupazione e l’esigenza di tenerli vivi in noi con ogni espediente.</p><p>Un autore ha affermato che il perdente si distingue dal un vincente perché il perdente è colui che dice \"si può fare ma è difficile\" mentre il vincente dice \"è difficile ma si può fare...\".</p><p>È evidente che il primo non vive per l’esperienza ma ha il focus sulla soluzione che al momento non intravede se non come bicchiere mezzo vuoto. Ritiene, allo stato dell’arte, di non possedere la chiave di volta. Il secondo è concentrato sull’esperienza, salta a piè pari l’ostacolo perché le sue emozioni lo hanno già superato. Si proietta sull’azione che genera stati emotivi. Vede il bicchiere mezzo pieno.</p><p>Importante comprendere che non ci basiamo sullo stato emotivo per concepire il Target bensì il contrario. Lo stato emotivo conferma lo status di Target degno di questo nome.</p><p>Per avere 9 in questa area dovrai allenare, innanzitutto, la tua capacità di leggere gli stati emotivi associati all’idea dell’esperienza. Stati emotivi esaltanti e in grado di supportarti nella totale indifferenza verso le potenziali difficoltà.</p><p>Ci daremo 9 quando il Target è un vero e proprio propellente di vita ed azione. E in questo contesto nessuno meglio di noi può valutarsi.</p>",
      "<p>Con questa ultima area di miglioramento trattiamo alcuni temi di estremo interesse.</p><p>Il primo riguarda la necessaria capacità di vedere ogni obiettivo, per quanto grande e soddisfacente, alla stregua di un risultato parziale.</p><p>Se il must è uscire dalla zona di comfort immaginiamo i nostri progressi a mo’ di scala di un palazzo, dove il pianerottolo sarà l’obiettivo più grande ottenuto attraverso ogni più piccolo gradino/obiettivo.</p><p>Il concetto è semplice quanto logico sebbene acquisirlo presupponga anche qui una forma mentis da “configurare” in modo che operi di default.</p><p>Un grande allenatore di calcio ama dire: “Non conservo, a casa, né foto né trofei tantomeno medaglie perché guardo avanti e quel che ho vinto, nel futuro non conta nulla”.</p><p>Ricordiamoci, infatti, che il “successo non è mai definitivo”.</p><p>Insomma, dobbiamo abituarci a pensare “che il meglio deve ancora venire” grazie alla nostra immarcescibile passione per l’eccellenza. Dobbiamo fortemente voler competere nel senso latino del termine, “cum petere” dirigersi verso una direzione ben precisa.</p><p>Esistono, sul tema, trucchi e scorciatoie ancor più potenti. Può sembrare banale suggerire di frequentare gruppi di persone con le qualità scelte e che dobbiamo allenare. Studi approfonditi e che fanno capo anche a premi Nobel dimostrano ampiamente che i processi di apprendimento di tipo inconscio-imitativo sono piuttosto potenti. Negli sport, ad esempio, è piuttosto scontato che potersi allenare o svolgere gare con atleti di livello superiore costringe ad un adattamento psico motorio significativo. Migliorano ad esempio, la velocità di esecuzione del gesto tecnico, le capacità propriocettive, la lettura delle situazioni tattiche etc.</p><p>La stessa cosa avviene in ambito di attività puramente intellettuali. Frequentare persone che parlino in modo forbito, alla lunga, migliora la nostra dialettica e arricchisce il nostro vocabolario.</p><p>Ricordiamo, inoltre, che è stato dimostrato come gruppi di persone, creati in modo spontaneo e non, abbiano base logiche di funzionamento esplicite o implicite che ne regolano i rapporti fra gli appartenenti nonché l’accoglienza o la reiezione.</p><p>Insomma esiste una sorta di marchio fatto di pensieri, come una filosofia di fondo che tende a perpetrarsi e auto rinforzarsi nel tempo anche se, man mano, i soggetti partecipanti, anche i primi “fondatori”, sono sostituiti con nuovi partecipanti. Quindi, frequentare persone o gruppi di persone, con le caratteristiche di questa area di miglioramento, in particolar modo, “soddisfatti ma incontentabili” dei traguardi raggiunti appare decisivo e soprattutto il miglior modo per porre le basi per ottenere un secco 9.</p><p>La parola d’ordine è “individua” gli ambienti migliorativi e frequentali a tutti i costi per tagliare i tempi della tua ascesa.</p><p>Pertanto, ne discende anche la necessaria analisi delle persone che frequentiamo e dei gruppi cui “apparteniamo” per scelta o per convenienza/obbligo.</p><p>Accanto alla componente descritta ne attiene, a questa area di miglioramento, un’altra che si pone come quel grimaldello di cui abbiamo bisogno per aprire ogni singolo Target sulla impervia via dell’eccellenza personale.</p><p>Il secondo elemento su cui basare la tendenza al 9 e su cui misurarci in questa specifica area è la perseveranza.</p><p>Numerosissimi studi hanno dimostrato quale sia il ruolo della grinta. Soprattutto quale sia la preponderanza della grinta rispetto alle doti puramente intellettive.</p><p>La grinta può essere allenata sin da piccoli come approccio alla vita. Come una vera e propria filosofia. Avere o essere genitori votati ad insegnare ai propri figli che ogni cosa che si inizi vada terminata (corsi di musica, sport, libri etc.), a prescindere, è una gran fortuna. Equivale a piantare il seme della buona riuscita nella vita futura.</p><p>Gli studi in materia dimostrano che quanto più il nostro obiettivo è “superiore” e in un certo senso legato alla nostra etica, tanto più la grinta e la perseveranza ci accompagneranno con assiduità.</p><p>Non è difficile immaginare quanto assolutamente relativo sia l’ostacolo o la difficoltà incontrata sul cammino di chi punta a qualcosa di grande nel lungo periodo.</p><p>La perseveranza fa sì che ogni obiettivo è asservito al successivo e tutti insieme a quello di natura etica e che possiamo chiamare superiore.</p><p>Ricordiamo, inoltre, che piccoli aggiustamenti possono liberare una grinta inaspettata che era semplicemente disponibile in noi ma che non aveva avuto occasione di mostrarsi sul campo.</p><p>Anche chiedersi come ci si vede proiettati nel lungo periodo può aiutare a risvegliare una perseveranza sopita. “Come e cosa sarò fra dieci anni?”</p><p>Capita spesso di sentire gli anziani far riferimento alla caparbietà della giovane età. Questo accade proprio perché in gioventù la capacità di sognare ben si addice alla lunga vita che abbiamo dinanzi. È la dimostrazione che proprio il “sogno”, il Target più grande di ogni altro, ci determina con forza e pertinacia. La perseveranza quindi, in un gioco di specchi riflessi, non dipende dall’età, ma si autoalimenta con la nostra capacità di sognare obiettivi in linea con la nostra natura tali da proiettarci in cima alla torre, gradino dopo gradino.</p><p>Diamoci 9 quando i successi e gli obiettivi raggiunti non hanno alcuna capacità di renderci sazi. Il 9 è solo per chi abbia raggiunto quella solidità mentale tale da consegnare al passato, di volta in volta, ogni singolo Target come grano nel silos e non come gioielli in vetrina.</p>"

    "indicators": {
      "talent": "<p>Il Talento misura il coinvolgimento, la passione che provi nello svolgere l’attività esaminata e la sua vicinanza alla tua indole più vera e profonda. Ricorda: ll Talento è di tutti ma non per tutti! Devi meritarlo. In questa area misuri la tua capacità di scoprirlo, ascoltarlo, coltivarlo.</p>",
      "technique": "<p>La Technique misura la percezione del tuo bagaglio tecnico che quanto più è completo tanto meno è di ostacolo all’esecuzione di una performance eccellente. Solo una tecnica al di sopra della media riduce al minimo il tuo impegno mentale necessario a verificare la perfetta esecuzione della tua attività. Devi essere nel “flusso”. Quanto più possibile.</p>",
      "training": "<p>Il Training misura la tua capacità di allenarti e/o formarti con metodo, in modo mirato e proficuo. Un valore basso del Training è sintomo di un approccio superficiale, di concentrazione insufficiente. Impara ad essere vigile e riconoscere gli errori. Il Training di successo chiede di essere orientato, assiduo e gestito come se fosse questione di vita o di morte.</p>",
      "target": "<p>Il Target misura la tua capacità di concepire e mettere a fuoco gli obiettivi. Il Target da un senso a quel che fai. Questa T fa capire se hai tracciato con sufficiente chiarezza il tuo cammino verso la tua realizzazione. E questo accade solo quando sei totalmente identificato con l’obiettivo. Il vero Target, anche se in modo talvolta impercettibile, ti proietta in un nuovo modo di essere.</p>",
      "assets": "<p>Il primo degli indicatori è composto dai valori raggiunti da Talent e Technique. Gli Assets sono il nostro bagaglio di risorse. È la nostra faretra nella quale compariranno più o meno frecce a seconda dei risultati ottenuti nelle autoverifiche.</p><p>Valori bassi di questo indicatore ci segnalano l’esigenza di lavorare sul piano dell’hardware. Ovvero, nella direzione degli “strumenti” di cui disponiamo per affrontare il nostro percorso, per sfidare la concorrenza e per sentirci sicuri della base su cui fonderemo il nostro successo. Difficile, infatti, poter aspirare all’eccellenza senza gli strumenti idonei.</p><p>Affrontare un’arena competitiva senza la giusta tecnica equivale ad offrire il petto nudo ai fendenti avversari.</p><p>In questo ambito, quindi, parliamo di sinergie focali, tra pure competenze fisiche e intellettive.</p><p>Il valore basso di questo indicatore impone un’analisi approfondita delle fondamenta su cui poggia il nostro progetto.</p><p>Perché questo?</p><p>Soffermiamoci a ragionare sul punto per prendere dimestichezza con il Metodo 16Q.</p><p>A titolo di puro esempio, l’Asset basso può dipendere da una delle due T o da entrambe qualora assumano valori mediocri o anche peggiori.</p><p>Nel caso si tratti della Technique, è necessaria una rivisitazione anche di altre aree di miglioramento al di fuori degli Asset. Logica vuole, per ovvietà di cose, che se questa T sia posizionata in Dilettante o Competente potrebbe necessitare del tempo, prima di vederla salire in area Asso.</p><p>Questo tempo dipende da molti fattori, le nostre capacità di apprendimento, l’impegno profuso, le cognizioni che dobbiamo assimilare etc. Ad ogni modo esiste un punto fermo e inattaccabile: ci vuole tempo. Sappiamo anche che il Target deve essere misurabile e raggiungibile attraverso una tempistica credibile e se del caso fatta di step. Può, quindi, accadere che constatare di avere un livello di Technique molto basso imponga una nuova autoverifica del Target affinché questo sia coerente e realmente sinergico.</p>",
      "impact": "<p>Questo indicatore viene misurato dall’area che risulta dagli esiti delle autoverifiche di Technique e Training.</p><p>Potremmo definirlo la parte emersa dell’iceberg. E’, infatti, quanto gli altri vedono, trattandosi di bagaglio tecnico e pratica. Ciò che a noi, realmente, interessa è la capacità di incidere, “impattare”, sulla nostra realtà.</p><p>Ci alleniamo, studiamo, approfondiamo, eseguiamo prove per accelerare lungo il nostro personalissimo percorso che ha come obiettivo quello di cambiare, in meglio, sempre e comunque, lo stato delle cose.</p><p>L’Impact restituisce una misura delle mie capacità di mettere in relazione le ore dedicate alla pratica con i miglioramenti del bagaglio tecnico. E questa miscellanea ha un impatto immediato sulla percezione della realtà che sto costruendo.</p><p>Immaginiamo di dover tenere un discorso tecnico su materie ostiche, dinanzi ad una platea di 80 persone. Nei giorni precedenti numerosi dubbi ci attanagliano sia riguardo l’emozione generata dalla platea sia dalla difficoltà di spiegare contenuti complessi.</p><p>Incombe, poi, il ricordo dell’ultimo speech in pubblico. Non fu una gran performance. Al solo ricordo ci sudano ancora le mani. Nonostante, per la nostra attività sia centrale e fondamentale saper parlare in pubblico, rappresentando una leva “commerciale” e di diffusione della nostra immagine professionale di assoluto rilievo, il test 16Q ci mette dinanzi alla triste verità. Impact ha un valore basso perché, sebbene siamo degli ottimi professionisti e in teoria pochi possono tenere testa in un confronto, non riusciamo a rendere pubblica questa nostra competenza, in quanto, in pubblico rendiamo poco. E questo si riflette anche sulle nostre capacità di monetizzare il nostro autentico valore professionale.</p><p>Decidiamo di metterci sotto. Ci alleniamo ore ed ore con piglio professionale. Con presenza di spirito e secondo i dettami del Metodo 16Q. Ampliamo l’area del Training aumentando anche il valore di Impact che rimane però al di sotto del valore Asso, per via della Technique ancora insufficiente.</p><p>Dopo numerosi cicli di Training ispirati alla pratica profonda ecco che la nostra eloquenza diviene più fluente e senza incertezze. Il timore di non padroneggiare la materia dinanzi anche a domande ed eccezioni scompare perché percepiamo che oramai la rappresentazione di quella materia ci appartiene ed è affidata alla competenza inconscia. Le risposte “fluiscono” e le parole trovano la giusta allocazione rispetto ai contenuti tecnici. Siamo giunti ad un più alto livello tecnico! Resta da lavorare sull’ansia residua per non essere abituati agli speech dinanzi a platee numerose.</p><p>Intanto ci autovalutiamo e ci accorgiamo che il nostro Impact è salito in prossimità della soglia Asso. Il risultato attiene, appunto, “a quel che so fare” nella realtà che mi circonda, Impact vero e proprio. Posso percepire in modo chiaro che ho modificato/impattato la mia realtà.</p>",
      "discipline": "<p>L’indicatore della Discipline offre numerosi spunti che consentono di approcciare al concetto espresso da questo valore in vari modi.</p><p>Daniel Goleman ci ricorda che:</p><blockquote><p>“Non esiste una capacità psicologica più importante del saper resistere agli impulsi. Essa è alla base di ogni tipo di autocontrollo emotivo”</p><p>(Daniel Goleman – Intelligenza emotiva)</p></blockquote><p>Lo stesso Goleman richiama uno studio condotto degli anni Sessanta presso un asilo, riguardante bambini di quattro anni figli di docenti, impiegati e laureati. I bambini furono sottoposti al test della caramella. Lasciati soli in aula con la possibilità di mangiare immediatamente una caramella piuttosto che riceverne in premio due, se avessero atteso il ritorno del maestro senza averne mangiato l’unica disponibile, si comportarono secondo dinamiche molto interessanti rispetto alla capacità di resistere o meno all’impulso.</p><p>Alcuni cercarono di non guardare la caramella altri tentarono di distrarsi pur di resistere mentre, i meno tenaci, non ci pensarono due volte a scartarla non appena uscito il maestro dall’aula.</p><p>A distanza di circa quattordici anni gli stessi bambini furono oggetto di osservazione. Coloro i quali avevano ottenuto due caramelle mostravano una capacità di superamento degli ostacoli e dei momenti di maggiore frustrazione, operando con grande intelligenza emotiva, dominando lo stress e mostrando sicurezza e autostima. E, cosa più decisiva, mostravano ancora la capacità di non cedere all’instant gratification in nome di qualcosa di più importante.</p><p>Chi aveva ceduto alla tentazione mostrava più ansia e inquietudine, timidezza, frustrazione, testardaggine, conflittualità e disistima ed era incapace a rinviare nel tempo la gratificazione.</p><p>Perché ho riportato questo esperimento? Semplicemente perché l’indicatore della Discipline nel complesso misura la nostra capacità di controllo di quegli impulsi che indurrebbero alla gratificazione istantanea. Saper procrastinare il piacere in nome di qualcosa per noi importante è decisivo ed è l’essenza della Discipline.</p><p>Le due T alla base del valore dell’indicatore sono il Training e il Target. Come in nessun altro indicatore le due T sono in stretta relazione e dipendenza.</p><p>Chi raggiunge i massimi livelli, in ogni settore, prova piacere (sin dalla tenera età) e senso di realizzazione nel “verificarsi” e mostrarsi grintosi e perseveranti nel Training, al fine di superare ogni ostacolo si frapponga fra loro e il successo programmato.</p><p>Notiamo che i bambini meno tenaci che avevano mangiato la caramella, in luogo di ottenerne due, presentano anche un profilo caratteriale che sfocia nella testardaggine. Dobbiamo fare una riflessione sul punto. Perseverante non equivale a testardo. Perché perseverante, ai nostri fini, è chi appare risoluto e lucido al contempo. E la lucidità è funzione del focus mantenuto sul Target. Il sapere rinviare una gratificazione può necessariamente richiedere elasticità mentale più che “rigidità normativa” quale sterile rispetto di una serie di regole autoimposte. Crediamo fortemente, invece, nella capacità di equilibrio che ogni individuo matura nel processo di accrescimento della propria consapevolezza. Un brutale programma di Training potrebbe precludere l’avvio di un circolo virtuoso fatto di entusiasmo, pertinacia e motivazione che determinano la nascita e lo sviluppo di una sana cultura del lavoro.</p><p>Inoltre, sempre Goleman, rileva che la capacità di rinviare la gratificazione, nel cammino verso il successo, incide indipendentemente dal QI. Quante volte abbiamo visto persone, di apprezzabile successo, determinate all’inverosimile ma che non appaiono particolarmente intelligenti o intuitive?</p><p>Ricapitolando, dinanzi ad un valore basso della Discipline scatta di sicuro l’allarme rosso. Dobbiamo capire se trattasi di un problema legato alla cultura del lavoro o se il Target non è per noi così intimamente importante ed eticamente “superiore” da renderci perseveranti a dismisura.</p>",
      "vision": "<p>Se con L’impact trattiamo la parte emersa dell’Iceberg qui, invece, ci occupiamo di quella sommersa.</p><p>E non a caso si trova nel diagramma 16Q all’opposto dell’Impact.</p><p>La Vision non potrà mai essere palese se non a noi e al prezzo di una spiccata capacità di interpretazione del nostro modo di essere attuale, passato e prospettico.</p><p>Trattiamo dei valori congiunti che abbiamo attribuito a Target e Talent e della loro sinergia.</p><p>Mutuando un famoso spot pubblicitario potremmo dire che “Il Talento è nulla senza il Target”.</p><p>L’indole richiede di entrare in sinergia con un obiettivo dato e ben configurato.</p><p>In assenza, esprime un valore che difficilmente verrà “messo a terra” con il pericolo di divenire un disvalore come elemento di instabilità.</p><p>La parte sommersa del nostro modo di essere, quella che determina l’approccio alla vita, è la parte più difficile da trattare. Assolutamente intangibile, questo indicatore, nel momento in cui assume un valore basso impone una rivisitazione attenta delle autoverifiche e delle dinamiche che hanno portato a quelle determinate risposte.</p><p>Una Vision in area Dilettante, ad esempio, riguardante, un’attività che svolgiamo da tempo richiede di analizzare il nostro grado di frustrazione e la scarsa attitudine al cambiamento. Può essere un segnale della ridotta capacità di ascoltare i propri bisogni se non addirittura una tendenza a negarsi valore e sogni.</p><p>In generale, la parte sommersa espressa dalla Vision ha a che fare con la nostra capacità di inseguire i sogni. Percependoli e rendendoli intelligibili prima, esaltandoli e tenendoli sempre vivi nel nostro intimo in una fase successiva.</p>"
    }
  }
};

;(function (global) {
  'use strict';

  const QUADRANTS = {

    training:  [8, 9, 10, 11],
    target:    [12, 13, 14, 15],
  };

  function dials(answers) {
    return {
      talent:    sumAt(answers, QUADRANTS.talent),
      technique: sumAt(answers, QUADRANTS.technique),
      training:  sumAt(answers, QUADRANTS.training),
      target:    sumAt(answers, QUADRANTS.target),
    };
  }

  function total(answers) {
    return answers.reduce((acc, v) => acc + Number(v || 0), 0);
  }

  function percentage(answers) {
    return Math.round(total(answers) / 1.44);

  function axes(answers) {

    const pair = (a, b) => (a + b) / 72 * 9;
    return {
      assets:     pair(d.talent, d.technique),
      impact:     pair(d.training, d.technique),
      discipline: pair(d.training, d.target),
      vision:     pair(d.talent, d.target),

;(function (global) {
  'use strict';

  // Boundaries are the ring radii expressed as a percentage of the 0-9 axis:
  // 5.5621/9, 7.0752/9, 7.8662/9. See spec section 12 — this transfer from a
  // radial limit to an aggregate percentage is an inference, not sourced.
  const RADII = { amateur: 5.5621, proficient: 7.0752, professional: 7.8662, ace: 9 };

  // Rounded to one decimal so the boundaries ARE the figures the spec documents.
  // Unrounded, 5.5621/9*100 is 61.80111…, so classify(61.8) would fall below the
  // boundary and return 'amateur' instead of 'proficient'.
  const pct = (r) => Math.round(r / 9 * 1000) / 10;

  // the higher band.
  const BANDS = [
    { key: 'amateur',      min: 0,                        colour: '#c4e5f3', medal: 'wooden' },
    { key: 'proficient',   min: pct(RADII.amateur),       colour: '#94c0e5', medal: 'bronze' },
    { key: 'professional', min: pct(RADII.proficient),    colour: '#639cd6', medal: 'silver' },
    { key: 'ace',          min: pct(RADII.professional),  colour: '#3377c8', medal: 'golden' },
  ].map((b, index) => ({ ...b, index }));

  function classify(percentage) {
    const p = Math.min(100, Math.max(0, Number(percentage) || 0));

    for (const band of BANDS) if (p >= band.min) found = band;
